 80점이 되려면 영어는 몇 점이어야 할까요?", "a": 80, "h": "세 과목 합은 240점", "s": "240 − 160 = 80 (점)", "u": "점"}, {"q": "주사위를 던져 짝수가 나올 가능성을 수로 나타내세요.", "a": "1/2", "h": "짝수는 2, 4, 6", "s": "1/2", "f": 1}, {"q": "1부터 10까지의 수 카드 중 한 장을 뽑을 때 3의 배수가 나올 가능성을 분수로 나타내세요.", "a": "3/10", "h": "3의 배수는 3, 6, 9", "s": "3/10", "f": 1}, {"q": "4번 던져 평균 23개를 넣었어요. 5번째에 몇 개를 넣어야 평균이 25개가 될까요?", "a": 33, "h": "5번의 합은 125개여야 해요.", "s": "125 − 92 = 33 (개)", "u": "개"}], "3": [{"q": "남학생 12명의 평균 몸무게는 40 kg, 여학생 8명은 35 kg이에요. 전체 평균은?", "a": 38, "h": "남녀 각각의 합부터!", "s": "(480 + 280) ÷ 20 = 38 (kg)", "u": "kg"}, {"q": "다섯 과목 평균이 86점이에요. 한 과목 점수가 6점 오르면 평균은?", "a": 87.2, "h": "합이 6점 늘어요.", "s": "(430 + 6) ÷ 5 = 87.2 (점)", "u": "점"}, {"q": "흰 공 3개, 검은 공 1개가 든 주머니에서 공 1개를 꺼낼 때 흰 공일 가능성을 분수로 나타내세요.", "a": "3/4", "h": "4개 중 3개", "s": "3/4", "f": 1}, {"q": "4회까지 평균 78점이에요. 5회에 적어도 몇 점을 받아야 평균이 80점 이상이 될까요?", "a": 88, "h": "5회까지 합이 400점 이상이어야 해요.", "s": "400 − 312 = 88 (점)", "u": "점", "top": 1}, {"q": "다섯 수의 평균은 20이에요. 한 수 34를 잘못 보고 43으로 계산했다면 잘못 구한 평균은?", "a": 21.8, "h": "합이 얼마나 커질까요?", "s": "(100 + 9) ÷ 5 = 21.8", "top": 1}]}}};
const U6={"6-1-1": {"t": "분수의 나눗셈", "concepts": [{"t": "(자연수) ÷ (자연수)를 분수로", "body": "<p>나누어지는 수가 <span class=\"hl\">분자</span>, 나누는 수가 <span class=\"hl\">분모</span>가 돼요. 3 ÷ 4는 1을 4로 나눈 것(1/4)이 3개이니 3/4이에요.</p>", "eq": "3 ÷ 4 = 3/4    7 ÷ 5 = 7/5 = 1 2/5", "check": {"q": "5 ÷ 7 은?", "opts": ["7/5", "5/7", "35"], "a": 1}}, {"t": "(분수) ÷ (자연수)", "body": "<p>분자가 자연수로 나누어떨어지면 <span class=\"hl\">분자만 나눠요</span>. 나누어떨어지지 않으면 <span class=\"hl\">× 1/(자연수)</span>로 바꿔 계산해요.</p>", "eq": "6/7 ÷ 3 = 2/7    3/5 ÷ 2 = 3/5 × 1/2 = 3/10", "check": {"q": "4/9 ÷ 2 는?", "opts": ["2/9", "8/9", "2/18"], "a": 0}}, {"t": "(대분수) ÷ (자연수)", "body": "<p>대분수는 먼저 <span class=\"hl\">가분수로 바꾼 뒤</span> 나눠요. 계산 결과는 기약분수로 나타내요.</p>", "eq": "2 1/4 ÷ 3 = 9/4 × 1/3 = 3/4", "check": {"q": "1 1/2 ÷ 3 은?", "opts": ["1/2", "1/6", "3/2"], "a": 0}}], "P": {"1": [{"q": "4 ÷ 9 의 몫을 분수로 나타내세요.", "a": "4/9", "h": "나누어지는 수는 분자, 나누는 수는 분모!", "s": "4 ÷ 9 = 4/9", "f": 1}, {"q": "7 ÷ 5 의 몫을 분수로 나타내세요.", "a": "7/5", "h": "7/5처럼 가분수로 써도, 1 2/5처럼 대분수로 써도 돼요.", "s": "7 ÷ 5 = 7/5 = 1 2/5", "f": 1}, {"q": "8/11 ÷ 4 = □", "a": "2/11", "h": "분자 8이 4로 나누어떨어져요.", "s": "8 ÷ 4 = 2 → 2/11", "f": 1}, {"q": "3/7 ÷ 2 = □", "a": "3/14", "h": "× 1/2로 바꿔 보세요.", "s": "3/7 × 1/2 = 3/14", "f": 1}, {"q": "5/6 ÷ 5 = □", "a": "1/6", "h": "분자 5를 5로 나눠요.", "s": "5 ÷ 5 = 1 → 1/6", "f": 1}, {"q": "1 1/3 ÷ 2 = □", "a": "2/3", "h": "1 1/3을 가분수로 바꾸면?", "s": "1 1/3 = 4/3, 4/3 ÷ 2 = 2/3", "f": 1}], "2": [{"q": "2 2/5 ÷ 4 = □", "a": "3/5", "h": "2 2/5 = 12/5예요.", "s": "12/5 ÷ 4 = 3/5", "f": 1}, {"q": "9/10 ÷ 6 = □", "a": "3/20", "h": "× 1/6로 바꾸고 약분해요.", "s": "9/10 × 1/6 = 9/60 = 3/20", "f": 1}, {"q": "끈 5/6 m를 5명이 똑같이 나누어 가지면 한 명은 몇 m를 가질까요?", "a": "1/6", "h": "5/6 ÷ 5를 계산해요.", "s": "5/6 ÷ 5 = 1/6 (m)", "u": "m", "f": 1}, {"q": "넓이가 3 3/4 cm²인 직사각형의 가로가 5 cm예요. 세로는 몇 cm일까요?", "a": "3/4", "h": "세로 = 넓이 ÷ 가로", "s": "3 3/4 = 15/4, 15/4 ÷ 5 = 3/4 (cm)", "u": "cm", "f": 1}, {"q": "둘레가 3 3/5 m인 정삼각형의 한 변은 몇 m일까요?", "a": "6/5", "h": "정삼각형은 세 변의 길이가 같아요.", "s": "3 3/5 = 18/5, 18/5 ÷ 3 = 6/5 = 1 1/5 (m)", "u": "m", "f": 1}, {"q": "주스 7 1/2 L를 6병에 똑같이 나누어 담으면 한 병에 몇 L일까요?", "a": "5/4", "h": "7 1/2 = 15/2예요.", "s": "15/2 ÷ 6 = 15/12 = 5/4 = 1 1/4 (L)", "u": "L", "f": 1}], "3": [{"q": "어떤 수를 4로 나누어야 할 것을 잘못하여 4를 곱했더니 3 1/5이 되었어요. 바르게 계산한 값은?", "a": "1/5", "h": "먼저 어떤 수를 구해요: □ × 4 = 3 1/5", "s": "어떤 수 = 16/5 ÷ 4 = 4/5, 바른 값 = 4/5 ÷ 4 = 1/5", "f": 1}, {"q": "15/4 ÷ 3 > □/8 에서 □ 안에 들어갈 수 있는 가장 큰 자연수는?", "a": 9, "h": "15/4 ÷ 3을 분모가 8인 분수로 나타내 보세요.", "s": "15/4 ÷ 3 = 5/4 = 10/8, 10/8 > □/8 이므로 □는 10보다 작아요 → 9"}, {"q": "일주일 동안 매일 똑같이 자라서 2 4/5 cm 자란 식물은 하루에 몇 cm씩 자랐을까요?", "a": "2/5", "h": "일주일은 7일이에요.", "s": "2 4/5 = 14/5, 14/5 ÷ 7 = 2/5 (cm)", "u": "cm", "f": 1}, {"q": "숫자 카드 2, 5, 7 중 두 장으로 진분수를 만들고, 남은 한 장의 수로 나누려고 해요. 몫이 가장 클 때의 값은?", "a": "5/14", "h": "진분수는 클수록, 나누는 수는 작을수록 몫이 커져요. 남은 카드가 2일 때를 따져 보세요.", "s": "남은 카드 2로 나누면 진분수는 5/7 → 5/7 ÷ 2 = 5/14 (다른 경우 2/35)", "f": 1, "top": 1}, {"q": "어떤 분수를 3으로 나눈 몫을 다시 4로 나누었더니 5/18이 되었어요. 어떤 분수를 6으로 나눈 몫은?", "a": "5/9", "h": "거꾸로 생각해요: 3으로 나누고 4로 나눈 것은 12로 나눈 것과 같아요.", "s": "어떤 분수 = 5/18 × 12 = 10/3, 10/3 ÷ 6 = 10/18 = 5/9", "f": 1, "top": 1}]}}, "6-1-2": {"t": "각기둥과 각뿔", "concepts": [{"t": "각기둥", "body": "<p>위아래 두 면이 서로 <span class=\"hl\">평행하고 합동인 다각형</span>인 입체도형이에요. 이 두 면이 밑면, 옆을 둘러싼 직사각형이 옆면이에요. 밑면의 모양에 따라 삼각기둥, 사각기둥이라고 불러요.</p>", "eq": "n각기둥: 꼭짓점 2×n · 면 n+2 · 모서리 3×n", "check": {"q": "오각기둥의 면은 몇 개?", "opts": ["5", "7", "10"], "a": 1}}, {"t": "각뿔", "body": "<p>밑면이 하나이고 옆면이 모두 <span class=\"hl\">삼각형</span>인 입체도형이에요. 옆면이 모두 만나는 점이 각뿔의 꼭짓점이에요.</p>", "eq": "n각뿔: 꼭짓점 n+1 · 면 n+1 · 모서리 2×n", "check": {"q": "사각뿔의 모서리는 몇 개?", "opts": ["8", "5", "12"], "a": 0}}, {"t": "구성 요소 거꾸로 찾기", "body": "<p>모서리나 꼭짓점 수가 주어지면 <span class=\"hl\">밑면의 변 수(n)</span>부터 구해요. 각기둥 모서리 15개 → 3×n = 15 → n = 5 → 오각기둥.</p>", "eq": "각기둥 모서리 15개 → n = 15 ÷ 3 = 5", "check": {"q": "꼭짓점이 8개인 각뿔은?", "opts": ["팔각뿔", "칠각뿔", "사각뿔"], "a": 1}}], "P": {"1": [{"q": "오각기둥의 꼭짓점은 몇 개일까요?", "a": 10, "h": "n각기둥의 꼭짓점 = 2 × n", "s": "2 × 5 = 10", "u": "개"}, {"q": "육각기둥의 면은 몇 개일까요?", "a": 8, "h": "옆면 n개 + 밑면 2개", "s": "6 + 2 = 8", "u": "개"}, {"q": "사각뿔의 모서리는 몇 개일까요?", "a": 8, "h": "n각뿔의 모서리 = 2 × n", "s": "2 × 4 = 8", "u": "개"}, {"q": "칠각뿔의 꼭짓점은 몇 개일까요?", "a": 8, "h": "밑면의 꼭짓점 + 위의 꼭짓점 1개", "s": "7 + 1 = 8", "u": "개"}, {"q": "삼각기둥의 모서리는 몇 개일까요?", "a": 9, "h": "n각기둥의 모서리 = 3 × n", "s": "3 × 3 = 9", "u": "개"}, {"q": "팔각뿔의 면은 몇 개일까요?", "a": 9, "h": "옆면 n개 + 밑면 1개", "s": "8 + 1 = 9", "u": "개"}], "2": [{"q": "모서리가 18개인 각기둥은 몇 각기둥일까요? (숫자로)", "a": 6, "h": "각기둥 모서리 = 3 × n", "s": "3 × n = 18 → n = 6 → 육각기둥", "u": "각기둥"}, {"q": "꼭짓점이 11개인 각뿔은 몇 각뿔일까요? (숫자로)", "a": 10, "h": "각뿔 꼭짓점 = n + 1", "s": "n + 1 = 11 → n = 10 → 십각뿔", "u": "각뿔"}, {"q": "면이 9개인 각기둥의 꼭짓점은 몇 개일까요?", "a": 14, "h": "먼저 면의 수로 n을 구해요: n + 2 = 9", "s": "n = 7 → 꼭짓점 2 × 7 = 14", "u": "개"}, {"q": "구각뿔의 꼭짓점, 면, 모서리 수를 모두 더하면?", "a": 38, "h": "꼭짓점 n+1, 면 n+1, 모서리 2×n", "s": "10 + 10 + 18 = 38"}, {"q": "밑면이 한 변 4 cm인 정오각형이고 높이가 7 cm인 오각기둥의 모든 모서리 길이의 합은?", "a": 75, "h": "밑면 모서리 10개, 옆 모서리 5개", "s": "4 × 10 + 7 × 5 = 40 + 35 = 75 (cm)", "u": "cm"}, {"q": "꼭짓점 수와 모서리 수의 합이 25인 각뿔의 면은 몇 개일까요?", "a": 9, "h": "(n + 1) + 2 × n = 25", "s": "3 × n + 1 = 25 → n = 8 → 면 8 + 1 = 9", "u": "개"}], "3": [{"q": "모서리 수와 꼭짓점 수의 차가 9인 각기둥의 면은 몇 개일까요?", "a": 11, "h": "각기둥은 모서리 3×n, 꼭짓점 2×n이에요. 차는?", "s": "3 × n − 2 × n = n = 9 → 면 9 + 2 = 11", "u": "개"}, {"q": "밑면이 한 변 3 cm인 정육각형이고 옆 모서리가 모두 8 cm인 육각뿔의 모든 모서리 길이의 합은?", "a": 66, "h": "밑면 모서리 6개, 옆 모서리 6개", "s": "3 × 6 + 8 × 6 = 18 + 48 = 66 (cm)", "u": "cm"}, {"q": "어떤 각기둥의 면 수와 어떤 각뿔의 꼭짓점 수가 둘 다 12예요. 각기둥의 꼭짓점 수와 각뿔의 모서리 수의 합은?", "a": 42, "h": "각기둥: n + 2 = 12, 각뿔: n + 1 = 12", "s": "각기둥 n = 10 → 꼭짓점 20, 각뿔 n = 11 → 모서리 22, 합 42"}, {"q": "꼭짓점, 면, 모서리 수의 합이 50인 각기둥의 모서리는 몇 개일까요?", "a": 24, "h": "2×n + (n+2) + 3×n = 50", "s": "6 × n + 2 = 50 → n = 8 → 모서리 3 × 8 = 24", "u": "개", "top": 1}, {"q": "어떤 각뿔의 모서리 수는 어떤 각기둥의 꼭짓점 수보다 4 많고, 두 입체도형의 밑면의 변의 수를 더하면 14예요. 각기둥의 면은 몇 개일까요?", "a": 8, "h": "각뿔 밑면 변 수를 ㉮, 각기둥을 ㉯라 하면 2×㉮ = 2×㉯ + 4, ㉮ + ㉯ = 14", "s": "㉮ = ㉯ + 2, ㉮ + ㉯ = 14 → ㉯ = 6 → 각기둥 면 6 + 2 = 8", "u": "개", "top": 1}]}}, "6-1-3": {"t": "소수의 나눗셈", "concepts": [{"t": "자연수의 나눗셈 이용하기", "body": "<p>126 ÷ 3 = 42를 알면, 나누어지는 수가 <span class=\"hl\">1/10배</span>일 때 몫도 1/10배예요.</p>", "eq": "126 ÷ 3 = 42 → 12.6 ÷ 3 = 4.2 → 1.26 ÷ 3 = 0.42", "check": {"q": "24 ÷ 4 = 6 일 때 2.4 ÷ 4 는?", "opts": ["6", "0.6", "0.06"], "a": 1}}, {"t": "몫이 1보다 작거나 0을 내려 쓰는 경우", "body": "<p>나누어지는 수가 나누는 수보다 작으면 몫의 일의 자리에 <span class=\"hl\">0</span>을 써요. 나누어떨어지지 않으면 <span class=\"hl\">0을 내려</span> 계속 나눠요.</p>", "eq": "2.4 ÷ 6 = 0.4    3.4 ÷ 4 = 0.85", "check": {"q": "3 ÷ 4 를 소수로 나타내면?", "opts": ["0.75", "1.33", "0.34"], "a": 0}}, {"t": "몫의 소수점 위치", "body": "<p>세로셈에서 몫의 소수점은 <span class=\"hl\">나누어지는 수의 소수점 위치</span>에 맞춰 찍어요. 어림으로 확인하면 실수를 줄일 수 있어요.</p>", "eq": "8.48 ÷ 4 → 8 ÷ 4 = 2 정도 → 2.12", "check": {"q": "9.36 ÷ 3 은?", "opts": ["31.2", "3.12", "0.312"], "a": 1}}], "P": {"1": [{"q": "8.4 ÷ 4 = □", "a": 2.1, "h": "84 ÷ 4 = 21이에요.", "s": "84 ÷ 4 = 21 → 2.1"}, {"q": "0.56 ÷ 7 = □", "a": 0.08, "h": "56 ÷ 7 = 8, 소수 두 자리!", "s": "56 ÷ 7 = 8 → 0.08"}, {"q": "7.5 ÷ 5 = □", "a": 1.5, "h": "75 ÷ 5 를 먼저!", "s": "75 ÷ 5 = 15 → 1.5"}, {"q": "2.7 ÷ 6 = □", "a": 0.45, "h": "나누어떨어지지 않으면 0을 내려 계산해요.", "s": "2.7 ÷ 6 = 0.45"}, {"q": "9 ÷ 4 의 몫을 소수로 나타내세요.", "a": 2.25, "h": "9.00으로 생각하고 나눠 보세요.", "s": "9 ÷ 4 = 2.25"}, {"q": "13.2 ÷ 6 = □", "a": 2.2, "h": "132 ÷ 6 = 22", "s": "132 ÷ 6 = 22 → 2.2"}], "2": [{"q": "4.08 ÷ 4 = □", "a": 1.02, "h": "소수 첫째 자리에서 0 ÷ 4 = 0을 꼭 써요.", "s": "408 ÷ 4 = 102 → 1.02"}, {"q": "15.6 ÷ 12 = □", "a": 1.3, "h": "156 ÷ 12를 먼저 계산해요.", "s": "156 ÷ 12 = 13 → 1.3"}, {"q": "끈 6.3 m를 7명이 똑같이 나누면 한 명은 몇 m를 가질까요?", "a": 0.9, "h": "6.3 ÷ 7", "s": "63 ÷ 7 = 9 → 0.9 (m)", "u": "m"}, {"q": "둘레가 10.4 cm인 정사각형의 한 변은 몇 cm일까요?", "a": 2.6, "h": "정사각형은 네 변의 길이가 같아요.", "s": "10.4 ÷ 4 = 2.6 (cm)", "u": "cm"}, {"q": "넓이가 21.6 m²이고 가로가 8 m인 직사각형의 세로는?", "a": 2.7, "h": "세로 = 넓이 ÷ 가로", "s": "21.6 ÷ 8 = 2.7 (m)", "u": "m"}, {"q": "주스 2.4 L를 5컵에 똑같이 나누어 담으면 한 컵에 몇 L일까요?", "a": 0.48, "h": "2.4 ÷ 5, 0을 내려 계산해요.", "s": "2.4 ÷ 5 = 0.48 (L)", "u": "L"}], "3": [{"q": "어떤 수에 5를 곱해야 할 것을 잘못하여 5로 나누었더니 1.36이 되었어요. 바르게 계산한 값은?", "a": 34, "h": "먼저 어떤 수: □ ÷ 5 = 1.36", "s": "어떤 수 = 1.36 × 5 = 6.8, 6.8 × 5 = 34"}, {"q": "6분 동안 1.5 km를 가는 자동차가 같은 빠르기로 1분 동안 가는 거리는?", "a": 0.25, "h": "1.5 ÷ 6", "s": "1.5 ÷ 6 = 0.25 (km)", "u": "km"}, {"q": "17.5 ÷ 7 > □.3 에서 □ 안에 들어갈 수 있는 가장 큰 자연수는?", "a": 2, "h": "17.5 ÷ 7을 먼저 계산해요.", "s": "17.5 ÷ 7 = 2.5, 2.5 > □.3 → □ = 2 (3.3은 2.5보다 커요)"}, {"q": "숫자 카드 2, 4, 5, 8을 모두 한 번씩 사용하여 (소수 두 자리 수) ÷ (한 자리 수)를 만들 때, 가장 큰 몫은?", "a": 4.27, "h": "나누어지는 수는 크게, 나누는 수는 작게!", "s": "나누는 수 2, 나누어지는 수 8.54 → 8.54 ÷ 2 = 4.27", "top": 1}, {"q": "길이가 50.4 m인 길의 한쪽에 처음부터 끝까지 같은 간격으로 나무 8그루를 심으려고 해요. 나무 사이의 간격은 몇 m일까요?", "a": 7.2, "h": "나무가 8그루면 간격은 몇 개일까요?", "s": "간격 수 = 8 − 1 = 7, 50.4 ÷ 7 = 7.2 (m)", "u": "m", "top": 1}]}}, "6-1-4": {"t": "비와 비율", "concepts": [{"t": "비", "body": "<p>두 수를 나눗셈으로 비교할 때 기호 : 를 써요. 3 : 5는 <span class=\"hl\">3 대 5</span>, 5에 대한 3의 비라고 읽어요. 기호 오른쪽(5)이 <span class=\"hl\">기준량</span>, 왼쪽(3)이 비교하는 양이에요.</p>", "eq": "3 : 5 → 비교하는 양 3, 기준량 5", "check": {"q": "7 : 2 에서 기준량은?", "opts": ["7", "2", "9"], "a": 1}}, {"t": "비율", "body": "<p>비율은 <span class=\"hl\">비교하는 양 ÷ 기준량</span>이에요. 분수나 소수로 나타내요.</p>", "eq": "3 : 4 의 비율 = 3/4 = 0.75", "check": {"q": "2 : 5 의 비율을 소수로 나타내면?", "opts": ["0.4", "2.5", "0.25"], "a": 0}}, {"t": "백분율", "body": "<p>기준량을 100으로 할 때의 비율이에요. <span class=\"hl\">비율 × 100</span>을 하고 %를 붙여요.</p>", "eq": "0.35 → 35%    7/20 → 35%", "check": {"q": "3/4 를 백분율로 나타내면?", "opts": ["34%", "75%", "43%"], "a": 1}}], "P": {"1": [{"q": "3 : 4 의 비율을 소수로 나타내세요.", "a": 0.75, "h": "비교하는 양 ÷ 기준량", "s": "3 ÷ 4 = 0.75"}, {"q": "2 : 5 의 비율을 분수로 나타내세요.", "a": "2/5", "h": "기준량이 분모예요.", "s": "2 : 5 → 2/5", "f": 1}, {"q": "7 : 20 의 비율을 백분율로 나타내세요.", "a": 35, "h": "7/20 × 100", "s": "7/20 = 0.35 → 35%", "u": "%"}, {"q": "비율 0.4를 백분율로 나타내세요.", "a": 40, "h": "× 100", "s": "0.4 × 100 = 40 → 40%", "u": "%"}, {"q": "8과 5의 비에서 기준량은?", "a": 5, "h": "'8과 5의 비'는 8 : 5예요. 기호 오른쪽이 기준량!", "s": "8 : 5 → 기준량 5"}, {"q": "45%를 소수로 나타내세요.", "a": 0.45, "h": "% 값을 100으로 나눠요.", "s": "45 ÷ 100 = 0.45"}], "2": [{"q": "우리 반 25명 중 여학생이 14명이에요. 반 전체 학생 수에 대한 여학생 수의 비율은 몇 %일까요?", "a": 56, "h": "기준량은 반 전체 25명!", "s": "14/25 = 0.56 → 56%", "u": "%"}, {"q": "120 km를 2시간 동안 갔어요. 걸린 시간에 대한 간 거리의 비율은?", "a": 60, "h": "간 거리 ÷ 걸린 시간", "s": "120 ÷ 2 = 60"}, {"q": "소금 30 g을 녹여 소금물 200 g을 만들었어요. 소금물의 진하기는 몇 %일까요?", "a": 15, "h": "소금물 전체에 대한 소금의 비율", "s": "30/200 = 0.15 → 15%", "u": "%"}, {"q": "실제 거리 2 km를 지도에 4 cm로 그렸어요. 실제 거리에 대한 지도 거리의 비율을 분수로 나타내세요.", "a": "1/50000", "h": "단위를 맞춰요: 2 km = 200000 cm", "s": "4/200000 = 1/50000", "f": 1}, {"q": "정가 20000원인 물건을 15% 할인하여 팔면 판매 가격은?", "a": 17000, "h": "할인 금액 = 20000 × 0.15", "s": "할인 금액 3000원 → 20000 − 3000 = 17000 (원)", "u": "원"}, {"q": "40번 공을 쳐서 12번 안타를 친 선수의 타율을 소수로 나타내세요.", "a": 0.3, "h": "안타 수 ÷ 타수", "s": "12 ÷ 40 = 0.3"}], "3": [{"q": "가로가 15 cm인 직사각형에서 가로에 대한 세로의 비율이 0.6이에요. 직사각형의 넓이는?", "a": 135, "h": "세로 = 15 × 0.6", "s": "세로 9 cm, 넓이 15 × 9 = 135 (cm²)", "u": "cm²"}, {"q": "원가가 8000원인 물건에 원가의 25%만큼 이익을 붙여 정가를 정했어요. 정가는?", "a": 10000, "h": "이익 = 8000 × 0.25", "s": "이익 2000원 → 정가 10000원", "u": "원"}, {"q": "가 마을은 넓이 50 km²에 7500명, 나 마을은 넓이 40 km²에 6400명이 살아요. 넓이에 대한 인구의 비율이 더 높은 마을의 비율 값은?", "a": 160, "h": "각 마을의 인구 ÷ 넓이를 비교해요.", "s": "가: 7500 ÷ 50 = 150, 나: 6400 ÷ 40 = 160 → 160"}, {"q": "20000원인 물건값이 20% 올랐다가 다시 20% 내렸어요. 지금 가격은?", "a": 19200, "h": "올린 뒤의 가격을 기준으로 20%를 내려요.", "s": "20000 × 1.2 = 24000, 24000 × 0.8 = 19200 (원)", "u": "원", "top": 1}, {"q": "진하기 10%인 소금물 300 g에 물 100 g을 더 넣었어요. 새 소금물의 진하기는 몇 %일까요?", "a": 7.5, "h": "소금의 양은 변하지 않아요.", "s": "소금 300 × 0.1 = 30 g, 30/400 = 0.075 → 7.5%", "u": "%", "top": 1}]}}, "6-1-5": {"t": "여러 가지 그래프", "concepts": [{"t": "그림그래프", "body": "<p>큰 그림과 작은 그림이 나타내는 수를 정해 자료를 그림으로 보여 줘요. <span class=\"hl\">큰 그림 수 × 단위 + 작은 그림 수 × 단위</span>로 읽어요.</p>", "eq": "큰 그림 100명, 작은 그림 10명 → 큰 3 · 작은 4 = 340명", "check": {"q": "큰 그림 1000상자, 작은 그림 100상자일 때 큰 2 · 작은 3은?", "opts": ["23상자", "2300상자", "5000상자"], "a": 1}}, {"t": "띠그래프", "body": "<p>전체를 100%로 보고 각 부분의 비율을 <span class=\"hl\">띠 모양</span>으로 나타내요. 백분율의 합은 항상 100%예요.</p>", "eq": "30 cm 띠에서 20% → 30 × 0.2 = 6 cm", "check": {"q": "35%, 25%, 30% 와 나머지 항목의 백분율은?", "opts": ["10%", "15%", "20%"], "a": 0}}, {"t": "원그래프", "body": "<p>전체를 원으로 나타내고, 각 부분을 부채꼴로 나눠요. 원 한 바퀴 360°가 100%이니 <span class=\"hl\">1%는 3.6°</span>예요.</p>", "eq": "25% → 25 × 3.6 = 90°", "check": {"q": "원그래프에서 중심각 72°는 몇 %?", "opts": ["72%", "20%", "36%"], "a": 1}}], "P": {"1": [{"q": "전체 40명 중 12명은 몇 %일까요?", "a": 30, "h": "12 ÷ 40 × 100", "s": "12/40 = 0.3 → 30%", "u": "%"}, {"q": "길이 20 cm인 띠그래프에서 25%인 항목의 길이는?", "a": 5, "h": "20 × 0.25", "s": "20 × 0.25 = 5 (cm)", "u": "cm"}, {"q": "원그래프에서 25%인 항목의 중심각은 몇 도일까요?", "a": 90, "h": "1%는 3.6°", "s": "25 × 3.6 = 90 (°)", "u": "°"}, {"q": "그림그래프에서 큰 그림이 100명, 작은 그림이 10명이에요. 큰 그림 3개, 작은 그림 4개는 몇 명일까요?", "a": 340, "h": "300 + 40", "s": "300 + 40 = 340 (명)", "u": "명"}, {"q": "띠그래프의 항목이 35%, 25%, 30%이고 나머지 한 항목이 있어요. 나머지 항목은 몇 %일까요?", "a": 10, "h": "전체는 100%", "s": "100 − 35 − 25 − 30 = 10 (%)", "u": "%"}, {"q": "원그래프에서 중심각이 72°인 항목은 몇 %일까요?", "a": 20, "h": "72 ÷ 3.6", "s": "72 ÷ 3.6 = 20 (%)", "u": "%"}], "2": [{"q": "반 학생 30명 중 사과를 좋아하는 학생이 30%예요. 몇 명일까요?", "a": 9, "h": "30 × 0.3", "s": "30 × 0.3 = 9 (명)", "u": "명"}, {"q": "원그래프에서 A가 40%, B는 A의 절반, C가 25%이고 나머지가 D예요. D는 몇 %일까요?", "a": 15, "h": "B = 40 ÷ 2", "s": "B 20%, D = 100 − 40 − 20 − 25 = 15 (%)", "u": "%"}, {"q": "전교생 800명 중 15%가 안경을 써요. 몇 명일까요?", "a": 120, "h": "800 × 0.15", "s": "800 × 0.15 = 120 (명)", "u": "명"}, {"q": "길이 30 cm인 띠그래프에서 9 cm를 차지하는 항목은 몇 %일까요?", "a": 30, "h": "9 ÷ 30 × 100", "s": "9/30 = 0.3 → 30%", "u": "%"}, {"q": "그림그래프에서 큰 그림은 1000상자, 작은 그림은 100상자예요. 가 마을은 큰 그림 2개 · 작은 그림 5개, 나 마을은 큰 그림 3개 · 작은 그림 1개예요. 두 마을의 합은?", "a": 5600, "h": "각 마을을 먼저 읽어요.", "s": "가 2500상자 + 나 3100상자 = 5600 (상자)", "u": "상자"}, {"q": "전체 200명을 나타낸 원그래프에서 중심각이 54°인 항목은 몇 명일까요?", "a": 30, "h": "54°는 몇 %일까요?", "s": "54 ÷ 3.6 = 15% → 200 × 0.15 = 30 (명)", "u": "명"}], "3": [{"q": "용돈을 저금 35%, 간식 25%, 학용품, 기타 10%로 썼어요. 용돈이 50000원일 때 학용품에 쓴 돈은?", "a": 15000, "h": "학용품은 몇 %일까요?", "s": "학용품 100 − 35 − 25 − 10 = 30% → 50000 × 0.3 = 15000 (원)", "u": "원"}, {"q": "원그래프에서 A는 B의 2배, C는 B보다 10%만큼 작고, D는 10%예요. A는 몇 %일까요?", "a": 50, "h": "B를 □%라 하면 A = 2 × □, C = □ − 10", "s": "2×□ + □ + (□ − 10) + 10 = 100 → 4×□ = 100 → □ = 25, A = 50 (%)", "u": "%"}, {"q": "전교생 500명 중 40%가 운동을 좋아하고, 그중 30%가 축구를 좋아해요. 축구를 좋아하는 학생은 몇 명일까요?", "a": 60, "h": "운동을 좋아하는 학생 수부터!", "s": "500 × 0.4 = 200, 200 × 0.3 = 60 (명)", "u": "명"}, {"q": "작년에는 전체 400명 중 A가 20%, 올해는 전체 480명 중 A가 25%예요. A는 작년보다 몇 명 늘었을까요?", "a": 40, "h": "백분율이 아니라 사람 수로 비교해요.", "s": "작년 80명, 올해 120명 → 40명", "u": "명", "top": 1}, {"q": "혈액형 원그래프에서 A형 108°, B형 90°, AB형 36°이고 나머지는 O형이에요. O형이 B형보다 9명 많을 때 A형은 몇 명일까요?", "a": 27, "h": "O형의 중심각을 먼저 구하고, 9명이 몇 도인지 생각해 보세요.", "s": "O형 360 − 108 − 90 − 36 = 126°, O − B = 36° = 9명 → 1°는 1/4명 → A형 108 ÷ 4 = 27 (명)", "u": "명", "top": 1}]}}, "6-1-6": {"t": "직육면체의 겉넓이와 부피", "concepts": [{"t": "겉넓이", "body": "<p>직육면체는 마주 보는 면이 같아요. <span class=\"hl\">(세 면의 넓이의 합) × 2</span>. 정육면체는 <span class=\"hl\">한 면 × 6</span>이에요.</p>", "eq": "가로 5, 세로 4, 높이 3 → (20 + 15 + 12) × 2 = 94 cm²", "check": {"q": "한 모서리 3 cm인 정육면체의 겉넓이는?", "opts": ["27 cm²", "54 cm²", "18 cm²"], "a": 1}}, {"t": "부피", "body": "<p>부피는 공간을 차지하는 크기예요. 1 cm³ 쌓기나무가 몇 개 들어가는지 세면 <span class=\"hl\">가로 × 세로 × 높이</span>예요.</p>", "eq": "5 × 4 × 3 = 60 cm³", "check": {"q": "가로 2, 세로 3, 높이 4 cm인 직육면체의 부피는?", "opts": ["9 cm³", "24 cm³", "52 cm³"], "a": 1}}, {"t": "큰 부피의 단위", "body": "<p>한 모서리 1 m인 정육면체의 부피가 1 m³예요. 100 cm × 100 cm × 100 cm이니 <span class=\"hl\">1 m³ = 1000000 cm³</span>.</p>", "eq": "2.5 m³ = 2500000 cm³", "check": {"q": "4000000 cm³ 는 몇 m³?", "opts": ["4", "40", "400"], "a": 0}}], "P": {"1": [{"q": "가로 5 cm, 세로 4 cm, 높이 3 cm인 직육면체의 겉넓이는?", "a": 94, "h": "세 면 넓이의 합 × 2", "s": "(20 + 15 + 12) × 2 = 94 (cm²)", "u": "cm²"}, {"q": "한 모서리가 6 cm인 정육면체의 겉넓이는?", "a": 216, "h": "한 면 넓이 × 6", "s": "6 × 6 × 6 = 216 (cm²)", "u": "cm²"}, {"q": "가로 5 cm, 세로 4 cm, 높이 3 cm인 직육면체의 부피는?", "a": 60, "h": "가로 × 세로 × 높이", "s": "5 × 4 × 3 = 60 (cm³)", "u": "cm³"}, {"q": "한 모서리가 4 cm인 정육면체의 부피는?", "a": 64, "h": "4 × 4 × 4", "s": "64 (cm³)", "u": "cm³"}, {"q": "2 m³ 는 몇 cm³일까요?", "a": 2000000, "h": "1 m³ = 1000000 cm³", "s": "2000000 (cm³)", "u": "cm³"}, {"q": "3000000 cm³ 는 몇 m³일까요?", "a": 3, "h": "1000000 cm³ = 1 m³", "s": "3 (m³)", "u": "m³"}], "2": [{"q": "가로 7 cm, 세로 4 cm, 높이 6 cm인 직육면체의 겉넓이는?", "a": 188, "h": "세 면: 7×4, 7×6, 4×6", "s": "(28 + 42 + 24) × 2 = 188 (cm²)", "u": "cm²"}, {"q": "겉넓이가 150 cm²인 정육면체의 한 모서리는 몇 cm일까요?", "a": 5, "h": "한 면의 넓이 = 150 ÷ 6", "s": "한 면 25 cm² → 5 × 5 = 25 → 5 (cm)", "u": "cm"}, {"q": "부피가 343 cm³인 정육면체의 한 모서리는?", "a": 7, "h": "같은 수를 세 번 곱해 343이 되는 수", "s": "7 × 7 × 7 = 343 → 7 (cm)", "u": "cm"}, {"q": "부피가 240 cm³이고 가로 8 cm, 세로 6 cm인 직육면체의 높이는?", "a": 5, "h": "높이 = 부피 ÷ (가로 × 세로)", "s": "240 ÷ 48 = 5 (cm)", "u": "cm"}, {"q": "가로 2 m, 세로 1.5 m, 높이 80 cm인 직육면체의 부피는 몇 m³일까요?", "a": 2.4, "h": "80 cm = 0.8 m로 단위를 맞춰요.", "s": "2 × 1.5 × 0.8 = 2.4 (m³)", "u": "m³"}, {"q": "한 모서리 1 cm인 쌓기나무로 가로 4 cm, 세로 3 cm, 높이 5 cm인 직육면체를 만들려면 몇 개가 필요할까요?", "a": 60, "h": "부피와 같아요.", "s": "4 × 3 × 5 = 60 (개)", "u": "개"}], "3": [{"q": "가로 9 cm, 세로 4 cm, 높이 6 cm인 직육면체와 부피가 같은 정육면체의 겉넓이는?", "a": 216, "h": "직육면체 부피를 먼저 구해요.", "s": "부피 216 = 6 × 6 × 6 → 정육면체 한 모서리 6 cm, 겉넓이 36 × 6 = 216 (cm²)", "u": "cm²"}, {"q": "정육면체의 각 모서리를 2배로 늘리면 부피는 몇 배가 될까요?", "a": 8, "h": "가로, 세로, 높이가 모두 2배", "s": "2 × 2 × 2 = 8 (배)", "u": "배"}, {"q": "가로 40 cm, 세로 30 cm인 직육면체 수조에 돌을 넣었더니 물 높이가 2 cm 올라갔어요. 돌의 부피는?", "a": 2400, "h": "올라간 물의 부피 = 돌의 부피", "s": "40 × 30 × 2 = 2400 (cm³)", "u": "cm³"}, {"q": "정육면체의 겉면을 모두 색칠한 뒤 3 × 3 × 3 = 27개의 작은 정육면체로 잘랐어요. 두 면만 색칠된 작은 정육면체는 몇 개일까요?", "a": 12, "h": "두 면만 색칠된 것은 모서리 가운데에 있어요. 모서리는 몇 개?", "s": "정육면체 모서리 12개마다 가운데 1개씩 → 12 (개)", "u": "개", "top": 1}, {"q": "직육면체의 서로 다른 세 면의 넓이가 24 cm², 30 cm², 20 cm²예요. 이 직육면체의 부피는?", "a": 120, "h": "(가로×세로)×(가로×높이)×(세로×높이) = (부피)×(부피)", "s": "24 × 30 × 20 = 14400 = 120 × 120 → 부피 120 (cm³) (모서리 4, 6, 5 cm)", "u": "cm³", "top": 1}]}}, "6-2-1": {"t": "분수의 나눗셈", "concepts": [{"t": "분모가 같은 (분수) ÷ (분수)", "body": "<p>분모가 같으면 <span class=\"hl\">분자끼리 나눠요</span>. 6/7 ÷ 2/7은 1/7이 6개 ÷ 2개와 같아요.</p>", "eq": "6/7 ÷ 2/7 = 6 ÷ 2 = 3    5/9 ÷ 2/9 = 5/2", "check": {"q": "8/9 ÷ 4/9 는?", "opts": ["2", "1/2", "32/81"], "a": 0}}, {"t": "분모가 다른 (분수) ÷ (분수)", "body": "<p>통분해서 분자끼리 나눠도 되고, <span class=\"hl\">나누는 수의 분모와 분자를 바꿔 곱해도</span> 돼요.</p>", "eq": "2/3 ÷ 4/5 = 2/3 × 5/4 = 10/12 = 5/6", "check": {"q": "3/4 ÷ 1/8 은?", "opts": ["3/32", "6", "2"], "a": 1}}, {"t": "(자연수) ÷ (분수)와 대분수", "body": "<p>자연수도 같은 방법이에요. 대분수는 <span class=\"hl\">가분수로 바꾼 뒤</span> 계산해요.</p>", "eq": "4 ÷ 2/3 = 4 × 3/2 = 6    1 1/2 ÷ 3/4 = 3/2 × 4/3 = 2", "check": {"q": "6 ÷ 3/5 는?", "opts": ["10", "18/5", "5/18"], "a": 0}}], "P": {"1": [{"q": "8/9 ÷ 2/9 = □", "a": 4, "h": "분모가 같으면 분자끼리 나눠요.", "s": "8 ÷ 2 = 4"}, {"q": "5/7 ÷ 3/7 = □", "a": "5/3", "h": "5 ÷ 3을 분수로!", "s": "5 ÷ 3 = 5/3 = 1 2/3", "f": 1}, {"q": "3/4 ÷ 1/8 = □", "a": 6, "h": "3/4 × 8/1", "s": "3/4 × 8 = 6"}, {"q": "6 ÷ 3/5 = □", "a": 10, "h": "6 × 5/3", "s": "6 × 5/3 = 10"}, {"q": "2/3 ÷ 4/5 = □", "a": "5/6", "h": "2/3 × 5/4 를 약분해요.", "s": "2/3 × 5/4 = 10/12 = 5/6", "f": 1}, {"q": "1 1/2 ÷ 3/4 = □", "a": 2, "h": "1 1/2 = 3/2", "s": "3/2 × 4/3 = 2"}], "2": [{"q": "2 1/3 ÷ 1 1/6 = □", "a": 2, "h": "둘 다 가분수로 바꿔요.", "s": "7/3 ÷ 7/6 = 7/3 × 6/7 = 2"}, {"q": "4/5 ÷ 2/7 = □", "a": "14/5", "h": "4/5 × 7/2", "s": "28/10 = 14/5 = 2 4/5", "f": 1}, {"q": "우유 3 3/4 L를 3/8 L씩 컵에 나누어 담으면 몇 컵이 될까요?", "a": 10, "h": "3 3/4 ÷ 3/8", "s": "15/4 × 8/3 = 10 (컵)", "u": "컵"}, {"q": "넓이가 5 1/4 m²이고 세로가 1 3/4 m인 직사각형의 가로는?", "a": 3, "h": "가로 = 넓이 ÷ 세로", "s": "21/4 ÷ 7/4 = 21 ÷ 7 = 3 (m)", "u": "m"}, {"q": "9 ÷ 1 1/2 = □", "a": 6, "h": "1 1/2 = 3/2", "s": "9 × 2/3 = 6"}, {"q": "1 m의 무게가 2/5 kg인 철근이 있어요. 이 철근 3 1/5 kg의 길이는?", "a": 8, "h": "길이 = 전체 무게 ÷ 1 m의 무게", "s": "16/5 ÷ 2/5 = 16 ÷ 2 = 8 (m)", "u": "m"}], "3": [{"q": "어떤 수에 3/4을 곱해야 할 것을 잘못하여 3/4으로 나누었더니 2 2/3이 되었어요. 바르게 계산한 값은?", "a": "3/2", "h": "어떤 수 = 2 2/3 × 3/4", "s": "어떤 수 = 8/3 × 3/4 = 2, 2 × 3/4 = 3/2 = 1 1/2", "f": 1}, {"q": "3/5 ÷ 1/10 < □ < 5/6 ÷ 1/12 에서 □ 안에 들어갈 수 있는 자연수는 모두 몇 개일까요?", "a": 3, "h": "양쪽 몫을 먼저 구해요.", "s": "6 < □ < 10 → 7, 8, 9 → 3개", "u": "개"}, {"q": "1분에 3/4 km를 가는 자전거가 6 3/4 km를 가려면 몇 분이 걸릴까요?", "a": 9, "h": "6 3/4 ÷ 3/4", "s": "27/4 ÷ 3/4 = 9 (분)", "u": "분"}, {"q": "숫자 카드 2, 3, 5, 7을 모두 한 번씩 써서 진분수 두 개를 만들고 (진분수) ÷ (진분수)를 계산하려고 해요. 가장 큰 몫은?", "a": "21/10", "h": "나누어지는 진분수는 크게, 나누는 진분수는 작게! 가장 작은 진분수 2/7로 나누는 경우부터 생각해 보세요.", "s": "2/7로 나눌 때 남은 3, 5로 만든 진분수 3/5 → 3/5 ÷ 2/7 = 3/5 × 7/2 = 21/10 = 2 1/10", "f": 1, "top": 1}, {"q": "물통에 든 물의 2/5를 쓰고, 남은 물의 1/3을 또 썼더니 4 L가 남았어요. 처음 물통에 든 물은 몇 L일까요?", "a": 10, "h": "남은 물은 처음의 몇 분의 몇일까요?", "s": "남은 물 = 처음 × 3/5 × 2/3 = 처음 × 2/5, 4 ÷ 2/5 = 10 (L)", "u": "L", "top": 1}]}}, "6-2-2": {"t": "공간과 입체", "concepts": [{"t": "위에서 본 모양에 수 쓰기", "body": "<p>위에서 본 모양의 각 칸에 <span class=\"hl\">쌓인 쌓기나무 개수</span>를 쓰면 숨은 쌓기나무까지 정확히 셀 수 있어요.</p>", "eq": "칸의 수 2, 1, 3, 1 → 2 + 1 + 3 + 1 = 7개", "check": {"q": "위에서 본 칸의 수가 3, 2, 2 이면 모두 몇 개?", "opts": ["3개", "7개", "12개"], "a": 1}}, {"t": "앞과 옆에서 본 모양", "body": "<p>앞에서 본 모양의 각 줄 높이는 그 줄에서 <span class=\"hl\">가장 높이 쌓인 개수</span>와 같아요. 옆에서 본 모양도 마찬가지예요.</p>", "eq": "앞줄 1·2·3, 뒷줄 2·1·1 → 앞에서 본 높이 2, 2, 3", "check": {"q": "한 세로줄에 1층, 3층이 있으면 앞에서 본 그 줄의 높이는?", "opts": ["1층", "3층", "4층"], "a": 1}}, {"t": "층별로 나누어 보기", "body": "<p>1층, 2층, 3층을 위에서 본 모양으로 나누어 그리면 <span class=\"hl\">층마다 개수를 더해</span> 전체를 셀 수 있어요.</p>", "eq": "1층 5개 + 2층 3개 + 3층 1개 = 9개", "check": {"q": "1층 6개, 2층 2개 이면 모두 몇 개?", "opts": ["8개", "12개", "4개"], "a": 0}}], "P": {"1": [{"q": "위에서 본 모양의 칸에 쓰인 수가 2, 1, 3, 1이에요. 쌓기나무는 모두 몇 개일까요?", "a": 7, "h": "칸에 쓰인 수를 모두 더해요.", "s": "2 + 1 + 3 + 1 = 7 (개)", "u": "개"}, {"q": "1층에 5개, 2층에 3개, 3층에 1개를 쌓았어요. 쌓기나무는 모두 몇 개일까요?", "a": 9, "h": "층별로 더해요.", "s": "5 + 3 + 1 = 9 (개)", "u": "개"}, {"q": "쌓기나무로 가로, 세로, 높이가 모두 3개인 정육면체를 만들었어요. 몇 개를 썼을까요?", "a": 27, "h": "3 × 3 × 3", "s": "27 (개)", "u": "개"}, {"q": "위에서 본 모양의 칸에 쓰인 수가 3, 3, 2예요. 모두 몇 개일까요?", "a": 8, "h": "세 수를 더해요.", "s": "3 + 3 + 2 = 8 (개)", "u": "개"}, {"q": "위에서 본 모양이 6칸이고 모든 칸에 2개씩 쌓았어요. 모두 몇 개일까요?", "a": 12, "h": "6 × 2", "s": "12 (개)", "u": "개"}, {"q": "가로, 세로, 높이가 모두 2개인 정육면체를 쌓기나무로 만들려면 몇 개가 필요할까요?", "a": 8, "h": "2 × 2 × 2", "s": "8 (개)", "u": "개"}], "2": [{"q": "위에서 본 모양의 앞줄(왼쪽부터)에 1, 2, 3개, 뒷줄에 2, 1, 1개가 쌓여 있어요. 앞에서 본 모양은 작은 정사각형 몇 개로 그려질까요?", "a": 7, "h": "앞에서 보면 세로줄마다 가장 높은 층만 보여요.", "s": "세로줄 높이 2, 2, 3 → 7 (개)", "u": "개"}, {"q": "위에서 본 모양의 칸에 쓰인 수가 3, 1, 2, 2예요. 2층 이상에 있는 쌓기나무는 몇 개일까요?", "a": 4, "h": "칸마다 1층의 1개를 빼고 세요.", "s": "(3 − 1) + 0 + (2 − 1) + (2 − 1) = 4 (개)", "u": "개"}, {"q": "3 × 3 × 3 정육면체 모양에서 꼭짓점에 있는 쌓기나무를 모두 빼면 몇 개가 남을까요?", "a": 19, "h": "정육면체의 꼭짓점은 8개", "s": "27 − 8 = 19 (개)", "u": "개"}, {"q": "쌓기나무 20개로 위에서 본 모양이 3 × 3인 칸에 모두 2개씩 쌓았어요. 남은 쌓기나무는?", "a": 2, "h": "9칸 × 2개", "s": "20 − 18 = 2 (개)", "u": "개"}, {"q": "쌓기나무 30개가 있어요. 4 × 4 × 4 정육면체를 만들려면 몇 개가 더 필요할까요?", "a": 34, "h": "4 × 4 × 4 = ?", "s": "64 − 30 = 34 (개)", "u": "개"}, {"q": "층별로 나누어 보니 1층은 7칸, 2층은 4칸, 3층은 1칸이에요. 모두 몇 개일까요?", "a": 12, "h": "층별 칸 수를 더해요.", "s": "7 + 4 + 1 = 12 (개)", "u": "개"}], "3": [{"q": "앞에서 본 모양이 1층, 2층, 3층, 4층으로 올라가는 계단이고, 똑같은 계단을 뒤로 2줄 붙였어요. 쌓기나무는 모두 몇 개일까요?", "a": 20, "h": "한 줄 계단부터 세요.", "s": "한 줄 1 + 2 + 3 + 4 = 10개, 2줄이면 20 (개)", "u": "개"}, {"q": "위에서 본 모양이 2 × 2이고, 앞에서 본 세로줄 높이가 (3, 2), 옆에서 본 가로줄 높이가 (3, 1)이에요. 쌓을 수 있는 가장 많은 개수는?", "a": 7, "h": "각 칸에는 앞과 옆에서 본 높이 중 작은 수까지만 쌓을 수 있어요.", "s": "3 + 2 + 1 + 1 = 7 (개)", "u": "개"}, {"q": "쌓기나무 64개로 4 × 4 × 4 정육면체를 만든 뒤 겉면을 모두 색칠했어요. 세 면이 색칠된 쌓기나무는 몇 개일까요?", "a": 8, "h": "세 면이 색칠된 것은 어디에 있을까요?", "s": "정육면체의 꼭짓점 8곳 → 8 (개)", "u": "개"}, {"q": "5 × 5 × 5 정육면체 모양의 겉면을 모두 색칠한 뒤 쌓기나무로 나누었어요. 한 면도 색칠되지 않은 쌓기나무는 몇 개일까요?", "a": 27, "h": "색칠되지 않은 것은 속에 숨은 정육면체예요.", "s": "안쪽 3 × 3 × 3 = 27 (개)", "u": "개", "top": 1}, {"q": "위에서 본 모양이 3 × 3이고 9칸 모두 쌓기나무가 있어요. 앞에서 본 세로줄 높이가 (3, 1, 2), 옆에서 본 가로줄 높이가 (2, 3, 1)일 때 쌓을 수 있는 가장 많은 개수는?", "a": 14, "h": "각 칸 = (그 세로줄 높이)와 (그 가로줄 높이) 중 작은 수", "s": "가로줄 2: 2+1+2 = 5, 가로줄 3: 3+1+2 = 6, 가로줄 1: 1+1+1 = 3 → 14 (개)", "u": "개", "top": 1}]}}, "6-2-3": {"t": "소수의 나눗셈", "concepts": [{"t": "소수점을 함께 옮기기", "body": "<p>나누는 수와 나누어지는 수의 소수점을 <span class=\"hl\">같은 자리만큼</span> 오른쪽으로 옮겨도 몫은 같아요. 나누는 수를 자연수로 만들어 계산해요.</p>", "eq": "1.8 ÷ 0.3 = 18 ÷ 3 = 6    2.56 ÷ 0.8 = 25.6 ÷ 8 = 3.2", "check": {"q": "4.2 ÷ 0.6 은?", "opts": ["0.7", "7", "70"], "a": 1}}, {"t": "(자연수) ÷ (소수)", "body": "<p>자연수 뒤에 <span class=\"hl\">0을 붙여</span> 소수점을 옮겨요.</p>", "eq": "6 ÷ 1.5 = 60 ÷ 15 = 4", "check": {"q": "9 ÷ 0.3 은?", "opts": ["3", "30", "0.3"], "a": 1}}, {"t": "몫을 반올림하기 · 나머지", "body": "<p>나누어떨어지지 않으면 몫을 반올림해서 나타내요. 몫을 자연수까지만 구하면 <span class=\"hl\">나머지의 소수점은 원래 자리</span>에 맞춰요.</p>", "eq": "5.2 ÷ 3 = 1.73… → 반올림하여 1.7    7.4 ÷ 3 = 2 … 1.4", "check": {"q": "10 ÷ 3 의 몫을 반올림하여 소수 첫째 자리까지 나타내면?", "opts": ["3.3", "3.4", "3.0"], "a": 0}}], "P": {"1": [{"q": "4.8 ÷ 0.6 = □", "a": 8, "h": "48 ÷ 6", "s": "8"}, {"q": "3.6 ÷ 1.2 = □", "a": 3, "h": "36 ÷ 12", "s": "3"}, {"q": "0.72 ÷ 0.08 = □", "a": 9, "h": "소수점을 두 칸씩 옮겨요.", "s": "72 ÷ 8 = 9"}, {"q": "9 ÷ 0.3 = □", "a": 30, "h": "90 ÷ 3", "s": "30"}, {"q": "2.25 ÷ 0.5 = □", "a": 4.5, "h": "22.5 ÷ 5", "s": "4.5"}, {"q": "12 ÷ 2.4 = □", "a": 5, "h": "120 ÷ 24", "s": "5"}], "2": [{"q": "7.82 ÷ 2.3 = □", "a": 3.4, "h": "78.2 ÷ 23", "s": "3.4"}, {"q": "16.8 ÷ 4.2 = □", "a": 4, "h": "168 ÷ 42", "s": "4"}, {"q": "리본 13.5 m를 1.5 m씩 자르면 몇 도막이 될까요?", "a": 9, "h": "13.5 ÷ 1.5", "s": "135 ÷ 15 = 9 (도막)", "u": "도막"}, {"q": "5.2 ÷ 3 의 몫을 반올림하여 소수 첫째 자리까지 나타내세요.", "a": 1.7, "h": "소수 둘째 자리까지 구한 뒤 반올림해요.", "s": "5.2 ÷ 3 = 1.73… → 1.7"}, {"q": "쌀 22.5 kg을 한 봉지에 2 kg씩 담으면 몇 봉지까지 꽉 채워 담을 수 있을까요?", "a": 11, "h": "22.5 ÷ 2의 몫을 자연수까지 구해요.", "s": "22.5 ÷ 2 = 11 … 0.5 → 11 (봉지)", "u": "봉지"}, {"q": "휘발유 1 L로 14.5 km를 가는 자동차가 87 km를 가려면 휘발유가 몇 L 필요할까요?", "a": 6, "h": "87 ÷ 14.5", "s": "870 ÷ 145 = 6 (L)", "u": "L"}], "3": [{"q": "어떤 수를 2.5로 나누어야 할 것을 잘못하여 2.5를 곱했더니 15.625가 되었어요. 바르게 계산한 값은?", "a": 2.5, "h": "어떤 수 = 15.625 ÷ 2.5", "s": "어떤 수 6.25, 6.25 ÷ 2.5 = 2.5"}, {"q": "넓이가 12.88 m²이고 밑변이 4.6 m인 평행사변형의 높이는?", "a": 2.8, "h": "높이 = 넓이 ÷ 밑변", "s": "128.8 ÷ 46 = 2.8 (m)", "u": "m"}, {"q": "길이 1.2 m의 무게가 3.6 kg인 철근이 있어요. 이 철근 10.5 kg의 길이는?", "a": 3.5, "h": "1 m의 무게부터 구해요.", "s": "1 m 무게 3.6 ÷ 1.2 = 3 kg, 10.5 ÷ 3 = 3.5 (m)", "u": "m"}, {"q": "7 ÷ 22 의 몫을 소수로 나타낼 때, 소수 20번째 자리 숫자는?", "a": 1, "h": "7 ÷ 22 = 0.3181818… 소수 둘째 자리부터 어떤 규칙이 있나요?", "s": "0.3 다음부터 1, 8이 반복돼요. 짝수 번째 자리는 1 → 20번째는 1", "top": 1}, {"q": "3.6 km를 0.4시간에 가는 자전거와 5.4 km를 0.9시간에 가는 사람이 같은 곳에서 반대 방향으로 동시에 출발했어요. 2.5시간 뒤 둘 사이의 거리는?", "a": 37.5, "h": "각자 1시간에 가는 거리부터 구해요.", "s": "자전거 9 km, 사람 6 km → 1시간에 15 km씩 멀어져요. 15 × 2.5 = 37.5 (km)", "u": "km", "top": 1}]}}, "6-2-4": {"t": "비례식과 비례배분", "concepts": [{"t": "비의 성질", "body": "<p>비의 전항과 후항에 <span class=\"hl\">0이 아닌 같은 수</span>를 곱하거나 나누어도 비율은 같아요. 이를 이용해 간단한 자연수의 비로 나타내요.</p>", "eq": "12 : 18 = 2 : 3    0.4 : 0.6 = 2 : 3    1/2 : 1/3 = 3 : 2", "check": {"q": "15 : 25 를 가장 간단한 자연수의 비로 나타내면?", "opts": ["3 : 5", "5 : 3", "1 : 2"], "a": 0}}, {"t": "비례식", "body": "<p>비율이 같은 두 비를 = 로 나타낸 식이에요. <span class=\"hl\">외항의 곱 = 내항의 곱</span>을 이용해 □를 구해요.</p>", "eq": "3 : 5 = □ : 20 → 3 × 20 = 5 × □ → □ = 12", "check": {"q": "2 : 7 = 6 : □ 에서 □ 는?", "opts": ["21", "14", "42"], "a": 0}}, {"t": "비례배분", "body": "<p>전체를 주어진 비로 나누는 것이에요. <span class=\"hl\">전체 × (내 몫)/(비의 합)</span>.</p>", "eq": "35를 3 : 4로 → 35 × 3/7 = 15, 35 × 4/7 = 20", "check": {"q": "20을 1 : 3으로 나누면 작은 쪽은?", "opts": ["5", "15", "4"], "a": 0}}], "P": {"1": [{"q": "12 : 18 = 2 : □", "a": 3, "h": "전항과 후항을 6으로 나눠요.", "s": "12 ÷ 6 = 2, 18 ÷ 6 = 3"}, {"q": "3 : 5 = □ : 20", "a": 12, "h": "외항의 곱 = 내항의 곱", "s": "3 × 20 = 5 × □ → □ = 12"}, {"q": "비례식 2 : 7 = 6 : 21 에서 외항의 곱은?", "a": 42, "h": "바깥쪽 두 수 2와 21", "s": "2 × 21 = 42"}, {"q": "0.6 : 0.9 = 2 : □", "a": 3, "h": "10을 곱한 뒤 3으로 나눠요.", "s": "6 : 9 = 2 : 3"}, {"q": "1/4 : 1/6 = 3 : □", "a": 2, "h": "분모의 최소공배수 12를 곱해요.", "s": "1/4 × 12 = 3, 1/6 × 12 = 2"}, {"q": "35를 3 : 4로 나누면 작은 쪽은?", "a": 15, "h": "35 × 3/7", "s": "15"}], "2": [{"q": "□ : 8 = 15 : 24", "a": 5, "h": "□ × 24 = 8 × 15", "s": "□ = 120 ÷ 24 = 5"}, {"q": "1 1/2 : 2 = 3 : □", "a": 4, "h": "1 1/2 = 3/2, 2를 곱해 자연수의 비로!", "s": "3/2 : 2 = 3 : 4"}, {"q": "60을 7 : 5로 나누면 큰 쪽은?", "a": 35, "h": "60 × 7/12", "s": "35"}, {"q": "축척 1 : 50000인 지도에서 6 cm는 실제로 몇 km일까요?", "a": 3, "h": "6 × 50000 cm를 km로 바꿔요.", "s": "300000 cm = 3 km", "u": "km"}, {"q": "설탕과 밀가루를 2 : 5로 섞어요. 밀가루를 350 g 넣으면 설탕은 몇 g일까요?", "a": 140, "h": "2 : 5 = □ : 350", "s": "5 × □ = 700 → □ = 140 (g)", "u": "g"}, {"q": "둘레가 56 cm이고 가로와 세로의 비가 4 : 3인 직사각형의 넓이는?", "a": 192, "h": "가로 + 세로 = 28", "s": "28 × 4/7 = 16, 28 × 3/7 = 12 → 16 × 12 = 192 (cm²)", "u": "cm²"}], "3": [{"q": "맞물려 도는 두 톱니바퀴의 톱니 수가 24개, 36개예요. 큰 톱니바퀴가 10바퀴 돌 때 작은 톱니바퀴는 몇 바퀴 돌까요?", "a": 15, "h": "맞물린 톱니 수는 같아요: 36 × 10 = 24 × □", "s": "□ = 360 ÷ 24 = 15 (바퀴)", "u": "바퀴"}, {"q": "5000원을 형과 동생이 3 : 2로 나누어 가진 뒤, 형이 동생에게 500원을 주었어요. 동생의 돈은?", "a": 2500, "h": "처음 동생 몫부터 구해요.", "s": "동생 5000 × 2/5 = 2000 → 2500 (원)", "u": "원"}, {"q": "길이 1.2 m인 막대의 그림자가 0.8 m일 때, 같은 시각에 그림자가 6 m인 나무의 높이는?", "a": 9, "h": "1.2 : 0.8 = □ : 6", "s": "0.8 × □ = 7.2 → □ = 9 (m)", "u": "m"}, {"q": "A : B = 2 : 3, B : C = 4 : 5 예요. A + B + C = 105일 때 C는?", "a": 45, "h": "B를 3과 4의 공배수 12로 맞춰요.", "s": "A : B : C = 8 : 12 : 15 → C = 105 × 15/35 = 45", "top": 1}, {"q": "가와 나가 일한 시간의 비 5 : 3으로 품삯을 나누었더니 가가 나보다 12000원을 더 받았어요. 전체 품삯은?", "a": 48000, "h": "5 − 3 = 2 만큼이 12000원이에요.", "s": "한 몫 6000원 → 전체 8몫 = 48000 (원)", "u": "원", "top": 1}]}}, "6-2-5": {"t": "원의 둘레와 넓이", "concepts": [{"t": "원주와 원주율", "body": "<p>원의 둘레를 원주라고 해요. 모든 원은 <span class=\"hl\">원주 ÷ 지름</span>이 일정한데, 이것이 원주율(약 3.14)이에요.</p>", "eq": "원주 = 지름 × 원주율 = 반지름 × 2 × 원주율", "check": {"q": "지름 10 cm인 원의 원주는? (원주율 3.14)", "opts": ["31.4 cm", "314 cm", "15.7 cm"], "a": 0}}, {"t": "원주로 지름 구하기", "body": "<p>원주를 알면 <span class=\"hl\">원주 ÷ 원주율 = 지름</span>이에요.</p>", "eq": "원주 18.84 cm → 18.84 ÷ 3.14 = 6 cm", "check": {"q": "원주가 12.56 cm인 원의 지름은?", "opts": ["4 cm", "2 cm", "8 cm"], "a": 0}}, {"t": "원의 넓이", "body": "<p>원을 잘게 잘라 붙이면 직사각형이 돼요. 가로는 원주의 반, 세로는 반지름이라서 <span class=\"hl\">반지름 × 반지름 × 원주율</span>이에요.</p>", "eq": "반지름 10 cm → 10 × 10 × 3.14 = 314 cm²", "check": {"q": "반지름 2 cm인 원의 넓이는?", "opts": ["12.56 cm²", "6.28 cm²", "25.12 cm²"], "a": 0}}], "P": {"1": [{"q": "지름이 10 cm인 원의 원주는? (원주율 3.14)", "a": 31.4, "h": "지름 × 3.14", "s": "10 × 3.14 = 31.4 (cm)", "u": "cm"}, {"q": "반지름이 4 cm인 원의 원주는? (원주율 3.14)", "a": 25.12, "h": "지름은 반지름의 2배", "s": "8 × 3.14 = 25.12 (cm)", "u": "cm"}, {"q": "원주가 18.84 cm인 원의 지름은? (원주율 3.14)", "a": 6, "h": "원주 ÷ 3.14", "s": "18.84 ÷ 3.14 = 6 (cm)", "u": "cm"}, {"q": "반지름이 10 cm인 원의 넓이는? (원주율 3.14)", "a": 314, "h": "반지름 × 반지름 × 3.14", "s": "10 × 10 × 3.14 = 314 (cm²)", "u": "cm²"}, {"q": "지름이 6 cm인 원의 넓이는? (원주율 3.14)", "a": 28.26, "h": "반지름부터 구해요.", "s": "3 × 3 × 3.14 = 28.26 (cm²)", "u": "cm²"}, {"q": "반지름이 7 cm인 원의 넓이는? (원주율 3)", "a": 147, "h": "7 × 7 × 3", "s": "147 (cm²)", "u": "cm²"}], "2": [{"q": "원주가 43.96 cm인 원의 반지름은? (원주율 3.14)", "a": 7, "h": "지름부터 구한 뒤 반으로!", "s": "43.96 ÷ 3.14 = 14 → 반지름 7 (cm)", "u": "cm"}, {"q": "넓이가 78.5 cm²인 원의 반지름은? (원주율 3.14)", "a": 5, "h": "반지름 × 반지름 = 78.5 ÷ 3.14", "s": "25 = 5 × 5 → 5 (cm)", "u": "cm"}, {"q": "지름 60 cm인 바퀴가 5바퀴 굴러간 거리는? (원주율 3.14)", "a": 942, "h": "한 바퀴 = 원주", "s": "60 × 3.14 = 188.4, × 5 = 942 (cm)", "u": "cm"}, {"q": "반지름 6 cm인 반원의 넓이는? (원주율 3.14)", "a": 56.52, "h": "원의 넓이의 반", "s": "6 × 6 × 3.14 ÷ 2 = 56.52 (cm²)", "u": "cm²"}, {"q": "반지름 6 cm인 원과 반지름 3 cm인 원의 넓이의 차는? (원주율 3.14)", "a": 84.78, "h": "각각 구해 빼거나, (36 − 9) × 3.14", "s": "113.04 − 28.26 = 84.78 (cm²)", "u": "cm²"}, {"q": "한 변이 10 cm인 정사각형 안에 그릴 수 있는 가장 큰 원의 넓이는? (원주율 3.14)", "a": 78.5, "h": "원의 지름 = 정사각형 한 변", "s": "5 × 5 × 3.14 = 78.5 (cm²)", "u": "cm²"}], "3": [{"q": "반지름 10 cm인 원에서 반지름 5 cm인 원 2개를 오려 냈어요. 남은 넓이는? (원주율 3.14)", "a": 157, "h": "큰 원 − 작은 원 2개", "s": "314 − 78.5 × 2 = 157 (cm²)", "u": "cm²"}, {"q": "한 변이 8 cm인 정사각형에서 그 안에 꼭 맞는 원을 뺀 넓이는? (원주율 3.14)", "a": 13.76, "h": "원의 반지름은 4 cm", "s": "64 − 50.24 = 13.76 (cm²)", "u": "cm²"}, {"q": "반지름 25 cm인 굴렁쇠를 굴려 30 m를 갔어요. 몇 바퀴 굴렀을까요? (원주율 3)", "a": 20, "h": "단위를 맞춰요: 30 m = 3000 cm", "s": "원주 50 × 3 = 150 cm, 3000 ÷ 150 = 20 (바퀴)", "u": "바퀴"}, {"q": "반지름 4 cm인 원 4개를 2개씩 2줄로 서로 맞닿게 놓고, 바깥을 끈으로 팽팽하게 한 바퀴 둘렀어요. 끈의 길이는? (원주율 3.14)", "a": 57.12, "h": "끈은 곧은 부분 4개와 둥근 부분 4개예요. 둥근 부분을 모으면 원 하나가 돼요.", "s": "곧은 부분 8 × 4 = 32, 둥근 부분 8 × 3.14 = 25.12 → 57.12 (cm)", "u": "cm", "top": 1}, {"q": "가로 50 m인 직사각형의 양 끝에 지름 20 m인 반원을 붙인 트랙이 있어요. 트랙 한 바퀴의 길이는? (원주율 3.14)", "a": 162.8, "h": "양 끝의 반원 2개를 합치면 원 하나", "s": "50 × 2 + 20 × 3.14 = 100 + 62.8 = 162.8 (m)", "u": "m", "top": 1}]}}, "6-2-6": {"t": "원기둥, 원뿔, 구", "concepts": [{"t": "원기둥과 전개도", "body": "<p>두 밑면이 <span class=\"hl\">합동인 원</span>이고 옆면이 굽은 면인 입체도형이에요. 전개도에서 옆면은 직사각형이고 <span class=\"hl\">가로 = 밑면의 둘레, 세로 = 높이</span>예요.</p>", "eq": "반지름 3, 높이 10 → 옆면 가로 18.84, 세로 10", "check": {"q": "반지름 5 cm인 원기둥 전개도의 옆면 가로는? (3.14)", "opts": ["31.4 cm", "15.7 cm", "78.5 cm"], "a": 0}}, {"t": "원뿔", "body": "<p>밑면이 원이고 옆면이 굽은 뿔 모양이에요. 꼭짓점에서 밑면 둘레의 한 점을 이은 선분이 <span class=\"hl\">모선</span>, 꼭짓점에서 밑면에 수직인 선분이 <span class=\"hl\">높이</span>예요.</p>", "eq": "앞에서 본 모양: 이등변삼각형 (두 변 = 모선, 밑변 = 지름)", "check": {"q": "원뿔을 앞에서 본 모양은?", "opts": ["직사각형", "이등변삼각형", "원"], "a": 1}}, {"t": "구와 회전체", "body": "<p>공 모양이 구예요. 평면도형을 한 직선을 축으로 돌리면 <span class=\"hl\">직사각형 → 원기둥, 직각삼각형 → 원뿔, 반원 → 구</span>가 돼요.</p>", "eq": "가로 3, 세로 7 직사각형을 세로를 축으로 → 반지름 3, 높이 7 원기둥", "check": {"q": "반원을 지름을 축으로 돌리면?", "opts": ["원뿔", "원기둥", "구"], "a": 2}}], "P": {"1": [{"q": "밑면의 반지름이 5 cm인 원기둥 전개도에서 옆면의 가로는? (원주율 3.14)", "a": 31.4, "h": "옆면 가로 = 밑면의 둘레", "s": "10 × 3.14 = 31.4 (cm)", "u": "cm"}, {"q": "높이가 9 cm인 원기둥 전개도에서 옆면의 세로는?", "a": 9, "h": "옆면 세로 = 원기둥의 높이", "s": "9 (cm)", "u": "cm"}, {"q": "밑면의 반지름이 4 cm인 원뿔의 밑면 지름은?", "a": 8, "h": "지름 = 반지름 × 2", "s": "8 (cm)", "u": "cm"}, {"q": "지름이 12 cm인 구의 반지름은?", "a": 6, "h": "반지름 = 지름 ÷ 2", "s": "6 (cm)", "u": "cm"}, {"q": "가로 3 cm, 세로 7 cm인 직사각형을 세로를 축으로 한 바퀴 돌렸어요. 생긴 원기둥의 밑면 지름은?", "a": 6, "h": "가로가 밑면의 반지름이 돼요.", "s": "반지름 3 → 지름 6 (cm)", "u": "cm"}, {"q": "밑변 5 cm, 높이 12 cm인 직각삼각형을 높이를 축으로 돌렸어요. 생긴 원뿔의 밑면 지름은?", "a": 10, "h": "밑변이 밑면의 반지름", "s": "5 × 2 = 10 (cm)", "u": "cm"}], "2": [{"q": "밑면의 반지름 3 cm, 높이 10 cm인 원기둥 전개도에서 옆면의 넓이는? (원주율 3.14)", "a": 188.4, "h": "옆면 = 직사각형 (밑면 둘레 × 높이)", "s": "18.84 × 10 = 188.4 (cm²)", "u": "cm²"}, {"q": "원기둥 전개도에서 옆면의 가로가 37.68 cm예요. 밑면의 반지름은? (원주율 3.14)", "a": 6, "h": "옆면 가로 = 밑면의 둘레", "s": "37.68 ÷ 3.14 = 12 → 반지름 6 (cm)", "u": "cm"}, {"q": "밑면 반지름 2 cm, 높이 5 cm인 원기둥 전개도에서 옆면 직사각형의 둘레는? (원주율 3.14)", "a": 35.12, "h": "가로 = 밑면 둘레 12.56", "s": "(12.56 + 5) × 2 = 35.12 (cm)", "u": "cm"}, {"q": "높이 8 cm, 모선 10 cm, 밑면 반지름 6 cm인 원뿔의 밑면 둘레는? (원주율 3.14)", "a": 37.68, "h": "밑면 둘레 = 지름 × 3.14", "s": "12 × 3.14 = 37.68 (cm)", "u": "cm"}, {"q": "반지름이 5 cm인 구를 중심을 지나도록 잘랐어요. 잘린 면의 넓이는? (원주율 3.14)", "a": 78.5, "h": "잘린 면은 반지름 5 cm인 원", "s": "5 × 5 × 3.14 = 78.5 (cm²)", "u": "cm²"}, {"q": "가로 4 cm, 세로 6 cm인 직사각형을 세로를 축으로 돌려 만든 원기둥의 밑면 넓이는? (원주율 3.14)", "a": 50.24, "h": "밑면 반지름은 4 cm", "s": "4 × 4 × 3.14 = 50.24 (cm²)", "u": "cm²"}], "3": [{"q": "원기둥 전개도에서 옆면의 넓이가 251.2 cm²이고 높이가 8 cm예요. 밑면의 반지름은? (원주율 3.14)", "a": 5, "h": "옆면 가로 = 넓이 ÷ 높이", "s": "251.2 ÷ 8 = 31.4 = 밑면 둘레 → 지름 10, 반지름 5 (cm)", "u": "cm"}, {"q": "밑면 반지름 3 cm, 높이 5 cm인 원기둥 전개도 전체의 넓이는? (원주율 3.14)", "a": 150.72, "h": "밑면 2개 + 옆면", "s": "28.26 × 2 + 18.84 × 5 = 56.52 + 94.2 = 150.72 (cm²)", "u": "cm²"}, {"q": "밑면 지름 10 cm, 모선 13 cm인 원뿔을 앞에서 본 모양의 둘레는?", "a": 36, "h": "앞에서 본 모양은 이등변삼각형", "s": "13 + 13 + 10 = 36 (cm)", "u": "cm"}, {"q": "밑면 반지름 4 cm, 높이 10 cm인 원기둥 통의 옆면에 위아래로 1 cm씩 남기고 상표를 겹치지 않게 붙였어요. 상표의 넓이는? (원주율 3.14)", "a": 200.96, "h": "상표의 가로 = 밑면 둘레, 세로 = 10 − 2", "s": "25.12 × 8 = 200.96 (cm²)", function migrate(){
  const F=FRESH(), c=S.cfg||{};
  S.wear=Object.assign(F.wear,S.wear||{});

  if(S.lastDay&&S.lastIdx==null){const d=new Date(S.lastDay);S.lastIdx=Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/DAY)}
  delete S.lastDay;
  S.prog=S.prog||{};
  if(S.best){S.prog["5-2-4"]={best:S.best,tries:S.tries||{1:0,2:0,3:0}};delete S.best;delete S.tries}
  const pre=o=>{const n={};for(const k in o)n[k.includes("|")?k:"5-2-4|"+k]=o[k];return n};
  S.wrong=pre(S.wrong||{}); S.solved=pre(S.solved||{}); S.checks=pre(S.checks||{});
  S.attempts=(S.attempts||[]).map(a=>a.u?a:{...a,u:"5-2-4"});
  if(!UNITS[S.lastU]) S.lastU="5-2-4";
}

function hp(salt,pin){let h1=0xdeadbeef,h2=0x41c6ce57;const str=salt+":"+pin;
  for(let r=0;r<200;r++)for(let i=0;i<str.length;i++){const c=str.charCodeAt(i)+r;h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,"0")+(h1>>>0).toString(16).padStart(8,"0")}

async function pull(){ const k=ACC,e=entryOf(k); if(!CLOUD_OK||!k||!e) return;
  try{
    if(!e.cloud){ if(cloudRO||!e.lpin) return; const r=await CLOUD.create(e.nick,e.lpin,S); if(k!==ACC) return;
      if(r.err==="taken"){e.clash=true} else {Object.assign(e,r.ext); e.cloud=true; e.clash=false; delete e.lpin} saveDev(); refreshNote(); return }

    if(!r.exists){ if(!cloudRO) await CLOUD.put(e,S); saveDev(); refreshNote(); return }

    catch(err){ if(err&&err.code==="invalid_argument") cloudRO=true; e.lpin=pin } }

  const gap=S.lastIdx==null?99:t-S.lastIdx; let msg="";
  if(gap===1) S.streak++;
  else { if(gap===2&&S.streak>=2){S.repair={day:t,prev:S.streak};msg=" · 어제 출석을 놓쳤어요";}
         else if(S.lastIdx!=null&&S.streak>=2) msg=" · 이틀 이상 쉬어서 1일부터 다시 시작해요";
         S.streak=1; }

  const b=S.streak>=3?RW().att3:RW().att; S.coins+=b; save(); if(!quiet) setTimeout(()=>toast(`출석 ${S.streak}일째! ★ ${b}${msg}`),300); return b;

const repairOpen=()=>S.repair&&S.repair.day===dayIdx();
function daily(){const t=dayIdx();if(!S.daily||S.daily.day!==t)S.daily={day:t,n:0,done:false};return S.daily}
function countDaily(){const d=daily(); d.n++; const g=S.cfg.goal;
  if(g.on&&!d.done&&d.n>=g.n){d.done=true;S.coins+=g.bonus;setTimeout(()=>{toast(`오늘 목표 ${g.n}문제 달성! ★ ${g.bonus}`);confetti();SFX.clear()},900)} save()}
let act=0;
setInterval(()=>{if(!S.profile||!S.cfg.breakMin||document.visibilityState!=="visible")return;act+=15;if(act>=S.cfg.breakMin*60){act=0;showBreak()}},15000);
function showBreak(){ if($("#brk"))return; const d=document.createElement("div");d.id="brk";d.className="overlay";
  d.innerHTML=`<div class="card stack" role="dialog" aria-modal="true" aria-labelledby="brkT">${avatar(S.profile.char,S.wear)}<h2 id="brkT">${S.cfg.breakMin}분 동안 열심히 했어요!</h2><p>눈을 감고 쉬거나 물 한 잔 마시고 와요. 쉬고 나면 더 잘 풀려요.</p><button class="btn" id="brkOk">쉬고 왔어요</button></div>`;
  document.body.appendChild(d); const b=$("#brkOk"); b.onclick=()=>d.remove(); b.focus()}
function itemThumb(it){
  if(["house","furn","car","thing"].includes(it.cat)) return itemPrev(it);
  return avatar(S.profile.char,{...S.wear,[slotOf(it)]:it.id});
}
function goals(){
  const out=[], r=RW(), g=S.cfg.goal, d=daily(), pr=prog(), cl=S.cleared;
  if(g.on){ const left=Math.max(0,g.n-d.n);
    out.push(d.done?{tag:"목표",done:1,t:`오늘 목표 ${g.n}문제 달성! ★ ${g.bonus} 받았어요`}
      :{tag:"목표",t:`오늘 <b>${left}문제</b> 더 풀면 <b>★ ${g.bonus}</b>`,bar:Math.min(100,d.n/g.n*100),go:'data-go="unit"'}) }
  const lv=[1,2,3].find(l=>!cl[UKEY(l)]);
  if(lv){ const its=ITEMS.filter(i=>i.req===UKEY(lv));
    out.push({tag:"통과",t:`<b>${esc(UNITS[CU].t)} ${LV[lv].nm}</b>을 ${passOf(lv)}% 넘게 맞히면 <b>★ ${r["c"+lv]}</b>${its.length?` + <b>${its.map(i=>esc(i.nm)).join(", ")}</b> 열림`:""}`,thumb:its[0],go:unlocked(lv)?`data-lv="${lv}"`:'data-go="unit"'}) }
  const due=dueList().length;
  if(due) out.push({tag:"복습",t:`틀렸던 문제 <b>${due}개</b>를 다시 맞히면 하나에 <b>★ ${r.review}</b>`,go:'data-rev'});
  const buy=ITEMS.filter(i=>!S.owned.includes(i.id)&&!(i.req&&!cl[i.req])).sort((a,b)=>price(a)-price(b));
  const can=buy.filter(i=>price(i)<=S.coins).pop(), near=buy.find(i=>price(i)>S.coins);
  if(can) out.push({tag:"상점",t:`지금 별로 <b>${esc(can.nm)}</b>을(를) 살 수 있어요!`,thumb:can,go:`data-shop="${can.cat}"`});
  else if(near) out.push({tag:"상점",t:`별 <b>${price(near)-S.coins}개</b>만 더 모으면 <b>${esc(near.nm)}</b>`,thumb:near,go:`data-shop="${near.cat}"`});
  const locked=ITEMS.filter(i=>i.req&&!cl[i.req]&&!i.req.startsWith(CU+"-")&&isOpen(i.req.split("-").slice(0,3).join("-")))
    .sort((a,b)=>a.req.localeCompare(b.req))[0];
  if(locked){const uid=locked.req.split("-").slice(0,3).join("-"); out.push({tag:"보상",t:`<b>${esc(reqName(locked.req))}</b> 통과하면 <b>${esc(locked.nm)}</b>이(가) 열려요`,thumb:locked,go:`data-u="${uid}"`})}
  const c=Object.keys(cl).length, nt=TITLES.find(([n])=>n>c);
  if(nt) out.push({tag:"칭호",t:`단계 <b>${nt[0]-c}개</b>만 더 통과하면 <b>‘${nt[1]}’</b> 칭호`,go:'data-tab2="map"'});
  out.push(S.streak<3?{tag:"출석",t:`<b>${3-S.streak}일</b> 더 연속으로 오면 출석 별이 <b>★ ${r.att3}</b>로 올라요`}
    :{tag:"출석",t:`내일도 오면 출석 <b>${S.streak+1}일째</b> · <b>★ ${r.att3}</b>`});
  return out.slice(0,6);
}
function goalsCard(){
  const gs=goals();
  return `<section class="card stack goals" aria-labelledby="gTitle"><div class="cardtop"><h3 id="gTitle">받을 수 있는 보상</h3><span class="coins">★ <b>${S.coins}</b></span></div>
   <ul>${gs.map(x=>{const inner=`<span class="gtag${x.done?' done':''}">${x.done?'완료':x.tag}</span><span class="gtxt"><span>${x.t}</span>${x.bar!=null?`<span class="meter" style="--c:var(--accent)"><i style="width:${x.bar}%"></i></span>`:""}</span>${x.thumb?`<span class="gth">${itemThumb(x.thumb)}</span>`:""}`;
     return `<li>${x.go?`<button class="grow" ${x.go}>${inner}<span class="gchev" aria-hidden="true">›</span></button>`:`<div class="grow">${inner}</div>`}</li>`}).join("")}</ul></section>`;
}
function nextItemMsg(){
  const c=ITEMS.filter(i=>!S.owned.includes(i.id)&&!(i.req&&!S.cleared[i.req])).sort((a,b)=>price(a)-price(b))[0];
  if(!c) return "열린 아이템을 모두 모았어요!";
  return S.coins>=price(c)?`지금 별로 <b>${c.nm}</b>을(를) 살 수 있어요!`:`<b>${c.nm}</b>까지 별 <b class="num">${price(c)-S.coins}</b>개 남았어요.`;
}

/* ---------- 탭 ---------- */
let adminOK=false, ptab="log", admU=CU;
function tabs(){
  const n=dueList().length;
  const T=[["home","홈","오늘"],["map","단원","지도"],["review","오답","노트"],["closet","옷장","꾸미기"],["parent","부모님","보기"]];
  $("#tabs").innerHTML=T.map(([k,a,b])=>`<button data-tab="${k}" aria-current="${view.tab===k}"><b>${a}</b>${b}${k==="review"&&n?` <span class="badge">${n}</span>`:""}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.dataset.tab!=="parent")adminOK=false;go({tab:b.dataset.tab})});
}
function go(v){view=v;render();window.scrollTo(0,0)}

/* ---------- 화면 ---------- */
function render(){
  uid=0;
  const ob=!ACC||view.screen==="onboard";
  $("#tabs").hidden=ob; if(!ob) tabs();
  const r=!ACC?({welcome,login:loginScr,migrate:migrateScr,new:onboard}[GATE]||welcome):view.screen==="onboard"?onboard:{home,map,unit,quiz,result,review,parent,closet}[view.screen||view.tab];
  $("#app").innerHTML=r(); bind(); if(T3) T3.mount();
}
function dots(id=CU){const pr=prog(id);return `<div class="lvdots" title="기초·기본·심화">${[1,2,3].map(l=>`<i class="${pr.best[l]>=passOf(l,id)?'on'+l:''}"></i>`).join("")}</div>`}

function home(){
  const p=S.profile, n=dueList().length, pr=prog(), u=UNITS[CU];
  const next=[1,2,3].find(l=>pr.best[l]<passOf(l))||3, d=daily(), g=S.cfg.goal;
  return `<div class="stack">
   <div class="me card">${avatar(p.char,S.wear)}<div class="stack" style="gap:8px;min-width:0">
    <div class="cardtop"><p class="eyebrow">비상 수학 · 4~6학년</p><button class="back" data-logout>친구 바꾸기 ›</button></div><h1>${esc(p.nick)}, 안녕!</h1>
    <div class="row"><span class="chip">${title()}</span><span class="coins">★ <b>${S.coins}</b></span><span class="note">출석 ${S.streak}일째</span></div>
    <p class="bubble">${pick(SAY)}</p></div></div>
   ${repairOpen()?`<div class="card stack repair"><p class="eyebrow">출석 이어가기 · 오늘만 가능</p><p>어제 출석을 놓쳐서 <b class="num">${S.repair.prev}</b>일 연속 기록이 끊겼어요. 별 <b class="num">${S.cfg.repairCost}</b>개를 쓰면 기록을 이어서 오늘이 <b class="num">${S.repair.prev+1}</b>일째가 돼요.</p><p class="note">하루만 놓쳤을 때만 이어갈 수 있어요. 이틀 연속으로 쉬면 이어갈 수 없어요.</p><div class="row"><button class="btn" id="rpYes" ${S.coins<S.cfg.repairCost?'disabled':''}>★ ${S.cfg.repairCost}로 이어가기</button><button class="btn ghost" id="rpNo">그냥 새로 시작</button>${S.coins<S.cfg.repairCost?`<span class="note">별이 ${S.cfg.repairCost-S.coins}개 부족해요</span>`:""}</div></div>`:""}
   ${goalsCard()}
   <div class="card stack">
    <p class="eyebrow">이어서 하기 · ${uLabel(CU)}</p>
    <div class="top"><div><h2>${esc(u.t)}</h2><p class="muted">다음 단계: <b style="color:${LV[next].c}">${LV[next].nm}</b></p></div>${dots()}</div>
    <div class="row"><button class="btn" data-go="unit">공부하러 가기</button><button class="btn ghost" data-tab2="map">다른 단원 고르기</button></div>
   </div>
   <div class="card stack scenecard"><p class="eyebrow" style="padding:0 6px">우리 집</p>${scene(S.wear,p.char)}<div class="row" style="justify-content:space-between;padding:0 6px"><p>${nextItemMsg()}</p><button class="btn ghost sm" data-tab2="closet">꾸미러 가기</button></div></div>
   <p class="note" id="syncNote">${syncText()}</p>
  </div>`;
}

function map(){
  const list=BOOK[grade][sem].map((t,i)=>{
    const id=`${grade}-${sem}-${i+1}`, has=!!UNITS[id], open=isOpen(id);
    const right=open?dots(id):`<span class="s">${has?'부모님이 잠가 두었어요':'준비 중'}</span>`;
    return `<button class="unit ${open?'open':'soon'} ${id===CU?'cur':''}" ${open?`data-u="${id}"`:'disabled'}><span class="n">${i+1}</span><span class="t">${esc(t)}</span>${right}</button>`}).join("");
  return `<div class="stack">
   <div><p class="eyebrow">비상 교과서 단원</p><h1>단원 지도</h1></div>
   <div class="row" style="justify-content:space-between">
    <div class="seg">${[4,5,6].map(g=>`<button data-g="${g}" aria-pressed="${g===grade}">${g}학년</button>`).join("")}</div>
    <div class="seg">${[1,2].map(s=>`<button data-s="${s}" aria-pressed="${s===sem}">${s}학기</button>`).join("")}</div>
   </div>
   <div class="units">${list}</div>
   <p class="note">점 세 개는 기초 · 기본 · 심화 통과 표시예요.</p>
  </div>`;
}

function unit(){
  const U=UNITS[CU], pr=prog();
  const cs=U.concepts.map((c,i)=>{
    const st=S.checks[`${CU}|${i}`];
    return `<article class="card concept stack"><h3><span>개념 ${i+1}</span>${esc(c.t)}</h3>${fmtFr(c.body)}
     ${c.vis?`<div class="vis">${c.vis()}</div>`:""}<div class="eq">${fmt(c.eq)}</div>
     <div class="check"><p><b>확인</b> ${fmt(c.check.q)}</p>
      <div class="choices">${c.check.opts.map((o,j)=>`<button data-ck="${i}-${j}" class="${st&&st.done&&j===c.check.a?'right':''}">${fmt(o)}</button>`).join("")}</div>
      <p class="note" id="ck${i}">${st&&st.done?'맞았어요!':''}</p></div></article>`}).join("");
  const lv=[1,2,3].map(l=>{const ok=unlocked(l);return `<button class="level" style="--c:${LV[l].c}" data-lv="${l}" ${ok?'':'disabled'}>
    <span class="nm">${LV[l].nm}</span><span class="meta">${nOf(l)}문제 · 최고 ${pr.best[l]}%</span>
    <span class="meter"><i style="width:${pr.best[l]}%"></i></span>
    <span class="meta">${ok?(pr.best[l]>=passOf(l)?'통과!':(l===3?`${passOf(l)}% 넘으면 통과`:`${passOf(l)}% 넘으면 다음 단계`)):`${LV[l-1].nm} ${passOf(l-1)}% 넘으면 열려요`}</span></button>`}).join("");
  return `<div class="stack">
   <button class="back" data-tab2="map">‹ 단원 지도</button>
   <div><p class="eyebrow">${uLabel(CU)}</p><h1>${esc(U.t)}</h1></div>
   <h2>개념 정리</h2><div class="concepts">${cs}</div>
   <h2>문제 풀이</h2><div class="levels">${lv}</div>
  </div>`;
}

const SFX=(()=>{ let ac=null;
  function ctx(){ if(!ac){const A=window.AudioContext||window.webkitAudioContext; if(!A) return null; ac=new A()} if(ac.state==="suspended") ac.resume(); return ac }
  function note(f,t,d,type="triangle",v=.15){ const a=ctx(); if(!a) return; const o=a.createOscillator(), g=a.createGain(), t0=a.currentTime+t;
    o.type=type; o.frequency.setValueAtTime(f,t0); g.gain.setValueAtTime(.0001,t0); g.gain.linearRampToValueAtTime(v,t0+.015); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+d+.05) }
  const play=seq=>{ if(S.cfg.sound===false) return; try{seq.forEach(n=>note.apply(null,n))}catch(e){} };

function burst(el){ if(!el||!el.animate||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<14;i++){ const s=document.createElement("span"); s.className="bstar"; s.textContent="★"; s.style.left=cx+"px"; s.style.top=cy+"px"; s.style.color=["#F7D64B","#F06E9C","#7FB6EA","#8ED18E"][i%4]; document.body.appendChild(s);
    const a=i/14*Math.PI*2, d=70+Math.random()*70;
    s.animate([{transform:"translate(-50%,-50%) scale(.3)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d-24}px)) scale(1.4) rotate(${(Math.random()*240-120)|0}deg)`,opacity:0}],{duration:750+Math.random()*300,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>s.remove() } }

let Q=null;
function pickItems(l){let a=UNITS[CU].P[l].map((p,i)=>({...p,key:`${CU}|${l}-${i}`}));const n=nOf(l);
  if(S.cfg.shuffle){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}a=a.slice(0,n).sort((x,y)=>(x.top||0)-(y.top||0))}else a=a.slice(0,n);return a}
function startQuiz(l,items){Q={l,items:items||pickItems(l),i:0,res:[],tries:0,shown:null,review:!!items,combo:0,earned:0,gain:0,cbonus:0,ink:{}};go({tab:view.tab,screen:"quiz"})}
const lvOfKey=k=>+k.split("|")[1][0];
function parseAns(s){
  s=String(s).trim().replace(/,/g,"").replace(/\s*%$/,"").replace(/\s+/g," ");
  let m=s.match(/^(\d+) (\d+)\/(\d+)$/); if(m){const w=+m[1],n=+m[2],d=+m[3]; if(!d)return null; return {v:w+n/d,kind:"mixed",over:n>=d,reduced:n<d&&gcd(n,d)===1}}
  m=s.match(/^(\d+)\/(\d+)$/); if(m){const n=+m[1],d=+m[2]; if(!d)return null; return {v:n/d,kind:"frac",reduced:gcd(n,d)===1}}
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return {v:parseFloat(s),kind:"dec",reduced:true};
  return null;
}

  if(Q.shown==="sol") fb=`<div class="fb sol pop"><strong>풀이</strong><p>${fmt(p.s)}</p><p class="note">정답은 <b>${fmt(String(p.a))}</b>${p.u?" "+esc(p.u):""}. 오답노트에 담아 두었어요.</p></div>`;

function submit(v){

  const want=parseAns(String(p.a)).v, ok=Math.abs(r.v-want)<1e-9*Math.max(1,Math.abs(want));

    if(!r.reduced){Q.shown="reduce";Q.rmsg=r.over?"분수 부분이 1보다 작아지게 대분수로 나타내 볼까요?":"약분해서 기약분수로 나타내 볼까요?";Q.keep=v;render();return}
  }

      Q.gain=Q.review?RW().review:(sv===0?(p.top?RW().top:RW()["p"+lv]):sv===1?1:0); if(!Q.review)S.solved[p.key]=sv+1;

    else {Q.res[Q.i]=false;Q.combo=0;}
    Q.shown="ok"; if(Q.review) reviewMark(p.key,Q.tries===0); else if(Q.tries>0) addWrong(p.key); countDaily();}

    if(own) btn=(it.cat==="bg"||it.cat==="house")&&on?`<button class="btn sm" disabled>쓰는 중</button>`:`<button class="btn ${on?'':'ghost'} sm" data-wear="${it.id}">${on?(HOMECATS.includes(it.cat)?'치우기':'벗기'):(it.cat==="bg"||it.cat==="house"?'바꾸기':HOMECATS.includes(it.cat)?'놓기':'입기')}</button>`;
    else if(lock) btn=`<span class="lock">${reqName(it.req)} 통과하면 열려요</span>`;
    else if(S.coins<pr) btn=`<button class="btn ghost sm" disabled>★ ${pr}</button>`;
    else btn=`<button class="btn sm" data-buy="${it.id}">${armed===it.id?'한 번 더 누르면 구매':`★ ${pr} 사기`}</button>`;
    return `<div class="item ${on?'on':''} ${lock?'locked':''}">${HOMECATS.includes(it.cat)?itemPrev(it):avatar(p.char,{...S.wear,[sl]:it.id})}<b>${it.nm}</b>${it.req?`<span class="tag">${reqName(it.req)} 통과 보상</span>`:""}${btn}</div>`}).join("");
  const r=RW();
  return `<div class="stack">
   <div class="me card big3">${T3&&!HOMECATS.includes(shopCat)?`<div class="live3wrap"><canvas class="av live3" data-live="avatar" width="420" height="480" role="img" aria-label="내 캐릭터"></canvas><span class="hint3">밀어서 돌려 봐요</span></div>`:avatar(p.char,S.wear)}<div class="stack" style="gap:8px;min-width:0">
    <p class="eyebrow">${CHARS[p.char].nm} 친구</p><h1>${esc(p.nick)}</h1>
    <div class="row"><span class="chip">${title()}</span><span class="coins">★ <b>${S.coins}</b></span></div>
    <div><button class="back" data-edit>프로필 바꾸기 ›</button></div></div></div>
   ${HOMECATS.includes(shopCat)?`<div class="card scenecard">${scene(S.wear,p.char)}</div>`:""}
   <div class="seg">${CATS.map(([k,n])=>`<button data-cat="${k}" aria-pressed="${k===shopCat}">${n}</button>`).join("")}</div>
   <div class="shop">${items}</div>
   <p class="note">별은 처음 맞힌 문제(기초 ${r.p1} · 기본 ${r.p2} · 심화 ${r.p3} · 최상위 ${r.top}), 3문제 연속 정답(+${r.combo}), 단계 첫 통과(${r.c1} · ${r.c2} · ${r.c3}), 오답 복습(${r.review}), 매일 출석(${r.att}, 3일 연속부터 ${r.att3})${S.cfg.goal.on?`, 하루 목표 달성(${S.cfg.goal.bonus})`:""}으로 모여요. 같은 문제는 두 번째로 맞히면 1개, 세 번째부터는 별이 없어요.</p>
  </div>`;
}

/* ---------- 이벤트 ---------- */
function bind(){
  const all=(s,f)=>document.querySelectorAll(s).forEach(f);
  all("[data-go]",b=>b.onclick=()=>go({tab:"map",screen:b.dataset.go}));
  all("[data-tab2]",b=>b.onclick=()=>go({tab:b.dataset.tab2}));
  all("[data-g]",b=>b.onclick=()=>{grade=+b.dataset.g;render()});
  all("[data-s]",b=>b.onclick=()=>{sem=+b.dataset.s;render()});
  all("[data-u]",b=>b.onclick=()=>{CU=b.dataset.u;S.lastU=CU;admU=CU;save();go({tab:"map",screen:"unit"})});
  all("[data-lv]",b=>b.onclick=()=>{view.tab="map";startQuiz(+b.dataset.lv)});
  all("[data-ck]",b=>b.onclick=()=>{
    const[i,j]=b.dataset.ck.split("-").map(Number), c=UNITS[CU].concepts[i].check, ok=j===c.a;
    b.classList.add(ok?'right':'wrong'); $("#ck"+i).textContent=ok?'맞았어요!':'다시 생각해 볼까요? 위 설명을 한 번 더 읽어 봐요.';
    if(ok){S.checks[`${CU}|${i}`]={done:true};save()}});
  const f=$("#af"); if(f) f.onsubmit=e=>{e.preventDefault(); if(INK.timer){INK.recognize()} submit($("#ans").value)};
  INK.mount();
  const nb=$("[data-next]"); if(nb){nb.onclick=next;nb.focus()}
  const q=$("[data-quit]"); if(q) q.onclick=()=>Q.review?go({tab:"review"}):go({tab:"map",screen:"unit"});
  const rv=$("[data-rev]"); if(rv) rv.onclick=()=>{view.tab="review";startQuiz(null,dueList().map(([k])=>({...findP(k),key:k})))};
  const rs=$("#rst"); if(rs) rs.onclick=()=>{
    if(rs.dataset.armed){const cfg=S.cfg,pf=S.profile;S=FRESH();S.cfg=cfg;S.profile=pf;S.lastIdx=dayIdx();S.streak=1;OB=null;CU="5-2-4";save();go({tab:"home"})}
    else{rs.dataset.armed=1;rs.textContent="한 번 더 누르면 지워져요";}};
  const a=$("#ans"); if(a&&!a.disabled&&view.screen==="quiz") autoFocus(a);
  const ry=$("#rpYes"); if(ry) ry.onclick=()=>{if(!repairOpen()||S.coins<S.cfg.repairCost)return;S.coins-=S.cfg.repairCost;S.streak=S.repair.prev+1;S.repair=null;save();render();toast(`출석 기록을 이었어요! ${S.streak}일째`)};
  const rn=$("#rpNo"); if(rn) rn.onclick=()=>{S.repair=null;save();render()};
  all("[data-pt]",b=>b.onclick=()=>{ptab=b.dataset.pt;render()});
  const pf=$("#pinf"); if(pf){$("#pinIn").focus(); pf.onsubmit=e=>{e.preventDefault(); if($("#pinIn").value===S.cfg.pin){adminOK=true;render()} else {$("#pinMsg").textContent="비밀번호가 달라요";$("#pinIn").value=""}}}
  const af=$("#admf"); if(af){ af.onsubmit=e=>e.preventDefault();
    af.addEventListener("change",e=>{ if(e.target.id==="admUnit"){admU=e.target.value;render();return} if(e.target.id==="cGive")return; readAdmin(); if(e.target.id==="cPinOff"&&e.target.checked){toast("비밀번호 잠금을 풀었어요");render()} });
    $("#cPin").addEventListener("input",e=>{if(e.target.value.length===4)readAdmin()}); }
  const gb=$("#giveBtn"); if(gb) gb.onclick=()=>{const x=parseInt($("#cGive").value,10)||0; if(!x) return; S.coins=Math.max(0,S.coins+x); save(); toast(x>0?`별 ${x}개를 줬어요 (지금 ★ ${S.coins})`:`별 ${-x}개를 뺐어요 (지금 ★ ${S.coins})`); render()};
  const obUpd=()=>{const g=$("#obgo"); if(g) g.disabled=busy||!obReady()};
  const nk=$("#nick"); if(nk) nk.oninput=()=>{OB.nick=nk.value;obUpd()};
  const p1=$("#pin"); if(p1) p1.oninput=()=>{OB.pin=p1.value;obUpd()};
  const p2=$("#pin2"); if(p2) p2.oninput=()=>{OB.pin2=p2.value;obUpd()};
  all("[data-ch]",b=>b.onclick=()=>{OB.char=b.dataset.ch;render()});
  const og=$("#obgo"); if(og) og.onclick=async()=>{
    if(!obReady()||busy) return;
    if(ACC){ S.profile.char=OB.char; const e=entryOf(ACC); if(e){e.char=OB.char;saveDev()} OB=null; save(); go({tab:"closet"}); toast("프로필을 바꿨어요"); return }
    busy=true; gateMsg=""; const m=await createAccount(OB.nick.trim().slice(0,8),OB.char,OB.pin); busy=false;
    if(m){gateMsg=m;render()} };
  const oc=$("#obcancel"); if(oc) oc.onclick=()=>{OB=null;gateMsg=""; if(ACC) go({tab:"closet"}); else {GATE="welcome";render()}};
  all("[data-gate]",b=>b.onclick=()=>{GATE=b.dataset.gate;gateMsg="";OB=null;rmArm=null;render();window.scrollTo(0,0)});
  all("[data-acc]",b=>b.onclick=()=>{const k=b.dataset.acc,st=cachedState(k); if(st) enter(k,st,false)});
  all("[data-rm]",b=>b.onclick=()=>{const k=b.dataset.rm; if(rmArm!==k){rmArm=k;render();return}
    DEV.accts=DEV.accts.filter(a=>a.key!==k); if(DEV.cur===k)DEV.cur=null; saveDev(); try{localStorage.removeItem(ckey(k))}catch(e){} rmArm=null; render()});
  all("[data-logout]",b=>b.onclick=logout);
  const lf=$("#lgf"); if(lf) lf.onsubmit=async e=>{e.preventDefault(); if(busy)return; LG.nick=$("#lgNick").value.trim(); const pin=$("#lgPin").value.trim();
    if(!LG.nick){gateMsg="닉네임을 써 주세요";render();return} if(!okPin(pin)){gateMsg="비밀번호는 숫자 4자리예요";render();return}
    busy=true; gateMsg=""; const m=await login(LG.nick,pin); busy=false; if(m){gateMsg=m;render()} };
  const mf=$("#mgf"); if(mf) mf.onsubmit=async e=>{e.preventDefault(); if(busy)return; MG.nick=$("#mgNick").value.trim().slice(0,8); const a=$("#mgPin").value.trim(), b2=$("#mgPin2").value.trim();
    if(!MG.nick){gateMsg="닉네임을 써 주세요";render();return} if(!okPin(a)){gateMsg="비밀번호는 숫자 4자리로 정해 주세요";render();return} if(a!==b2){gateMsg="두 비밀번호가 달라요";render();return}
    busy=true; gateMsg=""; const m=await migrateLegacy(MG.nick,a); busy=false; if(m){gateMsg=m;render()} };
  const pwf=$("#pwf"); if(pwf) pwf.onsubmit=async e=>{e.preventDefault(); const a=$("#pw1").value.trim(),b2=$("#pw2").value.trim(),msg=$("#pwMsg");
    if(!okPin(a)){msg.textContent="숫자 4자리로 정해 주세요";return} if(a!==b2){msg.textContent="두 비밀번호가 달라요";return}
    msg.textContent="바꾸는 중이에요…"; const m=await changePin(a); if(m){msg.textContent=m;return} $("#pw1").value="";$("#pw2").value=""; msg.textContent=""; toast("로그인 비밀번호를 바꿨어요")};
  const ed=$("[data-edit]"); if(ed) ed.onclick=()=>{OB=null;go({tab:"closet",screen:"onboard"})};
  all("[data-cat]",b=>b.onclick=()=>{shopCat=b.dataset.cat;armed=null;render()});
  all("[data-shop]",b=>b.onclick=()=>{shopCat=b.dataset.shop;armed=null;go({tab:"closet"})});
  all("[data-wear]",b=>b.onclick=()=>{
    const it=ITEMS.find(i=>i.id===b.dataset.wear), sl=slotOf(it);
    S.wear[sl]=S.wear[sl]===it.id&&it.cat!=="bg"&&it.cat!=="house"?null:it.id; armed=null; save(); render(); if(S.wear[sl]){SFX.pop(); if(T3) T3.spin()}});
  all("[data-buy]",b=>b.onclick=()=>{
    const it=ITEMS.find(i=>i.id===b.dataset.buy);
    if(armed!==it.id){armed=it.id;render();return}
    if(S.coins<price(it)) return;
    S.coins-=price(it); S.owned.push(it.id); S.wear[slotOf(it)]=it.id; armed=null; save(); render(); toast(`${it.nm}을(를) 샀어요!`); SFX.buy(); if(T3) T3.spin()});
}
(function boot(){
  const cur=DEV.cur&&entryOf(DEV.cur)&&cachedState(DEV.cur);
  if(cur) enter(DEV.cur,cur,false); else { GATE="welcome"; render() }
  cloudReady().then(ok=>{ if(!ok) return; if(ACC) pull(); else render() });
})();
</script>
