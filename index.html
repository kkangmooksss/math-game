<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>소은이 수학 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 모눈 공책 위에 단원 카드와 문제 카드를 한 줄로 쌓는 앱 화면, 아래 탭바 */
:root{
  --paper:#FAFBF6; --grid:#E3E9E1; --ink:#1E2833; --muted:#5E6B66; --line:#D5DDD6;
  --card:#FFFFFF; --accent:#1F6B5B; --accent-ink:#FFFFFF; --mark:#F7D64B; --mark-soft:#FBEFB4;
  --lv1:#3B8A57; --lv2:#2E67AA; --lv3:#B0452E; --ok:#2E8B57; --bad:#C2412D; --soft:#EEF3EE;
  --f-display:"Gaegu","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#13191A; --grid:#1D2526; --ink:#E7ECE8; --muted:#9AA8A2; --line:#2C3637;
  --card:#1A2224; --accent:#4FB39C; --accent-ink:#0E1615; --mark:#E8C63A; --mark-soft:#3D3618;
  --lv1:#6CC28B; --lv2:#6FA3E0; --lv3:#E78A72; --ok:#5FC28A; --bad:#EE7A64; --soft:#202A2B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13191A; --grid:#1D2526; --ink:#E7ECE8; --muted:#9AA8A2; --line:#2C3637;
  --card:#1A2224; --accent:#4FB39C; --accent-ink:#0E1615; --mark:#E8C63A; --mark-soft:#3D3618;
  --lv1:#6CC28B; --lv2:#6FA3E0; --lv3:#E78A72; --ok:#5FC28A; --bad:#EE7A64; --soft:#202A2B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:2.2rem} h2{font-size:1.75rem} h3{font-size:1.35rem}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px}
.hl{background:linear-gradient(transparent 55%,var(--mark-soft) 55%);padding:0 2px}
.eyebrow{font-size:.8rem;letter-spacing:.06em;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.back{border:0;background:none;color:var(--muted);padding:0;font-size:.95rem}

/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));z-index:5}
.tabbar button{flex:1;max-width:180px;border:0;background:none;padding:10px 4px 12px;font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button b{font-family:var(--f-display);font-size:1.3rem;line-height:1}
.tabbar button[aria-current="true"]{color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:.75rem;line-height:20px;text-align:center}

/* segmented */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* units */
.units{display:grid;gap:10px}
.unit{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.unit .n{font-family:var(--f-num);font-weight:600;color:var(--muted);width:1.4em}
.unit .t{flex:1;min-width:0;font-weight:700}
.unit .s{font-size:.82rem;color:var(--muted);white-space:nowrap}
.unit.open{border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.unit.open .s{color:var(--accent);font-weight:700}
.unit.soon{opacity:.62}

/* progress dots */
.lvdots{display:flex;gap:4px}
.lvdots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.lvdots i.on1{background:var(--lv1)}.lvdots i.on2{background:var(--lv2)}.lvdots i.on3{background:var(--lv3)}

/* concept */
.concepts{display:grid;gap:14px}
.concept h3{display:flex;gap:10px;align-items:baseline}
.concept h3 span{font-family:var(--f-num);font-size:.9rem;color:var(--accent)}
.eq{font-family:var(--f-num);font-size:1.15rem;background:var(--soft);border-radius:10px;padding:10px 14px;overflow-x:auto;white-space:nowrap}
.blocks{display:flex;flex-wrap:wrap;gap:6px}
.bar{display:grid;grid-template-columns:repeat(10,1fr);width:150px;max-width:100%;height:18px;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden}
.bar i{border-right:1px solid var(--line)}
.bar i.f{background:var(--lv1)}
.hund{display:grid;grid-template-columns:repeat(10,1fr);width:180px;max-width:100%;aspect-ratio:1;border:1.5px solid var(--ink)}
.hund i{border:.5px solid var(--line)}
.hund i.a{background:color-mix(in srgb,var(--lv2) 30%,transparent)}
.hund i.b{background:color-mix(in srgb,var(--lv3) 30%,transparent)}
.hund i.ab{background:var(--lv2)}
.vis{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.check{border-top:1.5px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choices button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-family:var(--f-num)}
.choices button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.choices button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}

/* levels */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:480px){.levels{grid-template-columns:1fr}}
.level{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--c)}
.level .nm{font-family:var(--f-display);font-size:1.5rem;font-weight:700;color:var(--c);line-height:1}
.level .meta{font-size:.82rem;color:var(--muted)}
.level[disabled]{opacity:.5;cursor:not-allowed}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c)}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700;color:#fff;background:var(--c)}
.steps{display:flex;gap:4px;flex:1;max-width:260px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.ok{background:var(--ok)}.steps i.no{background:var(--bad)}.steps i.cur{background:var(--ink)}
.qtext{font-size:1.2rem;line-height:1.7}
.qtext .num{font-size:1.05em}
.answer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.answer input{font-family:var(--f-num);font-size:1.5rem;width:9ch;max-width:100%;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);text-align:right}
.unitlabel{font-size:1.1rem}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.hint{background:var(--mark-soft)}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.fb.sol{background:var(--soft);border:1.5px solid var(--line)}
.fb strong{font-family:var(--f-display);font-size:1.25rem}
.result-big{font-family:var(--f-display);font-size:3.5rem;line-height:1;color:var(--accent)}

/* parent */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat div{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-num);font-size:1.6rem}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td.num{text-align:right}
.scroll{overflow-x:auto}
.note{font-size:.85rem;color:var(--muted)}
.av{display:block;width:100%;height:auto}
.me{display:flex;gap:16px;align-items:center}
.me .av{width:124px;flex:none;border-radius:16px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;background:var(--mark-soft);font-weight:700;font-size:.85rem}
.coins{font-weight:700;white-space:nowrap}.coins b{font-family:var(--f-num)}
.bubble{background:var(--soft);border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:.95rem}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:480px){.chars{grid-template-columns:repeat(2,1fr)}}
.charbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;font-weight:700}
.charbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.charbtn .av,.item .av{border-radius:10px}
input.text{font:inherit;font-size:1.2rem;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);width:100%;max-width:320px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:420px){.shop{grid-template-columns:repeat(2,minmax(0,1fr))}}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:center;min-width:0}
.item.on{border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.item.locked .av{filter:grayscale(1) opacity(.55)}
.btn.sm{padding:8px 12px;font-size:.9rem}
.lock{font-size:.8rem;color:var(--muted);padding:6px 0}
.tag{font-size:.75rem;color:var(--lv3);font-weight:700}
.gain{font-weight:700}
.cheer{display:flex;gap:10px;align-items:center}
.cheer .av{width:46px;flex:none;border-radius:8px}
.reward{background:var(--mark-soft);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;align-items:center}
.cardtop{display:flex;justify-content:space-between;gap:10px}
.scene{display:block;width:100%;height:auto;border-radius:14px}
.scenecard{padding:10px}
.chargroup{display:flex;flex-direction:column;gap:8px}
.repair{border-color:var(--lv3)}
.item .prev{display:block;width:100%;height:auto;border-radius:10px;aspect-ratio:7/8;background:#EAF4FB}
.setrow{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.setrow b{width:3em;font-family:var(--f-display);font-size:1.2rem}
#admf input[type=number]{font-family:var(--f-num);font-size:1rem;width:5.5em;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
select.text{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);max-width:100%}
.chk{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;font-family:var(--f-num);font-size:.82em;margin:0 3px}
.fr i{font-style:normal;padding:0 2px}.fr i:first-child{border-bottom:1.5px solid currentColor}
.eq .fr{font-size:.8em}
.overlay{position:fixed;inset:0;background:rgba(15,22,22,.55);display:grid;place-items:center;z-index:40;padding:16px}
.overlay .card{max-width:360px;text-align:center;align-items:center}
.overlay .av{width:120px;border-radius:14px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 16px}
.setgrid label{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opengrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
#admf input[type=number]{font-family:var(--f-num);font-size:1rem;width:5.5em;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.unit.cur{background:var(--mark-soft)}
.stack>*,.concepts>*{min-width:0}
.eq{white-space:pre}
.back{align-self:flex-start;text-align:left}
.who{display:grid;gap:10px}
.whorow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.whobtn{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
.whobtn .av{width:56px;flex:none;border-radius:10px}
.whobtn>span{display:flex;flex-direction:column}
.errmsg{color:var(--bad);font-weight:700}
.goals ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.grow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font:inherit}
button.grow:hover{border-color:var(--accent)}
.gtag{flex:none;width:3.2em;text-align:center;border-radius:8px;padding:3px 0;font-size:.8rem;font-weight:700;background:var(--mark-soft);color:var(--ink)}
.gtag.done{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.gtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;line-height:1.45}
.gth{flex:none;width:44px}
@media (max-width:480px){.me .av{width:92px}.me h1{font-size:1.8rem}}.gth svg,.gth img{display:block;width:44px;height:auto;border-radius:8px}
.gchev{flex:none;color:var(--muted);font-size:1.3rem}
.live3wrap{position:relative;flex:none}
.live3wrap canvas{display:block;width:100%;height:auto;border-radius:16px;touch-action:pan-y;cursor:grab}
.hint3{position:absolute;right:8px;bottom:6px;font-size:.72rem;color:#5E6B66;background:rgba(255,255,255,.75);border-radius:999px;padding:1px 8px;pointer-events:none}
.me.big3 .live3wrap{width:190px}
.me.big3 .live3wrap .av{width:100%}
@media (max-width:480px){.me.big3 .live3wrap{width:140px}}
.item img.prev,.item img.av{display:block;width:100%;height:auto;border-radius:10px}
.hw{border:1.5px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.hwhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hwhead .note{flex:1;min-width:0;color:var(--accent);font-weight:700}
.hwpad{display:block;width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;touch-action:none;color:var(--ink);cursor:crosshair}
.hwpad.wide{height:120px}
.hwfrac{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.hwcol{display:flex;flex-direction:column;gap:4px;align-items:center}
.hwfrac .hwpad{width:150px;height:84px}.hwbar{display:block;width:150px;height:3px;background:var(--ink);border-radius:2px}
#board{display:block;width:100%;height:380px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;touch-action:none;color:var(--ink);cursor:crosshair;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
@media (max-width:480px){#board{height:280px}.hwfrac .hwpad,.hwbar{width:120px}}
.tool{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bstar{position:fixed;z-index:35;pointer-events:none;font-size:22px;line-height:1}
@media (prefers-reduced-motion:no-preference){.cheer .av{animation:hop .7s ease-out}@keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-10px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}100%{transform:none}}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}}
</style>

<script>
/* ---------- 교과 구조 (비상 교과서 단원 순서) ---------- */
const BOOK = {
  4:{1:["큰 수","각도","곱셈과 나눗셈","삼각형","막대그래프","관계와 규칙"],
     2:["분수의 덧셈과 뺄셈","사각형","소수의 덧셈과 뺄셈","다각형","꺾은선그래프","평면도형의 이동"]},
  5:{1:["자연수의 혼합 계산","약수와 배수","대응 관계","약분과 통분","분수의 덧셈과 뺄셈","다각형의 둘레와 넓이"],
     2:["수의 범위와 올림, 버림, 반올림","분수의 곱셈","합동과 대칭","소수의 곱셈","직육면체와 정육면체","평균과 가능성"]},
  6:{1:["분수의 나눗셈","각기둥과 각뿔","소수의 나눗셈","비와 비율","여러 가지 그래프","직육면체의 겉넓이와 부피"],
     2:["분수의 나눗셈","공간과 입체","소수의 나눗셈","비례식과 비례배분","원의 둘레와 넓이","원기둥, 원뿔, 구"]}
};

const U45={"4-1-1": {"t": "큰 수", "concepts": [{"t": "만과 몇만", "body": "<p>9999보다 1 큰 수가 <span class=\"hl\">10000(만)</span>이에요. 10000이 3개면 30000(삼만), 10000이 25개면 250000(이십오만)이에요.</p>", "eq": "10000이 47개 → 470000 (사십칠만)", "check": {"q": "10000이 6개인 수는?", "opts": ["6000", "60000", "600000"], "a": 1}}, {"t": "억과 조", "body": "<p>1000만이 10개면 <span class=\"hl\">1억</span>(100000000), 1000억이 10개면 <span class=\"hl\">1조</span>예요. 큰 수는 오른쪽부터 <span class=\"hl\">네 자리씩 끊어</span> 읽어요.</p>", "eq": "3527 0000 0000 → 3527억", "check": {"q": "1억은 1000만이 몇 개인 수?", "opts": ["10개", "100개", "1000개"], "a": 0}}, {"t": "뛰어 세기와 크기 비교", "body": "<p>어느 자리 숫자가 바뀌는지 보면 얼마씩 뛰어 셌는지 알 수 있어요. 크기는 <span class=\"hl\">자리 수부터</span> 비교하고, 같으면 높은 자리부터 비교해요.</p>", "eq": "25억 → 35억 → 45억 : 10억씩 뛰어 셈", "check": {"q": "56억과 9억 8000만 중 더 큰 수는?", "opts": ["56억", "9억 8000만", "같아요"], "a": 0}}], "P": {"1": [{"q": "10000이 7개, 1000이 3개인 수는?", "a": 73000, "h": "70000과 3000을 더해요.", "s": "70000 + 3000 = 73000"}, {"q": "10000이 52개인 수는?", "a": 520000, "h": "10000 × 52", "s": "520000 (오십이만)"}, {"q": "38520000에서 숫자 8이 나타내는 값은?", "a": 8000000, "h": "오른쪽부터 일, 십, 백, 천, 만, 십만, 백만, 천만으로 자리를 세어 보세요.", "s": "8은 백만의 자리 → 8000000"}, {"q": "1억은 9900만보다 얼마나 더 큰 수일까요?", "a": 1000000, "h": "1억 = 100000000", "s": "100000000 − 99000000 = 1000000 (100만)"}, {"q": "1000억이 10개인 수는 몇 조일까요?", "a": 1, "h": "1000억이 10개면?", "s": "1조", "u": "조"}, {"q": "4500만에서 1000만씩 3번 뛰어 센 수는 몇 만일까요?", "a": 7500, "h": "천만의 자리 숫자가 1씩 커져요.", "s": "4500만 → 5500만 → 6500만 → 7500만", "u": "만"}], "2": [{"q": "어떤 수에서 100억씩 4번 뛰어 세었더니 9530억이 되었어요. 어떤 수는 몇 억일까요?", "a": 9130, "h": "거꾸로 100억씩 4번 빼요.", "s": "9530억 − 400억 = 9130억", "u": "억"}, {"q": "10000원짜리 23장, 1000원짜리 15장, 100원짜리 8개는 모두 얼마일까요?", "a": 245800, "h": "각각 얼마인지 먼저 구해요.", "s": "230000 + 15000 + 800 = 245800 (원)", "u": "원"}, {"q": "0부터 9까지 숫자 카드를 한 번씩 모두 써서 만든 가장 큰 열 자리 수에서 억의 자리 숫자는?", "a": 8, "h": "가장 큰 수는 큰 숫자부터 차례로 놓아요.", "s": "9876543210 → 십억의 자리 9, 억의 자리 8"}, {"q": "1조는 1억의 몇 배일까요?", "a": 10000, "h": "1조 = 10000억", "s": "1억이 10000개 → 10000 (배)", "u": "배"}, {"q": "1000만 원이 든 상자가 340개 있어요. 모두 몇 억 원일까요?", "a": 34, "h": "1000만 원이 10개면 1억 원", "s": "340 ÷ 10 = 34 → 34억 원", "u": "억 원"}, {"q": "3억 5000만을 10배 한 수는 몇 억일까요?", "a": 35, "h": "10배 하면 각 숫자가 한 자리씩 올라가요.", "s": "35억", "u": "억"}], "3": [{"q": "어떤 수를 10배씩 3번 했더니 4조가 되었어요. 어떤 수는 몇 억일까요?", "a": 40, "h": "10배씩 3번 = 1000배", "s": "4조 ÷ 1000 = 40억", "u": "억"}, {"q": "0부터 9까지의 숫자 중 52□8억 > 5267억 이 되게 하는 □는 모두 몇 개일까요?", "a": 4, "h": "□에 6을 넣으면 5268억이에요.", "s": "6, 7, 8, 9 → 4개", "u": "개"}, {"q": "어느 회사의 매출이 매년 2000억 원씩 늘어요. 올해 3조 4000억 원이면 4년 뒤에는 몇 억 원일까요?", "a": 42000, "h": "3조 4000억 = 34000억", "s": "34000억 + 8000억 = 42000억 (4조 2000억)", "u": "억 원"}, {"q": "숫자 카드 0, 2, 4, 6, 8을 한 번씩 모두 써서 만든 다섯 자리 수 중 60000에 가장 가까운 수는?", "a": 60248, "h": "60000보다 조금 큰 수와 조금 작은 수를 각각 만들어 비교해 보세요.", "s": "큰 쪽 60248 (248 차이), 작은 쪽 48620 (11380 차이) → 60248", "top": 1}, {"q": "어떤 수를 100배 해야 할 것을 잘못하여 10000으로 나누었더니 37만이 되었어요. 바르게 계산한 값은 몇 억일까요?", "a": 3700, "h": "먼저 어떤 수를 구해요: 37만 × 10000", "s": "어떤 수 = 37억, 37억 × 100 = 3700억", "u": "억", "top": 1}]}}, "4-1-2": {"t": "각도", "concepts": [{"t": "각도와 단위", "body": "<p>각의 크기를 각도라고 하고 <span class=\"hl\">1°(1도)</span>가 단위예요. 직각은 90°, <span class=\"hl\">예각</span>은 0°보다 크고 90°보다 작은 각, <span class=\"hl\">둔각</span>은 90°보다 크고 180°보다 작은 각이에요.</p>", "eq": "직각 90° · 예각 < 90° < 둔각 < 180°", "check": {"q": "130°는 어떤 각?", "opts": ["예각", "직각", "둔각"], "a": 2}}, {"t": "각도의 합과 차", "body": "<p>각도의 합과 차는 <span class=\"hl\">자연수처럼</span> 더하고 빼요. 직선이 이루는 각은 180°, 한 바퀴는 360°예요.</p>", "eq": "180° − 65° = 115°", "check": {"q": "70° + 45° 는?", "opts": ["115°", "25°", "105°"], "a": 0}}, {"t": "삼각형과 사각형의 각", "body": "<p>삼각형의 세 각의 합은 <span class=\"hl\">180°</span>, 사각형의 네 각의 합은 <span class=\"hl\">360°</span>예요. 사각형은 삼각형 2개로 나눌 수 있거든요.</p>", "eq": "삼각형: 50° + 60° + □ = 180° → □ = 70°", "check": {"q": "사각형 세 각이 90°, 90°, 100° 이면 나머지 각은?", "opts": ["80°", "90°", "100°"], "a": 0}}], "P": {"1": [{"q": "45° + 70° = □°", "a": 115, "h": "자연수의 덧셈처럼!", "s": "115°", "u": "°"}, {"q": "160° − 85° = □°", "a": 75, "h": "자연수의 뺄셈처럼!", "s": "75°", "u": "°"}, {"q": "삼각형의 두 각이 50°, 60°일 때 나머지 한 각은?", "a": 70, "h": "삼각형 세 각의 합은 180°", "s": "180 − 50 − 60 = 70 (°)", "u": "°"}, {"q": "사각형의 세 각이 90°, 80°, 100°일 때 나머지 한 각은?", "a": 90, "h": "사각형 네 각의 합은 360°", "s": "360 − 270 = 90 (°)", "u": "°"}, {"q": "직선 위의 한 각이 65°일 때 그 옆에 붙은 각은?", "a": 115, "h": "직선이 이루는 각은 180°", "s": "180 − 65 = 115 (°)", "u": "°"}, {"q": "시계의 긴바늘이 15분 동안 도는 각도는?", "a": 90, "h": "긴바늘은 60분에 한 바퀴(360°)", "s": "360 ÷ 4 = 90 (°)", "u": "°"}], "2": [{"q": "시계가 5시일 때 긴바늘과 짧은바늘이 이루는 작은 쪽 각도는?", "a": 150, "h": "숫자 한 칸은 360 ÷ 12 = 30°", "s": "5칸 × 30° = 150°", "u": "°"}, {"q": "삼각자의 45° 각과 30° 각을 붙여 만든 각은?", "a": 75, "h": "두 각을 더해요.", "s": "45 + 30 = 75 (°)", "u": "°"}, {"q": "삼각형에서 두 각의 크기가 같고 나머지 한 각이 40°예요. 같은 두 각 중 하나는?", "a": 70, "h": "180°에서 40°를 빼고 반으로 나눠요.", "s": "(180 − 40) ÷ 2 = 70 (°)", "u": "°"}, {"q": "사각형에서 두 각이 110°씩이고 나머지 두 각의 크기가 같아요. 나머지 한 각은?", "a": 70, "h": "360°에서 220°를 빼요.", "s": "(360 − 220) ÷ 2 = 70 (°)", "u": "°"}, {"q": "한 점에서 그은 세 선이 한 바퀴를 세 각으로 나눴어요. 두 각이 125°, 140°이면 나머지 각은?", "a": 95, "h": "한 바퀴는 360°", "s": "360 − 125 − 140 = 95 (°)", "u": "°"}, {"q": "시계가 3시일 때 두 바늘이 이루는 작은 쪽 각도는?", "a": 90, "h": "숫자 3칸 차이", "s": "3 × 30 = 90 (°)", "u": "°"}], "3": [{"q": "오각형의 다섯 각의 크기의 합은?", "a": 540, "h": "오각형을 한 꼭짓점에서 선을 그어 삼각형으로 나눠 보세요.", "s": "삼각형 3개 → 180 × 3 = 540 (°)", "u": "°"}, {"q": "사각형에서 세 각의 크기가 모두 같고 나머지 한 각이 60°예요. 같은 각 하나는?", "a": 100, "h": "360°에서 60°를 빼고 3으로 나눠요.", "s": "300 ÷ 3 = 100 (°)", "u": "°"}, {"q": "육각형의 여섯 각의 크기의 합은?", "a": 720, "h": "한 꼭짓점에서 대각선을 그으면 삼각형이 몇 개 생길까요?", "s": "삼각형 4개 → 720 (°)", "u": "°"}, {"q": "시계가 2시 30분일 때 두 바늘이 이루는 작은 쪽 각도는?", "a": 105, "h": "짧은바늘은 30분 동안 한 칸의 반(15°)을 더 가요.", "s": "짧은바늘 2.5칸(75°), 긴바늘 6칸(180°) → 180 − 75 = 105 (°)", "u": "°", "top": 1}, {"q": "시계가 8시 20분일 때 두 바늘이 이루는 작은 쪽 각도는?", "a": 130, "h": "짧은바늘은 1시간에 30°, 20분에는 10° 움직여요.", "s": "짧은바늘 240 + 10 = 250°, 긴바늘 120° → 250 − 120 = 130 (°)", "u": "°", "top": 1}]}}, "4-1-3": {"t": "곱셈과 나눗셈", "concepts": [{"t": "(세 자리 수) × (두 자리 수)", "body": "<p>두 자리 수를 <span class=\"hl\">십의 자리와 일의 자리로 나누어</span> 곱한 뒤 더해요.</p>", "eq": "128 × 23 = 128 × 20 + 128 × 3 = 2560 + 384 = 2944", "check": {"q": "300 × 40 은?", "opts": ["1200", "12000", "120000"], "a": 1}}, {"t": "(세 자리 수) ÷ (두 자리 수)", "body": "<p>나누는 수를 <span class=\"hl\">몇십으로 어림</span>하면 몫을 쉽게 찾을 수 있어요. 245 ÷ 35 → 35를 약 40으로 생각하면 몫은 6이나 7.</p>", "eq": "245 ÷ 35 = 7", "check": {"q": "360 ÷ 40 은?", "opts": ["9", "90", "8"], "a": 0}}, {"t": "나머지와 검산", "body": "<p>나머지는 항상 <span class=\"hl\">나누는 수보다 작아야</span> 해요. 검산: 나누는 수 × 몫 + 나머지 = 나누어지는 수.</p>", "eq": "197 ÷ 24 = 8 … 5 → 24 × 8 + 5 = 197", "check": {"q": "24로 나눌 때 나올 수 없는 나머지는?", "opts": ["0", "23", "24"], "a": 2}}], "P": {"1": [{"q": "300 × 40 = □", "a": 12000, "h": "3 × 4 = 12 뒤에 0이 몇 개?", "s": "12000"}, {"q": "254 × 30 = □", "a": 7620, "h": "254 × 3에 0을 붙여요.", "s": "762 → 7620"}, {"q": "128 × 23 = □", "a": 2944, "h": "128 × 20 + 128 × 3", "s": "2560 + 384 = 2944"}, {"q": "360 ÷ 40 = □", "a": 9, "h": "36 ÷ 4와 같아요.", "s": "9"}, {"q": "245 ÷ 35 = □", "a": 7, "h": "35 × 7 = ?", "s": "7"}, {"q": "197 ÷ 24 의 몫은?", "a": 8, "h": "24 × 8 = 192", "s": "197 ÷ 24 = 8 … 5"}], "2": [{"q": "625 × 48 = □", "a": 30000, "h": "625 × 8 = 5000이에요.", "s": "625 × 48 = 30000"}, {"q": "486 ÷ 27 = □", "a": 18, "h": "27 × 18 = ?", "s": "18"}, {"q": "932 ÷ 46 의 나머지는?", "a": 12, "h": "46 × 20 = 920", "s": "932 ÷ 46 = 20 … 12"}, {"q": "한 상자에 24개씩 175상자에 든 귤은 모두 몇 개일까요?", "a": 4200, "h": "175 × 24", "s": "4200 (개)", "u": "개"}, {"q": "학생 390명이 버스 한 대에 45명씩 타요. 버스는 적어도 몇 대 필요할까요?", "a": 9, "h": "390 ÷ 45 의 나머지 학생도 타야 해요.", "s": "390 ÷ 45 = 8 … 30 → 8 + 1 = 9 (대)", "u": "대"}, {"q": "어떤 수 ÷ 32 = 15 … 7 일 때 어떤 수는?", "a": 487, "h": "검산식을 써요.", "s": "32 × 15 + 7 = 487"}], "3": [{"q": "어떤 수를 36으로 나누어야 할 것을 잘못하여 63으로 나누었더니 몫이 12, 나머지가 9였어요. 바르게 계산한 몫은?", "a": 21, "h": "먼저 어떤 수를 구해요: 63 × 12 + 9", "s": "어떤 수 765, 765 ÷ 36 = 21 … 9 → 몫 21"}, {"q": "25로 나누었을 때 나머지가 7인 세 자리 수 중 가장 큰 수는?", "a": 982, "h": "25 × 39 = 975", "s": "975 + 7 = 982"}, {"q": "500원짜리 동전 128개와 100원짜리 동전 345개는 모두 얼마일까요?", "a": 98500, "h": "각각 계산해서 더해요.", "s": "64000 + 34500 = 98500 (원)", "u": "원"}, {"q": "숫자 카드 3, 5, 7, 8, 9를 한 번씩 모두 써서 (세 자리 수) × (두 자리 수)를 만들 때 가장 큰 곱은?", "a": 82935, "h": "가장 큰 두 숫자 9와 8을 두 수의 맨 앞에 하나씩 놓고, 나머지를 바꿔 가며 비교해 보세요.", "s": "953 × 87 = 82911, 853 × 97 = 82741, 873 × 95 = 82935 … 가장 큰 곱은 873 × 95 = 82935", "top": 1}, {"q": "어떤 수를 24로 나누었더니 몫이 17이고 나머지는 나올 수 있는 가장 큰 수였어요. 어떤 수는?", "a": 431, "h": "나머지는 24보다 작아야 해요. 가장 큰 나머지는?", "s": "가장 큰 나머지 23 → 24 × 17 + 23 = 431", "top": 1}]}}, "4-1-4": {"t": "삼각형", "concepts": [{"t": "변의 길이로 나누기", "body": "<p>두 변의 길이가 같으면 <span class=\"hl\">이등변삼각형</span>, 세 변의 길이가 모두 같으면 <span class=\"hl\">정삼각형</span>이에요. 정삼각형은 이등변삼각형이기도 해요.</p>", "eq": "정삼각형 한 변 8 cm → 둘레 8 × 3 = 24 cm", "check": {"q": "정삼각형 둘레가 27 cm이면 한 변은?", "opts": ["9 cm", "7 cm", "24 cm"], "a": 0}}, {"t": "이등변삼각형과 정삼각형의 각", "body": "<p>이등변삼각형은 <span class=\"hl\">길이가 같은 두 변에 붙은 두 각</span>의 크기가 같아요. 정삼각형은 세 각이 모두 <span class=\"hl\">60°</span>예요.</p>", "eq": "꼭지각 40° → 밑각 (180 − 40) ÷ 2 = 70°", "check": {"q": "이등변삼각형의 한 밑각이 50°면 꼭지각은?", "opts": ["80°", "50°", "130°"], "a": 0}}, {"t": "각의 크기로 나누기", "body": "<p>세 각이 모두 예각이면 <span class=\"hl\">예각삼각형</span>, 한 각이 직각이면 <span class=\"hl\">직각삼각형</span>, 한 각이 둔각이면 <span class=\"hl\">둔각삼각형</span>이에요.</p>", "eq": "30°, 40°, 110° → 둔각삼각형", "check": {"q": "세 각이 50°, 60°, 70°인 삼각형은?", "opts": ["예각삼각형", "직각삼각형", "둔각삼각형"], "a": 0}}], "P": {"1": [{"q": "정삼각형의 한 각은 몇 도일까요?", "a": 60, "h": "세 각이 모두 같아요.", "s": "180 ÷ 3 = 60 (°)", "u": "°"}, {"q": "같은 두 변이 7 cm, 나머지 한 변이 4 cm인 이등변삼각형의 둘레는?", "a": 18, "h": "세 변을 더해요.", "s": "7 + 7 + 4 = 18 (cm)", "u": "cm"}, {"q": "둘레가 27 cm인 정삼각형의 한 변은?", "a": 9, "h": "세 변의 길이가 같아요.", "s": "27 ÷ 3 = 9 (cm)", "u": "cm"}, {"q": "이등변삼각형의 두 밑각이 50°씩일 때 나머지 한 각은?", "a": 80, "h": "180°에서 두 밑각을 빼요.", "s": "180 − 50 − 50 = 80 (°)", "u": "°"}, {"q": "한 변이 8 cm인 정삼각형의 둘레는?", "a": 24, "h": "8 × 3", "s": "24 (cm)", "u": "cm"}, {"q": "이등변삼각형의 꼭지각이 40°일 때 한 밑각은?", "a": 70, "h": "남은 각을 둘로 나눠요.", "s": "(180 − 40) ÷ 2 = 70 (°)", "u": "°"}], "2": [{"q": "둘레가 30 cm인 이등변삼각형에서 같은 두 변이 11 cm씩이면 나머지 한 변은?", "a": 8, "h": "둘레에서 같은 두 변을 빼요.", "s": "30 − 22 = 8 (cm)", "u": "cm"}, {"q": "이등변삼각형의 한 밑각이 35°일 때 꼭지각은?", "a": 110, "h": "두 밑각은 크기가 같아요.", "s": "180 − 35 − 35 = 110 (°)", "u": "°"}, {"q": "예각삼각형의 두 각이 50°, 45°예요. 나머지 각은?", "a": 85, "h": "세 각의 합은 180°", "s": "180 − 95 = 85 (°)", "u": "°"}, {"q": "한 변이 5 cm인 정삼각형 3개를 번갈아 이어 붙여 사다리꼴을 만들었어요. 사다리꼴의 둘레는?", "a": 25, "h": "아랫변은 삼각형 2개, 윗변은 1개 길이예요.", "s": "아랫변 10 + 윗변 5 + 옆변 5 + 5 = 25 (cm)", "u": "cm"}, {"q": "철사 36 cm로 정삼각형을 만들면 한 변은?", "a": 12, "h": "36 ÷ 3", "s": "12 (cm)", "u": "cm"}, {"q": "둔각삼각형에서 가장 큰 각이 120°이고 나머지 두 각의 크기가 같아요. 한 각은?", "a": 30, "h": "남은 60°를 둘로!", "s": "(180 − 120) ÷ 2 = 30 (°)", "u": "°"}], "3": [{"q": "철사 48 cm로 같은 두 변보다 나머지 한 변이 3 cm 긴 이등변삼각형을 만들었어요. 가장 긴 변은?", "a": 18, "h": "같은 변을 □라 하면 □ + □ + (□ + 3) = 48", "s": "3 × □ = 45 → □ = 15, 가장 긴 변 18 (cm)", "u": "cm"}, {"q": "한 변이 10 cm인 정삼각형과 둘레가 같은 이등변삼각형의 밑변이 6 cm예요. 같은 두 변 중 하나는?", "a": 12, "h": "정삼각형 둘레부터 구해요.", "s": "(30 − 6) ÷ 2 = 12 (cm)", "u": "cm"}, {"q": "이등변삼각형의 한 각이 100°일 때 다른 한 각의 크기는?", "a": 40, "h": "100°인 각이 두 개일 수 있을까요?", "s": "100°는 하나뿐(꼭지각) → (180 − 100) ÷ 2 = 40 (°)", "u": "°"}, {"q": "작은 정삼각형 9개를 붙여 한 변이 작은 삼각형의 3배인 큰 정삼각형을 만들었어요. 찾을 수 있는 크고 작은 정삼각형은 모두 몇 개일까요?", "a": 13, "h": "작은 것, 작은 것 4개짜리, 가장 큰 것으로 나누어 세요.", "s": "1칸짜리 9개 + 4칸짜리 3개 + 9칸짜리 1개 = 13 (개)", "u": "개", "top": 1}, {"q": "작은 정삼각형 4개를 붙여 큰 정삼각형을 만들었더니 둘레가 36 cm였어요. 작은 정삼각형 하나의 둘레는?", "a": 18, "h": "큰 삼각형의 한 변은 작은 삼각형 두 변의 길이예요.", "s": "큰 한 변 12 cm → 작은 한 변 6 cm → 둘레 18 (cm)", "u": "cm", "top": 1}]}}, "4-1-5": {"t": "막대그래프", "concepts": [{"t": "막대그래프 읽기", "body": "<p>먼저 <span class=\"hl\">세로 눈금 한 칸</span>이 얼마인지 확인해요. 막대 칸 수 × 한 칸의 크기 = 그 항목의 양이에요.</p>", "eq": "눈금 한 칸 2명, 막대 7칸 → 14명", "check": {"q": "눈금 5칸이 10명을 나타내면 한 칸은?", "opts": ["2명", "5명", "10명"], "a": 0}}, {"t": "비교하기", "body": "<p>막대가 <span class=\"hl\">길수록 양이 많아요</span>. 두 막대의 칸 수 차이로 얼마나 더 많은지 알 수 있어요.</p>", "eq": "사과 8명, 포도 11명 → 포도가 3명 더 많음", "check": {"q": "눈금 한 칸이 2명일 때 막대가 4칸 차이 나면?", "opts": ["4명", "8명", "2명"], "a": 1}}, {"t": "막대그래프 그리기", "body": "<p>가장 큰 값이 들어가도록 <span class=\"hl\">눈금 한 칸의 크기</span>를 정하고, 조사한 수만큼 막대를 그려요.</p>", "eq": "35권을 한 칸 5권으로 → 7칸", "check": {"q": "한 칸이 10명일 때 230명은 몇 칸?", "opts": ["23칸", "230칸", "2칸"], "a": 0}}], "P": {"1": [{"q": "눈금 한 칸이 2명일 때 막대가 7칸이면 몇 명일까요?", "a": 14, "h": "2 × 7", "s": "14 (명)", "u": "명"}, {"q": "좋아하는 과일: 사과 8명, 배 5명, 포도 11명, 귤 6명. 조사한 학생은 모두 몇 명일까요?", "a": 30, "h": "모두 더해요.", "s": "30 (명)", "u": "명"}, {"q": "위 조사에서 포도는 배보다 몇 명 더 많을까요?", "a": 6, "h": "11 − 5", "s": "6 (명)", "u": "명"}, {"q": "눈금 한 칸이 5권일 때 35권은 몇 칸으로 그릴까요?", "a": 7, "h": "35 ÷ 5", "s": "7 (칸)", "u": "칸"}, {"q": "눈금 5칸이 10명을 나타낼 때 눈금 한 칸은 몇 명일까요?", "a": 2, "h": "10 ÷ 5", "s": "2 (명)", "u": "명"}, {"q": "눈금 한 칸이 10개인 그래프에서 막대가 13칸이면 몇 개일까요?", "a": 130, "h": "10 × 13", "s": "130 (개)", "u": "개"}], "2": [{"q": "눈금 한 칸이 4 kg이에요. 가 모둠 막대가 9칸, 나 모둠이 6칸이면 두 모둠의 차이는?", "a": 12, "h": "칸 수 차이부터!", "s": "3칸 × 4 = 12 (kg)", "u": "kg"}, {"q": "1반 24명, 3반 26명이고 세 반의 합이 75명이에요. 2반은 몇 명일까요?", "a": 25, "h": "전체에서 빼요.", "s": "75 − 24 − 26 = 25 (명)", "u": "명"}, {"q": "필통 판매량 월 120개, 화 90개, 수 150개를 눈금 한 칸 10개로 그리면 수요일 막대는 화요일보다 몇 칸 더 길까요?", "a": 6, "h": "60개 차이는 몇 칸?", "s": "60 ÷ 10 = 6 (칸)", "u": "칸"}, {"q": "취미 조사 30명: 운동 12명, 게임 8명, 그림 4명, 나머지는 독서예요. 독서는 몇 명일까요?", "a": 6, "h": "전체에서 나머지를 빼요.", "s": "30 − 24 = 6 (명)", "u": "명"}, {"q": "가장 긴 막대 48명, 가장 짧은 막대 12명을 눈금 한 칸 2명으로 그리면 두 막대의 칸 수 차이는?", "a": 18, "h": "36명 차이는 몇 칸?", "s": "36 ÷ 2 = 18 (칸)", "u": "칸"}, {"q": "눈금 한 칸이 3명인 그래프에서 막대가 9칸인 항목은 막대가 5칸인 항목보다 몇 명 많을까요?", "a": 12, "h": "4칸 차이", "s": "4 × 3 = 12 (명)", "u": "명"}], "3": [{"q": "A 막대는 B 막대의 3배, C 막대는 B보다 2칸 짧고, 세 막대를 합하면 28칸이에요. A는 몇 칸일까요?", "a": 18, "h": "B를 □칸이라 하면 □ × 3 + □ + (□ − 2) = 28", "s": "5 × □ − 2 = 28 → □ = 6, A = 18 (칸)", "u": "칸"}, {"q": "눈금 한 칸이 3명인 그래프에서 사과 막대가 8칸이고 바나나는 사과보다 6명 적어요. 바나나 막대는 몇 칸일까요?", "a": 6, "h": "사과는 몇 명일까요?", "s": "사과 24명, 바나나 18명 → 6 (칸)", "u": "칸"}, {"q": "축구를 좋아하는 학생은 야구의 2배, 야구는 농구보다 4명 많고, 농구는 6명이에요. 축구는 몇 명일까요?", "a": 20, "h": "농구 → 야구 → 축구 순서로!", "s": "야구 10명, 축구 20명", "u": "명"}, {"q": "눈금 한 칸이 5명인 막대그래프를 한 칸 2명으로 잘못 읽었더니 전체가 46명이었어요. 실제 전체는 몇 명일까요?", "a": 115, "h": "전체 막대는 모두 몇 칸일까요?", "s": "46 ÷ 2 = 23칸, 23 × 5 = 115 (명)", "u": "명", "top": 1}, {"q": "네 반 학생 수 그래프에서 1반은 2반보다 3칸, 3반은 2반보다 1칸 길고 4반은 1반과 같아요. 눈금 한 칸이 2명이고 전체가 102명이면 2반은 몇 명일까요?", "a": 22, "h": "2반을 □칸이라 하면 □ + (□+3) + (□+1) + (□+3) = 102 ÷ 2", "s": "4 × □ + 7 = 51 → □ = 11칸 → 22 (명)", "u": "명", "top": 1}]}}, "4-1-6": {"t": "관계와 규칙", "concepts": [{"t": "수의 배열에서 규칙", "body": "<p>수가 <span class=\"hl\">얼마씩 커지거나 작아지는지</span>, 또는 <span class=\"hl\">몇 배씩 되는지</span> 살펴봐요.</p>", "eq": "2, 5, 8, 11 → 3씩 커짐    3, 6, 12, 24 → 2배씩", "check": {"q": "1005, 1105, 1205 다음 수는?", "opts": ["1305", "1215", "2205"], "a": 0}}, {"t": "도형의 배열에서 규칙", "body": "<p>모양이 늘어날 때 <span class=\"hl\">몇 개씩 늘어나는지</span> 세어 보고, 순서와 개수의 관계를 찾아요.</p>", "eq": "바둑돌 1, 3, 5, 7 … → 2개씩 늘어남", "check": {"q": "정사각형 모양 바둑돌 1, 4, 9 다음은?", "opts": ["12", "16", "15"], "a": 1}}, {"t": "계산식의 규칙과 등호", "body": "<p>계산식이 바뀌는 규칙을 찾으면 다음 식을 계산하지 않고도 알 수 있어요. 등호(=)는 <span class=\"hl\">양쪽의 크기가 같다</span>는 뜻이에요.</p>", "eq": "12 + 5 = 10 + 7    25 × 4 = 100 × 1", "check": {"q": "45 − 18 = 50 − □ 에서 □ 는?", "opts": ["23", "27", "13"], "a": 0}}], "P": {"1": [{"q": "2, 5, 8, 11, □", "a": 14, "h": "3씩 커져요.", "s": "11 + 3 = 14"}, {"q": "3, 6, 12, 24, □", "a": 48, "h": "2배씩!", "s": "24 × 2 = 48"}, {"q": "1005, 1105, 1205, □", "a": 1305, "h": "백의 자리가 1씩 커져요.", "s": "1305"}, {"q": "12 + 5 = 10 + □", "a": 7, "h": "왼쪽은 17이에요.", "s": "17 = 10 + 7"}, {"q": "바둑돌이 1개, 3개, 5개, 7개 … 로 늘어나요. 다섯째에는 몇 개일까요?", "a": 9, "h": "2개씩 늘어나요.", "s": "9 (개)", "u": "개"}, {"q": "25 × 4 = 100 × □", "a": 1, "h": "왼쪽은 100이에요.", "s": "100 = 100 × 1"}], "2": [{"q": "1, 4, 9, 16, □", "a": 25, "h": "1 × 1, 2 × 2, 3 × 3 …", "s": "5 × 5 = 25"}, {"q": "100 + 200 = 300, 200 + 300 = 500, 300 + 400 = 700 … 다섯째 계산식의 결과는?", "a": 1100, "h": "더하는 수가 100씩 커져요.", "s": "다섯째: 500 + 600 = 1100"}, {"q": "11 × 11 = 121, 111 × 111 = 12321 이면 1111 × 1111 = □", "a": 1234321, "h": "가운데로 갈수록 1씩 커지는 수가 돼요.", "s": "1234321"}, {"q": "45 − 18 = 50 − □", "a": 23, "h": "왼쪽은 27이에요.", "s": "27 = 50 − 23"}, {"q": "정사각형 모양으로 바둑돌을 1개, 4개, 9개 … 놓아요. 여섯째에는 몇 개일까요?", "a": 36, "h": "여섯째는 한 줄에 6개씩 6줄", "s": "6 × 6 = 36 (개)", "u": "개"}, {"q": "64, 32, 16, 8, □", "a": 4, "h": "반씩 줄어요.", "s": "8 ÷ 2 = 4"}], "3": [{"q": "1, 1, 2, 3, 5, 8, □", "a": 13, "h": "앞의 두 수를 더해 보세요.", "s": "5 + 8 = 13"}, {"q": "2, 6, 18, 54 … 여섯째 수는?", "a": 486, "h": "3배씩 커져요.", "s": "54 × 3 = 162, 162 × 3 = 486"}, {"q": "9 × 9 = 81, 99 × 99 = 9801, 999 × 999 = 998001 일 때 9999 × 9999 = □", "a": 99980001, "h": "9와 0의 개수가 어떻게 늘어나나요?", "s": "99980001"}, {"q": "성냥개비로 정사각형을 옆으로 이어 붙여요. 1개는 4개비, 2개는 7개비, 3개는 10개비예요. 성냥개비 61개로는 정사각형 몇 개를 만들까요?", "a": 20, "h": "정사각형이 하나 늘 때마다 성냥개비가 몇 개 늘어날까요?", "s": "개비 수 = 정사각형 수 × 3 + 1 → (61 − 1) ÷ 3 = 20 (개)", "u": "개", "top": 1}, {"q": "1 + 3 = 4, 1 + 3 + 5 = 9, 1 + 3 + 5 + 7 = 16 … 1부터 39까지 홀수를 모두 더하면?", "a": 400, "h": "홀수가 몇 개인지 세어 보세요. 결과는 (개수) × (개수)예요.", "s": "1부터 39까지 홀수는 20개 → 20 × 20 = 400", "top": 1}]}}, "4-2-1": {"t": "분수의 덧셈과 뺄셈", "concepts": [{"t": "진분수의 덧셈과 뺄셈", "body": "<p>분모가 같으면 <span class=\"hl\">분모는 그대로, 분자끼리</span> 더하거나 빼요. 결과가 가분수면 대분수로 바꿔도 돼요.</p>", "eq": "2/7 + 3/7 = 5/7    4/9 + 7/9 = 11/9 = 1 2/9", "check": {"q": "8/11 − 3/11 은?", "opts": ["5/11", "5/0", "11/11"], "a": 0}}, {"t": "대분수의 덧셈", "body": "<p><span class=\"hl\">자연수끼리, 분수끼리</span> 더해요. 분수끼리 더해서 1이 넘으면 자연수로 올려요.</p>", "eq": "2 5/8 + 1 6/8 = 3 11/8 = 4 3/8", "check": {"q": "1 2/5 + 2 1/5 은?", "opts": ["3 3/5", "3 3/10", "1 1/5"], "a": 0}}, {"t": "받아내림이 있는 뺄셈", "body": "<p>빼는 분수가 더 크면 자연수 1을 <span class=\"hl\">분모와 분자가 같은 분수</span>로 바꿔 내려요. 1 = 7/7.</p>", "eq": "5 2/9 − 2 7/9 = 4 11/9 − 2 7/9 = 2 4/9", "check": {"q": "1 − 3/8 은?", "opts": ["5/8", "3/8", "2/8"], "a": 0}}], "P": {"1": [{"q": "2/7 + 3/7 = □", "a": "5/7", "h": "분자끼리 더해요.", "s": "5/7", "f": 1}, {"q": "4/9 + 7/9 = □", "a": "11/9", "h": "분자의 합이 분모보다 커요.", "s": "11/9 = 1 2/9", "f": 1}, {"q": "8/11 − 3/11 = □", "a": "5/11", "h": "분자끼리 빼요.", "s": "5/11", "f": 1}, {"q": "1 2/5 + 2 1/5 = □", "a": "18/5", "h": "자연수끼리, 분수끼리!", "s": "3 3/5", "f": 1}, {"q": "3 4/7 − 1 2/7 = □", "a": "16/7", "h": "자연수끼리, 분수끼리!", "s": "2 2/7", "f": 1}, {"q": "1 − 3/8 = □", "a": "5/8", "h": "1 = 8/8", "s": "8/8 − 3/8 = 5/8", "f": 1}], "2": [{"q": "2 5/8 + 1 6/8 = □", "a": "35/8", "h": "분수끼리 더하면 11/8이에요.", "s": "3 11/8 = 4 3/8", "f": 1}, {"q": "4 − 1 3/5 = □", "a": "12/5", "h": "4 = 3 5/5", "s": "3 5/5 − 1 3/5 = 2 2/5", "f": 1}, {"q": "5 2/9 − 2 7/9 = □", "a": "22/9", "h": "5 2/9 = 4 11/9", "s": "4 11/9 − 2 7/9 = 2 4/9", "f": 1}, {"q": "리본 3 2/5 m 중 1 4/5 m를 썼어요. 남은 리본은?", "a": "8/5", "h": "3 2/5 = 2 7/5", "s": "2 7/5 − 1 4/5 = 1 3/5 (m)", "u": "m", "f": 1}, {"q": "주스 1 3/7 L와 2 5/7 L를 합하면?", "a": "29/7", "h": "분수끼리 더하면 8/7", "s": "3 8/7 = 4 1/7 (L)", "u": "L", "f": 1}, {"q": "□ − 2 3/11 = 1 9/11", "a": "45/11", "h": "□ = 1 9/11 + 2 3/11", "s": "3 12/11 = 4 1/11", "f": 1}], "3": [{"q": "어떤 수에 2 5/9를 더해야 할 것을 잘못하여 뺐더니 1 7/9이 되었어요. 바르게 계산한 값은?", "a": "62/9", "h": "어떤 수 = 1 7/9 + 2 5/9", "s": "어떤 수 4 3/9, 4 3/9 + 2 5/9 = 6 8/9", "f": 1}, {"q": "분모가 7인 진분수 두 개의 합이 1 2/7이고 차가 1/7이에요. 큰 분수는?", "a": "5/7", "h": "합은 9/7이에요. 분자 두 개의 합이 9, 차가 1", "s": "분자 5와 4 → 큰 분수 5/7", "f": 1}, {"q": "길이가 2 3/8 m인 끈 3개를 3/8 m씩 겹쳐서 이었어요. 전체 길이는?", "a": "51/8", "h": "겹친 곳은 몇 군데일까요?", "s": "2 3/8 × 3 = 57/8, 겹친 곳 2군데 6/8 → 51/8 = 6 3/8 (m)", "u": "m", "f": 1}, {"q": "□/9 + 5/9 < 1 4/9 에서 □ 안에 들어갈 수 있는 자연수는 모두 몇 개일까요?", "a": 7, "h": "1 4/9 = 13/9", "s": "□ + 5 < 13 → □ = 1 ~ 7 → 7개", "u": "개", "top": 1}, {"q": "1/13 + 2/13 + 3/13 + … + 12/13 의 값은?", "a": 6, "h": "앞과 뒤를 짝지어 보세요: 1/13 + 12/13 = 1", "s": "짝이 6쌍, 각각 1 → 6", "top": 1}]}}, "4-2-2": {"t": "사각형", "concepts": [{"t": "수직과 평행", "body": "<p>두 직선이 만나서 <span class=\"hl\">직각</span>을 이루면 서로 수직이에요. 한 직선에 수직인 두 직선은 서로 만나지 않는데, 이것을 <span class=\"hl\">평행</span>이라고 해요.</p>", "eq": "평행선 사이의 수직인 선분의 길이 = 평행선 사이의 거리", "check": {"q": "두 직선이 수직이면 만나서 이루는 각은?", "opts": ["90°", "180°", "45°"], "a": 0}}, {"t": "사다리꼴과 평행사변형", "body": "<p><span class=\"hl\">평행한 변이 한 쌍이라도</span> 있으면 사다리꼴, <span class=\"hl\">마주 보는 두 쌍이 평행</span>하면 평행사변형이에요. 평행사변형은 마주 보는 변과 각이 같고, 이웃한 두 각의 합이 180°예요.</p>", "eq": "한 각 70° → 이웃한 각 110°, 마주 보는 각 70°", "check": {"q": "평행사변형 한 각이 65°이면 마주 보는 각은?", "opts": ["65°", "115°", "25°"], "a": 0}}, {"t": "마름모와 직사각형, 정사각형", "body": "<p><span class=\"hl\">네 변의 길이가 모두 같은</span> 사각형이 마름모예요. 직사각형은 네 각이 직각, 정사각형은 네 변과 네 각이 모두 같아요.</p>", "eq": "마름모 한 변 6 cm → 둘레 24 cm", "check": {"q": "마름모 둘레가 36 cm면 한 변은?", "opts": ["9 cm", "6 cm", "12 cm"], "a": 0}}], "P": {"1": [{"q": "평행사변형에서 한 각이 70°일 때 이웃한 각은?", "a": 110, "h": "이웃한 두 각의 합은 180°", "s": "110 (°)", "u": "°"}, {"q": "한 변이 6 cm인 마름모의 둘레는?", "a": 24, "h": "네 변이 같아요.", "s": "6 × 4 = 24 (cm)", "u": "cm"}, {"q": "이웃한 두 변이 5 cm, 8 cm인 평행사변형의 둘레는?", "a": 26, "h": "마주 보는 변의 길이가 같아요.", "s": "(5 + 8) × 2 = 26 (cm)", "u": "cm"}, {"q": "평행사변형에서 한 각이 65°일 때 마주 보는 각은?", "a": 65, "h": "마주 보는 각은 크기가 같아요.", "s": "65 (°)", "u": "°"}, {"q": "둘레가 36 cm인 마름모의 한 변은?", "a": 9, "h": "36 ÷ 4", "s": "9 (cm)", "u": "cm"}, {"q": "둘레가 28 cm인 정사각형의 한 변은?", "a": 7, "h": "28 ÷ 4", "s": "7 (cm)", "u": "cm"}], "2": [{"q": "직선 가, 나, 다가 차례로 평행해요. 가와 나 사이는 4 cm, 나와 다 사이는 7 cm일 때 가와 다 사이의 거리는?", "a": 11, "h": "두 거리를 더해요.", "s": "4 + 7 = 11 (cm)", "u": "cm"}, {"q": "둘레가 40 cm이고 한 변이 12 cm인 평행사변형의 이웃한 변은?", "a": 8, "h": "이웃한 두 변의 합은 둘레의 반", "s": "20 − 12 = 8 (cm)", "u": "cm"}, {"q": "마름모의 한 각이 50°일 때 이웃한 각은?", "a": 130, "h": "마름모도 평행사변형이에요.", "s": "180 − 50 = 130 (°)", "u": "°"}, {"q": "사다리꼴의 세 각이 60°, 120°, 100°일 때 나머지 각은?", "a": 80, "h": "사각형 네 각의 합은 360°", "s": "360 − 280 = 80 (°)", "u": "°"}, {"q": "가로 10 cm, 세로는 가로보다 3 cm 짧은 직사각형의 둘레는?", "a": 34, "h": "세로부터 구해요.", "s": "(10 + 7) × 2 = 34 (cm)", "u": "cm"}, {"q": "한 변이 9 cm인 정사각형과 둘레가 같은 마름모의 한 변은?", "a": 9, "h": "둘레가 같고 둘 다 네 변이 같아요.", "s": "9 (cm)", "u": "cm"}], "3": [{"q": "평행사변형에서 한 각이 이웃한 각보다 40° 커요. 큰 각은?", "a": 110, "h": "두 각의 합은 180°, 차는 40°", "s": "(180 + 40) ÷ 2 = 110 (°)", "u": "°"}, {"q": "크기가 같은 마름모 3개를 변끼리 맞붙여 한 줄로 이었더니 둘레가 48 cm였어요. 마름모 한 변은?", "a": 6, "h": "겉에 드러난 변이 몇 개인지 세어 보세요.", "s": "12개 중 맞붙은 4개를 빼면 8개 → 48 ÷ 8 = 6 (cm)", "u": "cm"}, {"q": "가로가 세로의 2배인 직사각형의 둘레가 36 cm예요. 가로는?", "a": 12, "h": "세로를 □라 하면 □ + 2□ + □ + 2□ = 36", "s": "6 × □ = 36 → 세로 6, 가로 12 (cm)", "u": "cm"}, {"q": "둘레가 50 cm인 평행사변형에서 긴 변이 짧은 변보다 5 cm 길어요. 긴 변은?", "a": 15, "h": "이웃한 두 변의 합은 25 cm", "s": "(25 + 5) ÷ 2 = 15 (cm)", "u": "cm", "top": 1}, {"q": "크기가 같은 정사각형 6개를 2줄 3칸으로 붙였어요. 찾을 수 있는 크고 작은 직사각형(정사각형 포함)은 모두 몇 개일까요?", "a": 18, "h": "가로선 3개 중 2개, 세로선 4개 중 2개를 고르는 방법을 생각해요.", "s": "가로선 고르기 3가지 × 세로선 고르기 6가지 = 18 (개)", "u": "개", "top": 1}]}}, "4-2-3": {"t": "소수의 덧셈과 뺄셈", "concepts": [{"t": "소수 두 자리, 세 자리", "body": "<p>1을 100으로 나눈 하나는 <span class=\"hl\">0.01</span>, 1000으로 나눈 하나는 <span class=\"hl\">0.001</span>이에요. 2.456에서 6은 소수 셋째 자리 숫자로 0.006을 나타내요.</p>", "eq": "0.01이 37개 → 0.37    0.001이 2056개 → 2.056", "check": {"q": "0.01이 45개인 수는?", "opts": ["0.45", "4.5", "0.045"], "a": 0}}, {"t": "소수의 덧셈", "body": "<p><span class=\"hl\">소수점의 자리를 맞추어</span> 세로로 쓰고, 자연수처럼 더한 뒤 소수점을 그대로 내려 찍어요.</p>", "eq": "2.45 + 1.32 = 3.77    0.5 + 0.8 = 1.3", "check": {"q": "1.25 + 0.75 는?", "opts": ["2", "1.9", "2.1"], "a": 0}}, {"t": "소수의 뺄셈", "body": "<p>자리가 모자라면 <span class=\"hl\">끝에 0이 있다고 생각</span>하고 계산해요. 5 = 5.00.</p>", "eq": "5 − 2.36 = 5.00 − 2.36 = 2.64", "check": {"q": "3.06 − 1.4 는?", "opts": ["1.66", "2.66", "1.02"], "a": 0}}], "P": {"1": [{"q": "0.5 + 0.8 = □", "a": 1.3, "h": "0.1이 5개 + 8개", "s": "1.3"}, {"q": "2.45 + 1.32 = □", "a": 3.77, "h": "소수점을 맞추어요.", "s": "3.77"}, {"q": "4.7 − 2.5 = □", "a": 2.2, "h": "자연수처럼 빼요.", "s": "2.2"}, {"q": "3.06 − 1.4 = □", "a": 1.66, "h": "1.4 = 1.40", "s": "3.06 − 1.40 = 1.66"}, {"q": "0.01이 37개인 수는?", "a": 0.37, "h": "0.01 × 37", "s": "0.37"}, {"q": "1.25 + 0.75 = □", "a": 2, "h": "소수점 아래끼리 더하면 1이 돼요.", "s": "2"}], "2": [{"q": "5 − 2.36 = □", "a": 2.64, "h": "5 = 5.00", "s": "2.64"}, {"q": "7.08 + 2.9 = □", "a": 9.98, "h": "2.9 = 2.90", "s": "9.98"}, {"q": "245 cm는 몇 m일까요?", "a": 2.45, "h": "1 m = 100 cm", "s": "2.45 (m)", "u": "m"}, {"q": "물 2.4 L에 1.75 L를 더 부으면 모두 몇 L일까요?", "a": 4.15, "h": "2.40 + 1.75", "s": "4.15 (L)", "u": "L"}, {"q": "0.001이 2056개인 수는?", "a": 2.056, "h": "1000개가 1이에요.", "s": "2.056"}, {"q": "리본 3.2 m 중 1.85 m를 썼어요. 남은 길이는?", "a": 1.35, "h": "3.20 − 1.85", "s": "1.35 (m)", "u": "m"}], "3": [{"q": "어떤 수에 1.38을 더해야 할 것을 잘못하여 뺐더니 2.5가 되었어요. 바르게 계산한 값은?", "a": 5.26, "h": "어떤 수 = 2.5 + 1.38", "s": "어떤 수 3.88, 3.88 + 1.38 = 5.26"}, {"q": "숫자 카드 3, 5, 7, 9를 한 번씩 써서 만든 소수 두 자리 수 중 가장 큰 수와 가장 작은 수의 합은?", "a": 133.32, "h": "가장 큰 수 □□.□□ 은 큰 숫자부터!", "s": "97.53 + 35.79 = 133.32"}, {"q": "빈 가방은 2.35 kg이고 책을 넣었더니 5.1 kg이 되었어요. 책의 무게는?", "a": 2.75, "h": "5.10 − 2.35", "s": "2.75 (kg)", "u": "kg"}, {"q": "0.1이 23개, 0.01이 45개, 0.001이 8개인 수보다 1.7 큰 수는?", "a": 4.458, "h": "먼저 수를 만들어요: 2.3 + 0.45 + 0.008", "s": "2.758 + 1.7 = 4.458", "top": 1}, {"q": "길이가 1.25 m인 색 테이프 4장을 0.15 m씩 겹쳐서 이었어요. 전체 길이는?", "a": 4.55, "h": "4장을 이으면 겹친 곳은 몇 군데?", "s": "5 − 0.15 × 3 = 5 − 0.45 = 4.55 (m)", "u": "m", "top": 1}]}}, "4-2-4": {"t": "다각형", "concepts": [{"t": "다각형", "body": "<p><span class=\"hl\">선분으로만 둘러싸인</span> 도형이 다각형이에요. 변이 5개면 오각형, 6개면 육각형이에요.</p>", "eq": "변의 수 = 꼭짓점의 수 = 각의 수", "check": {"q": "육각형의 꼭짓점은 몇 개?", "opts": ["5개", "6개", "8개"], "a": 1}}, {"t": "정다각형", "body": "<p><span class=\"hl\">변의 길이와 각의 크기가 모두 같은</span> 다각형이 정다각형이에요. 둘레 = 한 변 × 변의 수.</p>", "eq": "정오각형 한 변 7 cm → 둘레 35 cm", "check": {"q": "정팔각형 둘레가 64 cm면 한 변은?", "opts": ["8 cm", "16 cm", "4 cm"], "a": 0}}, {"t": "대각선", "body": "<p><span class=\"hl\">서로 이웃하지 않는 두 꼭짓점</span>을 이은 선분이 대각선이에요. 한 꼭짓점에서 그을 수 있는 대각선은 (꼭짓점 수 − 3)개예요.</p>", "eq": "오각형: 5 × 2 ÷ 2 = 5개    육각형: 6 × 3 ÷ 2 = 9개", "check": {"q": "사각형의 대각선은 몇 개?", "opts": ["2개", "4개", "1개"], "a": 0}}], "P": {"1": [{"q": "한 변이 7 cm인 정오각형의 둘레는?", "a": 35, "h": "7 × 5", "s": "35 (cm)", "u": "cm"}, {"q": "육각형의 꼭짓점은 몇 개일까요?", "a": 6, "h": "변의 수와 같아요.", "s": "6 (개)", "u": "개"}, {"q": "사각형의 대각선은 몇 개일까요?", "a": 2, "h": "이웃하지 않는 꼭짓점끼리 이어요.", "s": "2 (개)", "u": "개"}, {"q": "오각형의 대각선은 몇 개일까요?", "a": 5, "h": "한 꼭짓점에서 2개씩", "s": "5 × 2 ÷ 2 = 5 (개)", "u": "개"}, {"q": "둘레가 64 cm인 정팔각형의 한 변은?", "a": 8, "h": "64 ÷ 8", "s": "8 (cm)", "u": "cm"}, {"q": "칠각형의 변은 몇 개일까요?", "a": 7, "h": "이름에 답이 있어요.", "s": "7 (개)", "u": "개"}], "2": [{"q": "육각형의 대각선은 몇 개일까요?", "a": 9, "h": "한 꼭짓점에서 3개씩", "s": "6 × 3 ÷ 2 = 9 (개)", "u": "개"}, {"q": "정육각형의 한 각은 몇 도일까요?", "a": 120, "h": "육각형 여섯 각의 합은 720°", "s": "720 ÷ 6 = 120 (°)", "u": "°"}, {"q": "정오각형의 한 각은 몇 도일까요?", "a": 108, "h": "오각형 다섯 각의 합은 540°", "s": "540 ÷ 5 = 108 (°)", "u": "°"}, {"q": "철사 54 cm로 정육각형을 만들면 한 변은?", "a": 9, "h": "54 ÷ 6", "s": "9 (cm)", "u": "cm"}, {"q": "정사각형의 두 대각선이 만나서 이루는 각은?", "a": 90, "h": "정사각형의 대각선은 서로 수직이에요.", "s": "90 (°)", "u": "°"}, {"q": "변이 10개인 정다각형의 둘레가 50 cm예요. 한 변은?", "a": 5, "h": "50 ÷ 10", "s": "5 (cm)", "u": "cm"}], "3": [{"q": "대각선이 14개인 다각형은 몇 각형일까요? (숫자로)", "a": 7, "h": "꼭짓점 수 × (꼭짓점 수 − 3) ÷ 2 = 14", "s": "7 × 4 ÷ 2 = 14 → 칠각형", "u": "각형"}, {"q": "정팔각형의 한 각은 몇 도일까요?", "a": 135, "h": "팔각형은 삼각형 몇 개로 나눌 수 있을까요?", "s": "삼각형 6개 → 1080° ÷ 8 = 135 (°)", "u": "°"}, {"q": "한 변이 6 cm인 정삼각형과 둘레가 같은 정육각형의 한 변은?", "a": 3, "h": "정삼각형의 둘레부터!", "s": "18 ÷ 6 = 3 (cm)", "u": "cm"}, {"q": "십각형의 대각선은 몇 개일까요?", "a": 35, "h": "한 꼭짓점에서 10 − 3 = 7개", "s": "10 × 7 ÷ 2 = 35 (개)", "u": "개", "top": 1}, {"q": "모든 각의 크기의 합이 1440°인 정다각형의 한 각은 몇 도일까요?", "a": 144, "h": "삼각형 몇 개로 나뉠까요? 삼각형 수 = 변의 수 − 2", "s": "1440 ÷ 180 = 8 → 십각형 → 1440 ÷ 10 = 144 (°)", "u": "°", "top": 1}]}}, "4-2-5": {"t": "꺾은선그래프", "concepts": [{"t": "꺾은선그래프 읽기", "body": "<p>점과 점을 선분으로 이은 그래프예요. <span class=\"hl\">시간에 따라 변하는 모양</span>을 한눈에 알 수 있어요.</p>", "eq": "9시 10.5°C → 10시 12°C : 1.5°C 오름", "check": {"q": "선이 오른쪽 위로 올라가면?", "opts": ["늘어남", "줄어듦", "변화 없음"], "a": 0}}, {"t": "물결선", "body": "<p>필요 없는 아래 부분을 <span class=\"hl\">물결선으로 줄여</span> 그리면 작은 변화도 잘 보여요. 눈금 한 칸의 크기를 먼저 확인해요.</p>", "eq": "물결선 위 30 kg부터, 한 칸 0.1 kg", "check": {"q": "세로 눈금 5칸이 1을 나타내면 한 칸은?", "opts": ["0.2", "0.5", "5"], "a": 0}}, {"t": "변화 알아보기", "body": "<p><span class=\"hl\">선이 가장 많이 기울어진 곳</span>이 변화가 가장 큰 때예요. 두 점 사이의 중간값으로 그 사이 시각의 값을 어림할 수 있어요.</p>", "eq": "10시 11°C, 11시 15°C → 10시 30분 약 13°C", "check": {"q": "3시 15°C, 4시 13°C 이면?", "opts": ["2°C 내려감", "2°C 오름", "28°C"], "a": 0}}], "P": {"1": [{"q": "9시 기온 10.5°C, 10시 기온 12°C예요. 몇 도 올랐을까요?", "a": 1.5, "h": "12 − 10.5", "s": "1.5 (°C)", "u": "°C"}, {"q": "키: 1월 120 cm, 2월 122 cm, 3월 125 cm. 2월에서 3월 사이에 자란 키는?", "a": 3, "h": "125 − 122", "s": "3 (cm)", "u": "cm"}, {"q": "눈금 한 칸이 2 cm일 때 5칸은 몇 cm일까요?", "a": 10, "h": "2 × 5", "s": "10 (cm)", "u": "cm"}, {"q": "3시 기온 15°C, 4시 기온 13°C예요. 몇 도 내려갔을까요?", "a": 2, "h": "15 − 13", "s": "2 (°C)", "u": "°C"}, {"q": "세로 눈금 5칸이 1을 나타낼 때 눈금 한 칸은?", "a": 0.2, "h": "1 ÷ 5", "s": "0.2"}, {"q": "몸무게가 30.2 kg에서 30.8 kg이 되었어요. 몇 kg 늘었을까요?", "a": 0.6, "h": "30.8 − 30.2", "s": "0.6 (kg)", "u": "kg"}], "2": [{"q": "기온 9시 8°C, 10시 11°C, 11시 15°C, 12시 16°C. 변화가 가장 큰 때 오른 기온은?", "a": 4, "h": "한 시간마다 오른 기온을 각각 구해 보세요.", "s": "3, 4, 1°C → 10시~11시 4°C", "u": "°C"}, {"q": "위 기록에서 10시 30분의 기온을 어림하면 몇 °C일까요?", "a": 13, "h": "10시와 11시의 가운데 값", "s": "(11 + 15) ÷ 2 = 13 (°C)", "u": "°C"}, {"q": "식물 키: 1일 3 cm, 3일 7 cm, 5일 11 cm. 같은 빠르기로 자라면 7일에는 몇 cm일까요?", "a": 15, "h": "2일마다 4 cm씩", "s": "11 + 4 = 15 (cm)", "u": "cm"}, {"q": "물결선 위 30 kg부터 눈금 한 칸이 0.1 kg이에요. 점이 6칸 위에 있으면 몇 kg일까요?", "a": 30.6, "h": "0.1 × 6 = 0.6", "s": "30.6 (kg)", "u": "kg"}, {"q": "판매량 월 120개, 화 150개, 수 135개. 화요일에서 수요일 사이 변화량은?", "a": 15, "h": "150 − 135", "s": "15 (개) 줄어듦", "u": "개"}, {"q": "하루 최고 기온 18.5°C, 최저 기온 9.7°C의 차이는?", "a": 8.8, "h": "18.5 − 9.7", "s": "8.8 (°C)", "u": "°C"}], "3": [{"q": "물의 온도가 1분마다 1.5°C씩 올라요. 처음 22°C였다면 6분 뒤는?", "a": 31, "h": "1.5 × 6", "s": "22 + 9 = 31 (°C)", "u": "°C"}, {"q": "3시간 동안 일정하게 6 cm 자란 식물은 1시간 30분 동안 몇 cm 자랐을까요?", "a": 3, "h": "1시간에 2 cm씩", "s": "2 × 1.5 = 3 (cm)", "u": "cm"}, {"q": "키가 매년 같게 늘어 2023년 135 cm, 2025년 141 cm였어요. 2024년 키는?", "a": 138, "h": "두 해의 가운데", "s": "138 (cm)", "u": "cm"}, {"q": "마을 인구가 2020년 2400명, 2022년 2700명이에요. 매년 같은 수만큼 늘었다면 2026년에는?", "a": 3300, "h": "1년에 몇 명씩 늘었을까요?", "s": "1년에 150명 → 2700 + 600 = 3300 (명)", "u": "명", "top": 1}, {"q": "오전 6시 4°C부터 1시간마다 2.5°C씩 오르다가 오후 2시부터 1시간마다 1.5°C씩 내려요. 오후 5시 기온은?", "a": 19.5, "h": "오전 6시부터 오후 2시까지는 8시간이에요.", "s": "오후 2시 4 + 20 = 24°C, 오후 5시 24 − 4.5 = 19.5 (°C)", "u": "°C", "top": 1}]}}, "4-2-6": {"t": "평면도형의 이동", "concepts": [{"t": "밀기", "body": "<p>도형을 어느 방향으로 밀어도 <span class=\"hl\">모양과 크기는 그대로</span>, 위치만 바뀌어요.</p>", "eq": "오른쪽으로 5 cm, 왼쪽으로 2 cm → 처음보다 오른쪽 3 cm", "check": {"q": "도형을 밀면 바뀌는 것은?", "opts": ["모양", "크기", "위치"], "a": 2}}, {"t": "뒤집기", "body": "<p>오른쪽(왼쪽)으로 뒤집으면 <span class=\"hl\">왼쪽과 오른쪽</span>이, 위쪽(아래쪽)으로 뒤집으면 <span class=\"hl\">위쪽과 아래쪽</span>이 바뀌어요. 같은 방향으로 두 번 뒤집으면 처음 모양이에요.</p>", "eq": "왼쪽으로 3번 뒤집기 = 왼쪽으로 1번 뒤집기", "check": {"q": "같은 방향으로 4번 뒤집으면?", "opts": ["처음 모양", "한 번 뒤집은 모양", "알 수 없음"], "a": 0}}, {"t": "돌리기", "body": "<p>시계 방향 90°씩 4번 돌리면 360°라서 <span class=\"hl\">처음 모양</span>이 돼요. 시계 방향 270°는 시계 반대 방향 90°와 같아요.</p>", "eq": "시계 방향 180° = 시계 반대 방향 180°", "check": {"q": "시계 방향 270°와 같은 것은?", "opts": ["시계 반대 방향 90°", "시계 방향 90°", "시계 반대 방향 270°"], "a": 0}}], "P": {"1": [{"q": "시계 방향으로 90°씩 몇 번 돌리면 처음 모양이 될까요?", "a": 4, "h": "한 바퀴는 360°", "s": "360 ÷ 90 = 4 (번)", "u": "번"}, {"q": "시계 방향으로 270° 돌린 것은 시계 반대 방향으로 몇 도 돌린 것과 같을까요?", "a": 90, "h": "360°에서 빼 보세요.", "s": "360 − 270 = 90 (°)", "u": "°"}, {"q": "점을 오른쪽으로 5 cm, 다시 왼쪽으로 2 cm 밀었어요. 처음보다 오른쪽으로 몇 cm 갔을까요?", "a": 3, "h": "5 − 2", "s": "3 (cm)", "u": "cm"}, {"q": "모눈 한 칸이 1 cm일 때 도형을 위쪽으로 4칸 밀면 몇 cm 움직일까요?", "a": 4, "h": "1 × 4", "s": "4 (cm)", "u": "cm"}, {"q": "시계 방향으로 90°씩 3번 돌린 것은 시계 반대 방향으로 몇 도 한 번 돌린 것과 같을까요?", "a": 90, "h": "90° × 3 = 270°", "s": "90 (°)", "u": "°"}, {"q": "왼쪽으로 3번 뒤집은 모양은 왼쪽으로 가장 적게 몇 번 뒤집은 모양과 같을까요?", "a": 1, "h": "2번 뒤집으면 처음 모양", "s": "3 = 2 + 1 → 1 (번)", "u": "번"}], "2": [{"q": "시계 방향으로 90°를 7번 돌린 것은 시계 방향으로 몇 도 돌린 것과 같을까요? (360°보다 작게)", "a": 270, "h": "90 × 7 = 630", "s": "630 − 360 = 270 (°)", "u": "°"}, {"q": "디지털 숫자 18이 적힌 카드를 시계 방향으로 180° 돌리면 어떤 수가 될까요?", "a": 81, "h": "180° 돌리면 순서도 뒤바뀌어요.", "s": "1 → 1, 8 → 8, 순서가 바뀌어 81"}, {"q": "디지털 숫자 69가 적힌 카드를 180° 돌리면 어떤 수가 될까요?", "a": 69, "h": "6을 180° 돌리면 9가 돼요.", "s": "9 → 6, 6 → 9 이고 순서가 바뀌어 69"}, {"q": "가로 3 cm인 직사각형을 오른쪽으로 밀어 4개를 이어 붙였어요. 전체 가로는?", "a": 12, "h": "3 × 4", "s": "12 (cm)", "u": "cm"}, {"q": "시계 반대 방향으로 450° 돌린 것은 시계 방향으로 몇 도 돌린 것과 같을까요? (360°보다 작게)", "a": 270, "h": "450° = 360° + 90°", "s": "시계 반대 방향 90° = 시계 방향 270°", "u": "°"}, {"q": "도형을 오른쪽으로 5번, 위쪽으로 4번 뒤집었어요. 같은 모양을 가장 적게 몇 번 뒤집어 만들 수 있을까요?", "a": 1, "h": "같은 방향으로 2번 뒤집으면 처음으로 돌아와요.", "s": "오른쪽 5번 → 1번, 위쪽 4번 → 0번 → 1 (번)", "u": "번"}], "3": [{"q": "도형을 시계 방향으로 90° 돌린 뒤 시계 반대 방향으로 270° 돌렸어요. 처음에서 시계 방향으로 몇 도 돌린 것과 같을까요? (360°보다 작게)", "a": 180, "h": "시계 반대 방향 270° = 시계 방향 90°", "s": "90 + 90 = 180 (°)", "u": "°"}, {"q": "점이 오른쪽으로 7칸, 왼쪽으로 3칸, 위쪽으로 2칸, 아래쪽으로 5칸 움직였어요. 처음보다 아래쪽으로 몇 칸 갔을까요?", "a": 3, "h": "위아래만 따로 계산해요.", "s": "5 − 2 = 3 (칸)", "u": "칸"}, {"q": "한 변 2 cm인 정사각형을 오른쪽으로 계속 밀어 붙여 둘레가 28 cm인 직사각형을 만들었어요. 정사각형은 몇 개일까요?", "a": 6, "h": "정사각형 □개를 이으면 둘레는 (2 × □ + 2) × 2", "s": "(2 × □ + 2) × 2 = 28 → □ = 6 (개)", "u": "개"}, {"q": "시계 방향으로 90° 돌리기를 2026번 하면 처음에서 시계 방향으로 몇 도 돌린 것과 같을까요? (360°보다 작게)", "a": 180, "h": "4번 돌리면 처음 모양! 2026을 4로 나눈 나머지는?", "s": "2026 ÷ 4 = 506 … 2 → 90 × 2 = 180 (°)", "u": "°", "top": 1}, {"q": "디지털 숫자 카드(0, 1, 6, 8, 9만 사용)로 만든 두 자리 수를 180° 돌렸더니 처음 수보다 63 큰 수가 되었어요. 처음 수는?", "a": 18, "h": "돌리면 순서가 바뀌고 6과 9는 서로 바뀌어요. 십의 자리가 작은 수부터 따져 보세요.", "s": "18을 돌리면 81 → 81 − 18 = 63", "top": 1}]}}, "5-1-1": {"t": "자연수의 혼합 계산", "concepts": [{"t": "덧셈과 뺄셈, 곱셈과 나눗셈", "body": "<p>덧셈과 뺄셈만 있거나, 곱셈과 나눗셈만 있으면 <span class=\"hl\">앞에서부터 차례로</span> 계산해요.</p>", "eq": "36 − 12 + 8 = 32    7 × 8 ÷ 4 = 14", "check": {"q": "7 × 8 ÷ 4 는?", "opts": ["14", "2", "56"], "a": 0}}, {"t": "곱셈·나눗셈 먼저", "body": "<p>덧셈, 뺄셈, 곱셈, 나눗셈이 섞여 있으면 <span class=\"hl\">곱셈과 나눗셈을 먼저</span> 계산해요.</p>", "eq": "25 + 5 × 6 = 25 + 30 = 55", "check": {"q": "60 − 36 ÷ 4 는?", "opts": ["6", "51", "96"], "a": 1}}, {"t": "괄호 먼저", "body": "<p>( )가 있으면 <span class=\"hl\">괄호 안을 가장 먼저</span> 계산해요.</p>", "eq": "(25 + 5) × 6 = 30 × 6 = 180", "check": {"q": "48 ÷ (4 + 2) 는?", "opts": ["14", "8", "6"], "a": 1}}], "P": {"1": [{"q": "36 − 12 + 8 = □", "a": 32, "h": "앞에서부터!", "s": "24 + 8 = 32"}, {"q": "7 × 8 ÷ 4 = □", "a": 14, "h": "앞에서부터!", "s": "56 ÷ 4 = 14"}, {"q": "25 + 5 × 6 = □", "a": 55, "h": "곱셈 먼저!", "s": "25 + 30 = 55"}, {"q": "(25 + 5) × 6 = □", "a": 180, "h": "괄호 먼저!", "s": "30 × 6 = 180"}, {"q": "48 ÷ (4 + 2) = □", "a": 8, "h": "괄호 먼저!", "s": "48 ÷ 6 = 8"}, {"q": "60 − 36 ÷ 4 = □", "a": 51, "h": "나눗셈 먼저!", "s": "60 − 9 = 51"}], "2": [{"q": "4 × (15 − 7) + 3 = □", "a": 35, "h": "괄호 → 곱셈 → 덧셈", "s": "4 × 8 + 3 = 35"}, {"q": "100 − (24 + 16) ÷ 8 = □", "a": 95, "h": "괄호 → 나눗셈 → 뺄셈", "s": "100 − 40 ÷ 8 = 100 − 5 = 95"}, {"q": "72 ÷ 8 × 3 − 5 = □", "a": 22, "h": "나눗셈과 곱셈은 앞에서부터", "s": "9 × 3 − 5 = 22"}, {"q": "1000원으로 300원짜리 연필 2자루를 사면 남는 돈은?", "a": 400, "h": "하나의 식으로: 1000 − 300 × 2", "s": "1000 − 600 = 400 (원)", "u": "원"}, {"q": "한 개 450원 사탕 4개와 1200원 과자 1개의 값은?", "a": 3000, "h": "450 × 4 + 1200", "s": "1800 + 1200 = 3000 (원)", "u": "원"}, {"q": "18 + (42 − 6) ÷ 4 × 2 = □", "a": 36, "h": "괄호 → ÷ → × → +", "s": "18 + 36 ÷ 4 × 2 = 18 + 18 = 36"}], "3": [{"q": "(□ + 8) × 3 = 45 에서 □ 는?", "a": 7, "h": "□ + 8 = 45 ÷ 3", "s": "15 − 8 = 7"}, {"q": "27 + 54 ÷ (□ − 3) = 36 에서 □ 는?", "a": 9, "h": "54 ÷ (□ − 3) = 9", "s": "□ − 3 = 6 → □ = 9"}, {"q": "5000원으로 한 개 600원 지우개 3개와 한 권 850원 공책 2권을 사면 거스름돈은?", "a": 1500, "h": "5000 − (600 × 3 + 850 × 2)", "s": "5000 − 3500 = 1500 (원)", "u": "원"}, {"q": "4 □ 4 □ 4 □ 4 의 □ 세 곳에 +, −, ×, ÷ 중 서로 다른 세 가지를 하나씩 넣을 때 가장 큰 계산 결과는?", "a": 17, "h": "곱셈과 나눗셈이 먼저예요. 4 × 4를 크게 만들고, 빼는 수는 작게!", "s": "4 × 4 + 4 ÷ 4 = 16 + 1 = 17", "top": 1}, {"q": "어떤 수에서 15를 빼고 4를 곱해야 할 것을 잘못하여 15를 더하고 4로 나누었더니 12가 되었어요. 바르게 계산한 값은?", "a": 72, "h": "거꾸로 계산해 어떤 수부터: (□ + 15) ÷ 4 = 12", "s": "어떤 수 33 → (33 − 15) × 4 = 72", "top": 1}]}}, "5-1-2": {"t": "약수와 배수", "concepts": [{"t": "약수와 배수", "body": "<p>어떤 수를 <span class=\"hl\">나누어떨어지게 하는 수</span>가 약수예요. 어떤 수를 1배, 2배, 3배 … 한 수가 배수예요.</p>", "eq": "12의 약수: 1, 2, 3, 4, 6, 12    4의 배수: 4, 8, 12, 16 …", "check": {"q": "30의 약수가 아닌 것은?", "opts": ["5", "6", "8"], "a": 2}}, {"t": "공약수와 최대공약수", "body": "<p>두 수의 공통인 약수가 공약수, 그중 <span class=\"hl\">가장 큰 수</span>가 최대공약수예요. 공약수는 최대공약수의 약수예요.</p>", "eq": "18의 약수 ∩ 24의 약수 = 1, 2, 3, 6 → 최대공약수 6", "check": {"q": "36과 48의 최대공약수는?", "opts": ["6", "12", "4"], "a": 1}}, {"t": "공배수와 최소공배수", "body": "<p>두 수의 공통인 배수가 공배수, 그중 <span class=\"hl\">가장 작은 수</span>가 최소공배수예요. 동시에 출발하는 문제에 써요.</p>", "eq": "4와 6 → 12, 24, 36 … → 최소공배수 12", "check": {"q": "12와 18의 최소공배수는?", "opts": ["36", "72", "6"], "a": 0}}], "P": {"1": [{"q": "12의 약수는 모두 몇 개일까요?", "a": 6, "h": "1, 2, 3, …", "s": "1, 2, 3, 4, 6, 12 → 6개", "u": "개"}, {"q": "18과 24의 최대공약수는?", "a": 6, "h": "공약수 중 가장 큰 수", "s": "6"}, {"q": "4와 6의 최소공배수는?", "a": 12, "h": "4의 배수 중 6의 배수인 가장 작은 수", "s": "12"}, {"q": "7의 배수 중 가장 작은 두 자리 수는?", "a": 14, "h": "7 × 2", "s": "14"}, {"q": "30의 약수 중 가장 큰 수와 가장 작은 수의 합은?", "a": 31, "h": "가장 작은 약수는 언제나 1", "s": "30 + 1 = 31"}, {"q": "9의 배수 중 50에 가장 가까운 수는?", "a": 54, "h": "45와 54를 비교해 보세요.", "s": "45는 5 차이, 54는 4 차이 → 54"}], "2": [{"q": "36과 48의 최대공약수는?", "a": 12, "h": "두 수를 함께 나누는 수로 나누어 보세요.", "s": "12"}, {"q": "12와 18의 최소공배수는?", "a": 36, "h": "최대공약수 6 × 2 × 3", "s": "36"}, {"q": "1부터 100까지의 수 중 6의 배수는 몇 개일까요?", "a": 16, "h": "100 ÷ 6의 몫", "s": "16 (개)", "u": "개"}, {"q": "사탕 24개와 초콜릿 36개를 남김없이 될 수 있는 대로 많은 친구에게 똑같이 나누면 몇 명에게 줄 수 있을까요?", "a": 12, "h": "최대공약수를 구해요.", "s": "12 (명)", "u": "명"}, {"q": "버스 A는 8분, B는 12분마다 출발해요. 동시에 출발한 뒤 다시 동시에 출발하는 것은 몇 분 뒤일까요?", "a": 24, "h": "최소공배수를 구해요.", "s": "24 (분)", "u": "분"}, {"q": "약수가 2개뿐인 수 중 20보다 작은 수는 몇 개일까요?", "a": 8, "h": "1과 자기 자신만 약수인 수예요.", "s": "2, 3, 5, 7, 11, 13, 17, 19 → 8개", "u": "개"}], "3": [{"q": "어떤 수로 50을 나누어도, 74를 나누어도 나머지가 2예요. 어떤 수 중 가장 큰 수는?", "a": 24, "h": "48과 72를 나누어떨어지게 하는 수예요.", "s": "48과 72의 최대공약수 24"}, {"q": "가로 18 cm, 세로 12 cm인 종이를 같은 방향으로 겹치지 않게 늘어놓아 가장 작은 정사각형을 만들려면 몇 장이 필요할까요?", "a": 6, "h": "정사각형 한 변은 18과 12의 최소공배수예요.", "s": "한 변 36 cm → 가로 2장 × 세로 3장 = 6 (장)", "u": "장"}, {"q": "4로도 6으로도 나누어떨어지는 세 자리 수 중 가장 작은 수는?", "a": 108, "h": "4와 6의 공배수 = 12의 배수", "s": "12 × 9 = 108"}, {"q": "어떤 수를 6, 8, 9로 나누면 모두 나머지가 3이에요. 이런 수 중 가장 작은 세 자리 수는?", "a": 147, "h": "(어떤 수 − 3)은 6, 8, 9의 공배수예요.", "s": "최소공배수 72 → 72 × 2 + 3 = 147", "top": 1}, {"q": "1부터 50까지의 수 중 약수의 개수가 홀수인 수는 몇 개일까요?", "a": 7, "h": "약수는 보통 짝을 지어요(1과 12, 2와 6 …). 짝이 없는 약수가 생기는 수는?", "s": "같은 수를 두 번 곱한 수: 1, 4, 9, 16, 25, 36, 49 → 7개", "u": "개", "top": 1}]}}, "5-1-3": {"t": "대응 관계", "concepts": [{"t": "대응 관계 찾기", "body": "<p>한 양이 변할 때 다른 양이 <span class=\"hl\">일정하게 따라 변하는</span> 관계예요. 표를 만들어 규칙을 찾아요.</p>", "eq": "의자 1개 → 다리 4개, 2개 → 8개 …", "check": {"q": "의자 9개의 다리는?", "opts": ["36개", "13개", "45개"], "a": 0}}, {"t": "기호로 나타내기", "body": "<p>두 양을 □, △ 같은 기호로 나타내면 <span class=\"hl\">대응 관계를 식으로</span> 쓸 수 있어요.</p>", "eq": "△ = □ × 5    △ = □ + 8", "check": {"q": "△ = □ × 5 에서 □ 가 7이면 △ 는?", "opts": ["12", "35", "2"], "a": 1}}, {"t": "생활 속 대응 관계", "body": "<p>나이, 시각, 둘레, 자르기 횟수처럼 생활 속에서 대응 관계를 찾아 <span class=\"hl\">모르는 값을 구해요</span>.</p>", "eq": "종이를 □번 자르면 △ = □ + 1 조각", "check": {"q": "종이를 9번 자르면 몇 조각?", "opts": ["9", "10", "18"], "a": 1}}], "P": {"1": [{"q": "의자 1개에 다리가 4개예요. 의자 9개의 다리는 모두 몇 개일까요?", "a": 36, "h": "△ = □ × 4", "s": "36 (개)", "u": "개"}, {"q": "△ = □ × 5 에서 □ 가 7이면 △ 는?", "a": 35, "h": "7 × 5", "s": "35"}, {"q": "오징어 한 마리의 다리는 10개예요. 다리가 60개면 오징어는 몇 마리일까요?", "a": 6, "h": "60 ÷ 10", "s": "6 (마리)", "u": "마리"}, {"q": "형은 동생보다 3살 많아요. 동생이 9살이면 형은 몇 살일까요?", "a": 12, "h": "형 = 동생 + 3", "s": "12 (살)", "u": "살"}, {"q": "△ = □ + 8 에서 △ 가 20이면 □ 는?", "a": 12, "h": "□ = △ − 8", "s": "12"}, {"q": "1분에 물이 6 L씩 나와요. 8분 동안 나오는 물은?", "a": 48, "h": "6 × 8", "s": "48 (L)", "u": "L"}], "2": [{"q": "네모난 탁자 하나에 4명이 앉고, 탁자를 한 줄로 이으면 앉는 사람 수 = 탁자 수 × 2 + 2 예요. 탁자 6개에는 몇 명이 앉을까요?", "a": 14, "h": "식에 6을 넣어요.", "s": "6 × 2 + 2 = 14 (명)", "u": "명"}, {"q": "△ ÷ □ = 4 에서 △ 가 52이면 □ 는?", "a": 13, "h": "□ = △ ÷ 4", "s": "13"}, {"q": "서울이 오전 9시일 때 런던은 오전 0시(자정)예요. 서울이 오후 3시면 런던은 몇 시일까요? (24시각으로)", "a": 6, "h": "서울은 런던보다 9시간 빨라요.", "s": "15 − 9 = 6 (시)", "u": "시"}, {"q": "정삼각형의 둘레가 39 cm면 한 변은?", "a": 13, "h": "둘레 = 한 변 × 3", "s": "13 (cm)", "u": "cm"}, {"q": "종이를 한 번 자르면 2조각, 두 번 자르면 3조각이 돼요. 9번 자르면 몇 조각일까요?", "a": 10, "h": "조각 수 = 자른 횟수 + 1", "s": "10 (조각)", "u": "조각"}, {"q": "도화지 □ 장에 스티커 △ 개를 붙였고 △ = □ × 6 + 2 예요. 스티커가 50개면 도화지는?", "a": 8, "h": "□ × 6 = 48", "s": "8 (장)", "u": "장"}], "3": [{"q": "성냥개비로 삼각형을 옆으로 이어 붙여요. 1개는 3개비, 2개는 5개비예요. 삼각형 15개에는 몇 개비가 필요할까요?", "a": 31, "h": "삼각형이 하나 늘 때 2개비씩 늘어요.", "s": "개비 = 삼각형 수 × 2 + 1 → 31 (개)", "u": "개"}, {"q": "통나무를 6도막으로 자르는 데 15분이 걸려요. 같은 빠르기로 10도막으로 자르면 몇 분일까요?", "a": 27, "h": "6도막은 몇 번 자른 것일까요?", "s": "5번에 15분 → 1번에 3분, 10도막은 9번 → 27 (분)", "u": "분"}, {"q": "엘리베이터가 한 층 올라가는 데 4초 걸려요. 1층에서 9층까지는 몇 초일까요?", "a": 32, "h": "1층에서 9층까지 몇 층을 올라갈까요?", "s": "8층 × 4 = 32 (초)", "u": "초"}, {"q": "정사각형 둘레에 바둑돌을 한 변에 12개씩 놓았어요(꼭짓점도 놓아요). 바둑돌은 모두 몇 개일까요?", "a": 44, "h": "꼭짓점의 바둑돌은 두 변에 함께 세어져요.", "s": "12 × 4 − 4 = 44 (개)", "u": "개", "top": 1}, {"q": "△ = □ × 3 − 4 이고 △ 와 □ 의 합이 60이에요. □ 는?", "a": 16, "h": "□ + (□ × 3 − 4) = 60", "s": "□ × 4 = 64 → □ = 16", "top": 1}]}}, "5-1-4": {"t": "약분과 통분", "concepts": [{"t": "크기가 같은 분수", "body": "<p>분모와 분자에 <span class=\"hl\">0이 아닌 같은 수를 곱하거나 나누면</span> 크기가 같은 분수가 돼요.</p>", "eq": "2/3 = 4/6 = 8/12", "check": {"q": "2/3과 크기가 같은 분수 중 분모가 12인 것은?", "opts": ["8/12", "6/12", "4/12"], "a": 0}}, {"t": "약분과 기약분수", "body": "<p>분모와 분자를 공약수로 나누는 것이 약분이에요. <span class=\"hl\">더 이상 약분할 수 없는</span> 분수가 기약분수예요. 최대공약수로 나누면 한 번에 끝!</p>", "eq": "24/36 → 최대공약수 12로 나누어 2/3", "check": {"q": "12/18 의 기약분수는?", "opts": ["2/3", "6/9", "4/6"], "a": 0}}, {"t": "통분과 크기 비교", "body": "<p>분모를 같게 만드는 것이 통분이에요. 보통 <span class=\"hl\">최소공배수</span>를 공통분모로 써요. 분모가 같으면 분자가 클수록 커요.</p>", "eq": "5/6 = 20/24, 7/8 = 21/24 → 7/8이 더 큼", "check": {"q": "3/4과 5/6을 통분할 때 가장 작은 공통분모는?", "opts": ["12", "24", "10"], "a": 0}}], "P": {"1": [{"q": "6/8을 기약분수로 나타내세요.", "a": "3/4", "h": "2로 나눠요.", "s": "3/4", "f": 1}, {"q": "12/18을 기약분수로 나타내세요.", "a": "2/3", "h": "최대공약수 6으로 나눠요.", "s": "2/3", "f": 1}, {"q": "2/3와 크기가 같은 분수 중 분모가 12인 분수의 분자는?", "a": 8, "h": "분모에 4를 곱했으니 분자에도 4를!", "s": "2 × 4 = 8"}, {"q": "3/4과 5/6을 최소공배수로 통분할 때 공통분모는?", "a": 12, "h": "4와 6의 최소공배수", "s": "12"}, {"q": "9/12를 약분할 수 있는 1이 아닌 수 중 가장 큰 수는?", "a": 3, "h": "9와 12의 최대공약수", "s": "3"}, {"q": "0.6을 기약분수로 나타내세요.", "a": "3/5", "h": "0.6 = 6/10", "s": "6/10 = 3/5", "f": 1}], "2": [{"q": "24/36을 기약분수로 나타내세요.", "a": "2/3", "h": "최대공약수 12", "s": "2/3", "f": 1}, {"q": "5/6과 7/8 중 더 큰 분수는?", "a": "7/8", "h": "24로 통분해 보세요.", "s": "20/24 < 21/24 → 7/8", "f": 1}, {"q": "분모가 15인 진분수 중 기약분수는 몇 개일까요?", "a": 8, "h": "분자가 3이나 5의 배수면 약분돼요.", "s": "1, 2, 4, 7, 8, 11, 13, 14 → 8개", "u": "개"}, {"q": "3/5 < □/10 < 9/10 에서 □ 안에 들어갈 수 있는 자연수는 몇 개일까요?", "a": 2, "h": "3/5 = 6/10", "s": "6 < □ < 9 → 7, 8 → 2개", "u": "개"}, {"q": "0.75를 기약분수로 나타내세요.", "a": "3/4", "h": "0.75 = 75/100", "s": "3/4", "f": 1}, {"q": "4/7과 크기가 같은 분수 중 분모와 분자의 합이 44인 분수의 분모는?", "a": 28, "h": "분자 4 × □, 분모 7 × □ 라 하면 합은 11 × □", "s": "□ = 4 → 16/28, 분모 28"}], "3": [{"q": "분모와 분자의 차가 15이고, 기약분수로 나타내면 2/7인 분수의 분모는?", "a": 21, "h": "분자 2 × □, 분모 7 × □ 의 차는 5 × □", "s": "□ = 3 → 6/21, 분모 21"}, {"q": "1/3보다 크고 3/4보다 작은 분수 중 분모가 12인 분수는 몇 개일까요?", "a": 4, "h": "1/3 = 4/12, 3/4 = 9/12", "s": "5/12, 6/12, 7/12, 8/12 → 4개", "u": "개"}, {"q": "3/8 < □/24 < 2/3 에서 □ 안에 들어갈 수 있는 자연수는 몇 개일까요?", "a": 6, "h": "분모를 24로 통분해요.", "s": "9/24 < □/24 < 16/24 → 10 ~ 15 → 6개", "u": "개"}, {"q": "분모가 24인 진분수 중 기약분수는 몇 개일까요?", "a": 8, "h": "분자가 2나 3의 배수면 약분돼요.", "s": "1, 5, 7, 11, 13, 17, 19, 23 → 8개", "u": "개", "top": 1}, {"q": "7/12보다 크고 11/18보다 작은 분수 중 분모가 72인 분수는 몇 개일까요?", "a": 1, "h": "두 분수를 분모 72로 통분해 보세요.", "s": "42/72 < □/72 < 44/72 → 43/72 하나 → 1개", "u": "개", "top": 1}]}}, "5-1-5": {"t": "분수의 덧셈과 뺄셈", "concepts": [{"t": "통분하여 더하기", "body": "<p>분모가 다르면 <span class=\"hl\">통분한 뒤</span> 분자끼리 더하고, 기약분수로 나타내요.</p>", "eq": "1/2 + 1/3 = 3/6 + 2/6 = 5/6", "check": {"q": "2/5 + 3/10 은?", "opts": ["7/10", "5/15", "5/10"], "a": 0}}, {"t": "통분하여 빼기", "body": "<p>뺄셈도 통분해서 <span class=\"hl\">분자끼리</span> 빼요.</p>", "eq": "3/4 − 1/6 = 9/12 − 2/12 = 7/12", "check": {"q": "5/6 − 1/2 은?", "opts": ["1/3", "4/4", "2/6"], "a": 0}}, {"t": "대분수의 덧셈과 뺄셈", "body": "<p><span class=\"hl\">자연수끼리, 분수끼리</span> 계산하거나, 가분수로 바꿔 계산해요. 분수끼리 뺄 수 없으면 자연수에서 1을 받아내려요.</p>", "eq": "4 1/6 − 1 3/4 = 4 2/12 − 1 9/12 = 3 14/12 − 1 9/12 = 2 5/12", "check": {"q": "1 1/2 + 2 1/3 은?", "opts": ["3 5/6", "3 2/5", "3 1/6"], "a": 0}}], "P": {"1": [{"q": "1/2 + 1/3 = □", "a": "5/6", "h": "분모를 6으로!", "s": "3/6 + 2/6 = 5/6", "f": 1}, {"q": "3/4 − 1/6 = □", "a": "7/12", "h": "분모를 12로!", "s": "9/12 − 2/12 = 7/12", "f": 1}, {"q": "2/5 + 3/10 = □", "a": "7/10", "h": "2/5 = 4/10", "s": "7/10", "f": 1}, {"q": "1 1/2 + 2 1/3 = □", "a": "23/6", "h": "분수끼리: 3/6 + 2/6", "s": "3 5/6", "f": 1}, {"q": "3 3/4 − 1 1/2 = □", "a": "9/4", "h": "1/2 = 2/4", "s": "2 1/4", "f": 1}, {"q": "2/3 + 1/4 = □", "a": "11/12", "h": "분모를 12로!", "s": "8/12 + 3/12 = 11/12", "f": 1}], "2": [{"q": "2 2/3 + 1 3/4 = □", "a": "53/12", "h": "8/12 + 9/12 = 17/12", "s": "3 17/12 = 4 5/12", "f": 1}, {"q": "4 1/6 − 1 3/4 = □", "a": "29/12", "h": "2/12에서 9/12를 뺄 수 없어요.", "s": "3 14/12 − 1 9/12 = 2 5/12", "f": 1}, {"q": "물 1 2/5 L와 2 3/4 L를 합하면?", "a": "83/20", "h": "분모를 20으로!", "s": "3 23/20 = 4 3/20 (L)", "u": "L", "f": 1}, {"q": "리본 3 m 중 1 5/8 m를 썼어요. 남은 리본은?", "a": "11/8", "h": "3 = 2 8/8", "s": "1 3/8 (m)", "u": "m", "f": 1}, {"q": "□ + 1 1/6 = 3 1/2 에서 □ 는?", "a": "7/3", "h": "□ = 3 1/2 − 1 1/6", "s": "3 3/6 − 1 1/6 = 2 2/6 = 2 1/3", "f": 1}, {"q": "1/2 + 1/3 + 1/6 = □", "a": 1, "h": "분모를 6으로!", "s": "3/6 + 2/6 + 1/6 = 1"}], "3": [{"q": "어떤 수에서 1 2/3을 빼야 할 것을 잘못하여 더했더니 5 1/4이 되었어요. 바르게 계산한 값은?", "a": "23/12", "h": "어떤 수 = 5 1/4 − 1 2/3", "s": "어떤 수 3 7/12, 3 7/12 − 1 2/3 = 1 11/12", "f": 1}, {"q": "진우는 하루에 일 전체의 1/4, 수아는 1/6을 해요. 둘이 함께 하루 동안 하면 전체의 얼마를 할까요?", "a": "5/12", "h": "1/4 + 1/6", "s": "3/12 + 2/12 = 5/12", "f": 1}, {"q": "철사 3 1/4 m로 한 변이 3/8 m인 정삼각형 2개를 만들었어요. 남은 철사는?", "a": 1, "h": "정삼각형 2개의 둘레는 3/8 m가 6개", "s": "3 1/4 − 2 2/8 = 26/8 − 18/8 = 1 (m)", "u": "m"}, {"q": "1/2 + 1/6 + 1/12 + 1/20 + 1/30 = □", "a": "5/6", "h": "1/6 = 1/2 − 1/3, 1/12 = 1/3 − 1/4 처럼 바꿔 보세요.", "s": "1 − 1/2 + 1/2 − 1/3 + … − 1/6 = 1 − 1/6 = 5/6", "f": 1, "top": 1}, {"q": "1/(1×2) + 1/(2×3) + 1/(3×4) + … + 1/(9×10) 의 값은?", "a": "9/10", "h": "1/(2×3) = 1/2 − 1/3 처럼 두 분수의 차로 나타내 보세요.", "s": "1 − 1/2 + 1/2 − 1/3 + … − 1/10 = 1 − 1/10 = 9/10", "f": 1, "top": 1}]}}, "5-1-6": {"t": "다각형의 둘레와 넓이", "concepts": [{"t": "둘레와 넓이의 단위", "body": "<p>정다각형 둘레 = 한 변 × 변의 수. 넓이는 <span class=\"hl\">1 cm²</span>가 몇 개인지로 재요. 1 m² = 10000 cm²예요.</p>", "eq": "직사각형 넓이 = 가로 × 세로    정사각형 = 한 변 × 한 변", "check": {"q": "1 m² 는 몇 cm²?", "opts": ["100", "1000", "10000"], "a": 2}}, {"t": "평행사변형과 삼각형", "body": "<p>평행사변형 = <span class=\"hl\">밑변 × 높이</span>, 삼각형 = <span class=\"hl\">밑변 × 높이 ÷ 2</span>. 높이는 밑변에 수직인 길이예요.</p>", "eq": "밑변 8, 높이 5 삼각형 → 20 cm²", "check": {"q": "밑변 10 cm, 높이 6 cm인 평행사변형의 넓이는?", "opts": ["60 cm²", "30 cm²", "16 cm²"], "a": 0}}, {"t": "사다리꼴과 마름모", "body": "<p>사다리꼴 = <span class=\"hl\">(윗변 + 아랫변) × 높이 ÷ 2</span>, 마름모 = <span class=\"hl\">두 대각선의 곱 ÷ 2</span>.</p>", "eq": "윗변 6, 아랫변 10, 높이 5 → 40 cm²", "check": {"q": "대각선 8 cm, 12 cm인 마름모의 넓이는?", "opts": ["96 cm²", "48 cm²", "20 cm²"], "a": 1}}], "P": {"1": [{"q": "가로 8 cm, 세로 5 cm인 직사각형의 넓이는?", "a": 40, "h": "가로 × 세로", "s": "40 (cm²)", "u": "cm²"}, {"q": "가로 8 cm, 세로 5 cm인 직사각형의 둘레는?", "a": 26, "h": "(가로 + 세로) × 2", "s": "26 (cm)", "u": "cm"}, {"q": "한 변이 7 cm인 정사각형의 넓이는?", "a": 49, "h": "7 × 7", "s": "49 (cm²)", "u": "cm²"}, {"q": "밑변 10 cm, 높이 6 cm인 평행사변형의 넓이는?", "a": 60, "h": "밑변 × 높이", "s": "60 (cm²)", "u": "cm²"}, {"q": "밑변 8 cm, 높이 5 cm인 삼각형의 넓이는?", "a": 20, "h": "밑변 × 높이 ÷ 2", "s": "20 (cm²)", "u": "cm²"}, {"q": "1 m² 는 몇 cm²일까요?", "a": 10000, "h": "1 m = 100 cm", "s": "100 × 100 = 10000 (cm²)", "u": "cm²"}], "2": [{"q": "윗변 6 cm, 아랫변 10 cm, 높이 5 cm인 사다리꼴의 넓이는?", "a": 40, "h": "(윗변 + 아랫변) × 높이 ÷ 2", "s": "16 × 5 ÷ 2 = 40 (cm²)", "u": "cm²"}, {"q": "두 대각선이 8 cm, 12 cm인 마름모의 넓이는?", "a": 48, "h": "두 대각선의 곱 ÷ 2", "s": "48 (cm²)", "u": "cm²"}, {"q": "넓이가 72 cm²이고 가로가 9 cm인 직사각형의 세로는?", "a": 8, "h": "72 ÷ 9", "s": "8 (cm)", "u": "cm"}, {"q": "넓이가 45 cm²이고 밑변이 10 cm인 삼각형의 높이는?", "a": 9, "h": "높이 = 넓이 × 2 ÷ 밑변", "s": "9 (cm)", "u": "cm"}, {"q": "둘레가 36 cm인 정사각형의 넓이는?", "a": 81, "h": "한 변부터 구해요.", "s": "한 변 9 → 81 (cm²)", "u": "cm²"}, {"q": "2 m² 는 몇 cm²일까요?", "a": 20000, "h": "1 m² = 10000 cm²", "s": "20000 (cm²)", "u": "cm²"}], "3": [{"q": "가로 12 m, 세로 8 m인 밭에 폭 2 m인 길을 가로와 세로로 하나씩(열십자로) 냈어요. 길을 뺀 밭의 넓이는?", "a": 60, "h": "길을 한쪽으로 밀어 붙여도 넓이는 같아요.", "s": "(12 − 2) × (8 − 2) = 60 (m²)", "u": "m²"}, {"q": "밑변이 같은 평행사변형과 삼각형의 넓이가 같아요. 평행사변형의 높이가 6 cm면 삼각형의 높이는?", "a": 12, "h": "삼각형은 ÷ 2가 있어요.", "s": "6 × 2 = 12 (cm)", "u": "cm"}, {"q": "넓이가 54 cm²이고 윗변 5 cm, 아랫변 13 cm인 사다리꼴의 높이는?", "a": 6, "h": "높이 = 넓이 × 2 ÷ (윗변 + 아랫변)", "s": "108 ÷ 18 = 6 (cm)", "u": "cm"}, {"q": "둘레가 24 cm인 직사각형 중 넓이가 가장 넓은 것의 넓이는? (변의 길이는 자연수)", "a": 36, "h": "가로 + 세로 = 12. 여러 가지로 나눠 넓이를 비교해 보세요.", "s": "6 × 6 = 36 이 가장 넓어요 (cm²)", "u": "cm²", "top": 1}, {"q": "마름모의 한 대각선을 2배, 다른 대각선을 3배로 늘리면 넓이는 몇 배가 될까요?", "a": 6, "h": "두 대각선의 곱이 몇 배가 될까요?", "s": "2 × 3 = 6 (배)", "u": "배", "top": 1}]}}, "5-2-1": {"t": "수의 범위와 올림, 버림, 반올림", "concepts": [{"t": "이상, 이하, 초과, 미만", "body": "<p><span class=\"hl\">이상·이하</span>는 그 수를 포함하고, <span class=\"hl\">초과·미만</span>은 그 수를 포함하지 않아요.</p>", "eq": "35 이상 40 미만 → 35, 36, 37, 38, 39", "check": {"q": "12 초과 18 이하 자연수의 개수는?", "opts": ["6개", "7개", "5개"], "a": 0}}, {"t": "올림과 버림", "body": "<p>올림은 구하려는 자리 아래 수를 <span class=\"hl\">올려서</span>, 버림은 아래 수를 <span class=\"hl\">0으로 버려서</span> 나타내요.</p>", "eq": "4372 → 올림 백의 자리 4400, 버림 천의 자리 4000", "check": {"q": "4372를 버림하여 천의 자리까지 나타내면?", "opts": ["4000", "5000", "4300"], "a": 0}}, {"t": "반올림", "body": "<p>구하려는 자리 바로 아래 숫자가 <span class=\"hl\">0~4이면 버리고, 5~9이면 올려요</span>.</p>", "eq": "4372 → 반올림 십의 자리 4370    2.46 → 소수 첫째 자리 2.5", "check": {"q": "6.75를 반올림하여 소수 첫째 자리까지 나타내면?", "opts": ["6.8", "6.7", "7.0"], "a": 0}}], "P": {"1": [{"q": "35 이상 40 미만인 자연수는 몇 개일까요?", "a": 5, "h": "40은 포함되지 않아요.", "s": "35, 36, 37, 38, 39 → 5개", "u": "개"}, {"q": "12 초과 18 이하인 자연수는 몇 개일까요?", "a": 6, "h": "12는 포함되지 않아요.", "s": "13 ~ 18 → 6개", "u": "개"}, {"q": "4372를 올림하여 백의 자리까지 나타내세요.", "a": 4400, "h": "백의 자리 아래 72를 올려요.", "s": "4400"}, {"q": "4372를 버림하여 천의 자리까지 나타내세요.", "a": 4000, "h": "천의 자리 아래를 0으로!", "s": "4000"}, {"q": "4372를 반올림하여 십의 자리까지 나타내세요.", "a": 4370, "h": "일의 자리 2는 버려요.", "s": "4370"}, {"q": "2.46을 반올림하여 소수 첫째 자리까지 나타내세요.", "a": 2.5, "h": "소수 둘째 자리 6은 올려요.", "s": "2.5"}], "2": [{"q": "반올림하여 십의 자리까지 나타내면 80이 되는 자연수 중 가장 큰 수는?", "a": 84, "h": "85를 반올림하면 90이에요.", "s": "75 ~ 84 → 84"}, {"q": "학생 243명이 버스 한 대에 40명씩 타요. 버스는 적어도 몇 대 필요할까요?", "a": 7, "h": "남은 학생도 타야 하니 올림!", "s": "243 ÷ 40 = 6 … 3 → 7 (대)", "u": "대"}, {"q": "사과 1238개를 한 상자에 100개씩 담아 팔아요. 몇 상자까지 팔 수 있을까요?", "a": 12, "h": "꽉 찬 상자만 팔 수 있으니 버림!", "s": "12 (상자)", "u": "상자"}, {"q": "6.75를 올림하여 소수 첫째 자리까지 나타내세요.", "a": 6.8, "h": "소수 둘째 자리 5를 올려요.", "s": "6.8"}, {"q": "버림하여 백의 자리까지 나타내면 2300이 되는 자연수 중 가장 큰 수는?", "a": 2399, "h": "2300부터 2399까지!", "s": "2399"}, {"q": "100원짜리 동전만으로 3460원짜리 물건을 사려면 동전이 적어도 몇 개 필요할까요?", "a": 35, "h": "모자라면 안 되니 올림!", "s": "3500원 → 35 (개)", "u": "개"}], "3": [{"q": "반올림하여 천의 자리까지 나타내면 5000이 되는 자연수는 모두 몇 개일까요?", "a": 1000, "h": "4500 이상 5500 미만", "s": "4500 ~ 5499 → 1000개", "u": "개"}, {"q": "올림하여 십의 자리까지 나타내면 230, 버림하여 십의 자리까지 나타내면 220인 자연수는 몇 개일까요?", "a": 9, "h": "올림 230 → 221 ~ 230, 버림 220 → 220 ~ 229", "s": "221 ~ 229 → 9개", "u": "개"}, {"q": "숫자 카드 2, 5, 7, 9를 한 번씩 써서 만든 가장 큰 네 자리 수를 반올림하여 백의 자리까지 나타내세요.", "a": 9800, "h": "가장 큰 수부터 만들어요.", "s": "9752 → 9800"}, {"q": "어떤 자연수를 7로 나눈 몫을 반올림하여 일의 자리까지 나타냈더니 12였어요. 이런 자연수 중 가장 큰 수는?", "a": 87, "h": "몫이 11.5 이상 12.5 미만이어야 해요.", "s": "□ ÷ 7 < 12.5 → □ < 87.5 → 87", "top": 1}, {"q": "어떤 자연수에 3을 곱한 뒤 반올림하여 십의 자리까지 나타냈더니 150이었어요. 어떤 수는 모두 몇 개일까요?", "a": 3, "h": "3을 곱한 수가 145 이상 155 미만이어야 해요.", "s": "147, 150, 153 → 49, 50, 51 → 3개", "u": "개", "top": 1}]}}, "5-2-2": {"t": "분수의 곱셈", "concepts": [{"t": "(분수) × (자연수)", "body": "<p>분자와 자연수를 곱하고, <span class=\"hl\">약분할 수 있으면 먼저 약분</span>하면 편해요.</p>", "eq": "2/5 × 3 = 6/5 = 1 1/5    5/6 × 3 = 5/2", "check": {"q": "3 × 5/6 은?", "opts": ["5/2", "15/18", "8/6"], "a": 0}}, {"t": "(분수) × (분수)", "body": "<p><span class=\"hl\">분자끼리, 분모끼리</span> 곱해요. 진분수끼리 곱하면 원래 수보다 작아져요.</p>", "eq": "2/3 × 3/4 = 6/12 = 1/2", "check": {"q": "1/3 × 1/5 는?", "opts": ["1/15", "2/8", "1/8"], "a": 0}}, {"t": "대분수의 곱셈", "body": "<p>대분수는 <span class=\"hl\">가분수로 바꾼 뒤</span> 곱해요.</p>", "eq": "1 2/3 × 2 1/4 = 5/3 × 9/4 = 15/4 = 3 3/4", "check": {"q": "1 1/2 × 4 는?", "opts": ["6", "4 1/2", "5"], "a": 0}}], "P": {"1": [{"q": "2/5 × 3 = □", "a": "6/5", "h": "분자 × 자연수", "s": "6/5 = 1 1/5", "f": 1}, {"q": "3 × 5/6 = □", "a": "5/2", "h": "3과 6을 약분해요.", "s": "5/2 = 2 1/2", "f": 1}, {"q": "2/3 × 3/4 = □", "a": "1/2", "h": "분자끼리, 분모끼리", "s": "6/12 = 1/2", "f": 1}, {"q": "1 1/2 × 4 = □", "a": 6, "h": "1 1/2 = 3/2", "s": "3/2 × 4 = 6"}, {"q": "1/3 × 1/5 = □", "a": "1/15", "h": "분모끼리 곱해요.", "s": "1/15", "f": 1}, {"q": "2 1/4 × 2/3 = □", "a": "3/2", "h": "2 1/4 = 9/4", "s": "9/4 × 2/3 = 3/2 = 1 1/2", "f": 1}], "2": [{"q": "1 2/3 × 2 1/4 = □", "a": "15/4", "h": "5/3 × 9/4", "s": "15/4 = 3 3/4", "f": 1}, {"q": "1 m의 무게가 3/4 kg인 막대 2 2/3 m의 무게는?", "a": 2, "h": "3/4 × 8/3", "s": "2 (kg)", "u": "kg"}, {"q": "한 시간에 4 1/2 km를 걷는 사람이 2/3시간 동안 걷는 거리는?", "a": 3, "h": "9/2 × 2/3", "s": "3 (km)", "u": "km"}, {"q": "가로 2 1/2 m, 세로 1 3/5 m인 직사각형의 넓이는?", "a": 4, "h": "5/2 × 8/5", "s": "4 (m²)", "u": "m²"}, {"q": "60의 3/4은 얼마일까요?", "a": 45, "h": "60 × 3/4", "s": "45"}, {"q": "3/4 × 2/9 × 6 = □", "a": 1, "h": "약분을 먼저 하면 쉬워요.", "s": "1"}], "3": [{"q": "전체 학생 240명 중 3/8이 여학생이고, 여학생의 2/3가 안경을 써요. 안경 쓴 여학생은 몇 명일까요?", "a": 60, "h": "240 × 3/8 × 2/3", "s": "여학생 90명 → 60 (명)", "u": "명"}, {"q": "가로가 3 1/3 m, 세로는 가로의 3/5인 직사각형의 넓이는?", "a": "20/3", "h": "세로 = 10/3 × 3/5 = 2", "s": "10/3 × 2 = 20/3 = 6 2/3 (m²)", "u": "m²", "f": 1}, {"q": "공이 떨어진 높이의 2/3만큼 튀어 올라요. 27 m에서 떨어뜨렸을 때 세 번째로 튀어 오른 높이는?", "a": 8, "h": "27 × 2/3 × 2/3 × 2/3", "s": "18 → 12 → 8 (m)", "u": "m"}, {"q": "1/2 × 2/3 × 3/4 × … × 9/10 의 값은?", "a": "1/10", "h": "분자와 분모가 서로 약분돼요.", "s": "남는 것은 1/10", "f": 1, "top": 1}, {"q": "어떤 일을 첫날 전체의 2/5, 둘째 날 남은 일의 3/4을 했어요. 남은 일은 전체의 얼마일까요?", "a": "3/20", "h": "첫날 뒤 남은 일 3/5의 1/4이 남아요.", "s": "3/5 × 1/4 = 3/20", "f": 1, "top": 1}]}}, "5-2-3": {"t": "합동과 대칭", "concepts": [{"t": "합동", "body": "<p>모양과 크기가 같아서 <span class=\"hl\">포개었을 때 완전히 겹치는</span> 두 도형이 합동이에요. 대응변의 길이와 대응각의 크기가 같아요.</p>", "eq": "합동인 삼각형: 한쪽 각 50°, 60° → 다른 쪽 세 번째 각 70°", "check": {"q": "합동인 두 사각형 중 하나의 둘레가 30 cm면 다른 하나는?", "opts": ["30 cm", "15 cm", "60 cm"], "a": 0}}, {"t": "선대칭도형", "body": "<p>한 직선(대칭축)을 따라 접으면 <span class=\"hl\">완전히 겹치는</span> 도형이에요. 대칭축은 대응점을 이은 선분을 수직으로 반으로 나눠요.</p>", "eq": "정사각형 대칭축 4개, 정삼각형 3개, 원은 셀 수 없이 많음", "check": {"q": "직사각형의 대칭축은 몇 개?", "opts": ["2개", "4개", "1개"], "a": 0}}, {"t": "점대칭도형", "body": "<p>한 점(대칭의 중심)을 중심으로 <span class=\"hl\">180° 돌렸을 때 겹치는</span> 도형이에요. 중심은 대응점을 이은 선분을 반으로 나눠요.</p>", "eq": "중심에서 대응점까지 4 cm → 두 대응점 사이 8 cm", "check": {"q": "평행사변형은?", "opts": ["점대칭도형", "선대칭도형만", "둘 다 아님"], "a": 0}}], "P": {"1": [{"q": "정사각형의 대칭축은 몇 개일까요?", "a": 4, "h": "접어서 겹치는 선을 모두 찾아요.", "s": "4 (개)", "u": "개"}, {"q": "정삼각형의 대칭축은 몇 개일까요?", "a": 3, "h": "꼭짓점에서 마주 보는 변의 가운데로!", "s": "3 (개)", "u": "개"}, {"q": "선대칭도형에서 대칭축 한쪽의 각이 50°면 대응각은?", "a": 50, "h": "대응각의 크기는 같아요.", "s": "50 (°)", "u": "°"}, {"q": "점대칭도형에서 대칭의 중심부터 한 점까지 4 cm면 그 점과 대응점 사이는?", "a": 8, "h": "중심이 가운데에 있어요.", "s": "8 (cm)", "u": "cm"}, {"q": "합동인 두 사각형 중 하나의 둘레가 30 cm면 다른 하나의 둘레는?", "a": 30, "h": "대응변이 모두 같아요.", "s": "30 (cm)", "u": "cm"}, {"q": "직사각형의 대칭축은 몇 개일까요?", "a": 2, "h": "대각선으로 접으면 겹칠까요?", "s": "가로, 세로 가운데 → 2 (개)", "u": "개"}], "2": [{"q": "정육각형의 대칭축은 몇 개일까요?", "a": 6, "h": "정다각형의 대칭축 = 변의 수", "s": "6 (개)", "u": "개"}, {"q": "대칭축이 밑변을 수직으로 나눈 이등변삼각형에서 한쪽이 5 cm면 밑변은?", "a": 10, "h": "대칭축은 밑변을 반으로 나눠요.", "s": "10 (cm)", "u": "cm"}, {"q": "합동인 두 삼각형 중 하나의 두 각이 50°, 60°예요. 다른 삼각형에서 나머지 대응각은?", "a": 70, "h": "세 각의 합은 180°", "s": "70 (°)", "u": "°"}, {"q": "점대칭인 평행사변형의 한 각이 75°면 그 대응각은?", "a": 75, "h": "대응각은 크기가 같아요.", "s": "75 (°)", "u": "°"}, {"q": "정팔각형의 대칭축은 몇 개일까요?", "a": 8, "h": "변의 수와 같아요.", "s": "8 (개)", "u": "개"}, {"q": "대칭축 한쪽에 있는 변들의 길이 합이 14 cm인 선대칭도형의 둘레는? (대칭축 위의 변은 없어요)", "a": 28, "h": "반대쪽도 똑같아요.", "s": "14 × 2 = 28 (cm)", "u": "cm"}], "3": [{"q": "둘레가 40 cm인 점대칭 평행사변형의 한 변이 8 cm예요. 이웃한 변은?", "a": 12, "h": "마주 보는 변은 대응변이에요.", "s": "40 ÷ 2 − 8 = 12 (cm)", "u": "cm"}, {"q": "알파벳 A, B, C, D, E, H, I, M, O, X 중 점대칭인 글자는 몇 개일까요?", "a": 4, "h": "180° 돌려도 같은 글자를 찾아요.", "s": "H, I, O, X → 4개", "u": "개"}, {"q": "선대칭도형인 오각형에서 대칭축 위에 꼭짓점 하나가 있고, 한쪽의 두 변이 4 cm, 6 cm예요. 대칭축과 만나는 변이 3 cm일 때 둘레는?", "a": 23, "h": "대칭축이 가로지르는 변은 하나뿐이에요.", "s": "(4 + 6) × 2 + 3 = 23 (cm)", "u": "cm"}, {"q": "대칭축이 12개인 정다각형의 한 각은 몇 도일까요?", "a": 150, "h": "대칭축 12개면 정십이각형이에요.", "s": "1800° ÷ 12 = 150 (°)", "u": "°", "top": 1}, {"q": "알파벳 A, H, N, O, S, X, Z 중 선대칭도형이면서 점대칭도형인 것은 몇 개일까요?", "a": 3, "h": "N, S, Z는 점대칭이지만 접어서 겹칠까요?", "s": "H, O, X → 3개", "u": "개", "top": 1}]}}, "5-2-5": {"t": "직육면체와 정육면체", "concepts": [{"t": "직육면체와 정육면체", "body": "<p>직사각형 6개로 둘러싸인 도형이 직육면체, <span class=\"hl\">정사각형 6개</span>로 둘러싸인 도형이 정육면체예요. 면 6, 모서리 12, 꼭짓점 8.</p>", "eq": "정육면체 한 모서리 5 cm → 모서리 합 5 × 12 = 60 cm", "check": {"q": "직육면체의 모서리는 몇 개?", "opts": ["8개", "12개", "6개"], "a": 1}}, {"t": "면 사이의 관계", "body": "<p>마주 보는 두 면은 <span class=\"hl\">평행</span>하고(3쌍), 한 면과 만나는 면 4개는 그 면과 <span class=\"hl\">수직</span>이에요.</p>", "eq": "한 면과 수직인 면 4개, 평행한 면 1개", "check": {"q": "직육면체에서 서로 평행한 면은 몇 쌍?", "opts": ["3쌍", "2쌍", "6쌍"], "a": 0}}, {"t": "겨냥도와 전개도", "body": "<p>겨냥도는 보이는 모서리는 실선, <span class=\"hl\">보이지 않는 모서리는 점선</span>(3개)으로 그려요. 전개도는 펼친 그림이에요.</p>", "eq": "겨냥도: 보이는 면 3, 보이는 꼭짓점 7", "check": {"q": "겨냥도에서 보이지 않는 모서리는 몇 개?", "opts": ["3개", "4개", "1개"], "a": 0}}], "P": {"1": [{"q": "직육면체의 면은 몇 개일까요?", "a": 6, "h": "주사위를 떠올려요.", "s": "6 (개)", "u": "개"}, {"q": "직육면체의 모서리는 몇 개일까요?", "a": 12, "h": "4개씩 3묶음", "s": "12 (개)", "u": "개"}, {"q": "직육면체의 꼭짓점은 몇 개일까요?", "a": 8, "h": "위 4개, 아래 4개", "s": "8 (개)", "u": "개"}, {"q": "한 모서리가 5 cm인 정육면체의 모든 모서리 길이의 합은?", "a": 60, "h": "5 × 12", "s": "60 (cm)", "u": "cm"}, {"q": "직육면체에서 한 면과 수직인 면은 몇 개일까요?", "a": 4, "h": "마주 보는 면을 빼고 세요.", "s": "4 (개)", "u": "개"}, {"q": "겨냥도에서 보이지 않는 모서리는 몇 개일까요?", "a": 3, "h": "점선으로 그린 모서리", "s": "3 (개)", "u": "개"}], "2": [{"q": "가로 5 cm, 세로 3 cm, 높이 4 cm인 직육면체의 모든 모서리 길이의 합은?", "a": 48, "h": "같은 길이 모서리가 4개씩!", "s": "(5 + 3 + 4) × 4 = 48 (cm)", "u": "cm"}, {"q": "모든 모서리 길이의 합이 96 cm인 정육면체의 한 모서리는?", "a": 8, "h": "96 ÷ 12", "s": "8 (cm)", "u": "cm"}, {"q": "겨냥도에서 보이는 면은 몇 개일까요?", "a": 3, "h": "앞, 위, 옆", "s": "3 (개)", "u": "개"}, {"q": "겨냥도에서 보이는 꼭짓점은 몇 개일까요?", "a": 7, "h": "뒤쪽 아래 꼭짓점 하나만 숨어요.", "s": "7 (개)", "u": "개"}, {"q": "직육면체에서 서로 평행한 면은 몇 쌍일까요?", "a": 3, "h": "마주 보는 면끼리", "s": "3 (쌍)", "u": "쌍"}, {"q": "정육면체 전개도에서 한 면의 넓이가 16 cm²일 때 모든 면의 넓이의 합은?", "a": 96, "h": "면이 6개", "s": "16 × 6 = 96 (cm²)", "u": "cm²"}], "3": [{"q": "마주 보는 면의 눈의 합이 7인 주사위를 한 번에 세 면이 보이게 놓을 때 보이는 눈의 합이 가장 큰 경우는?", "a": 15, "h": "6, 5, 4는 서로 마주 보지 않아요.", "s": "6 + 5 + 4 = 15"}, {"q": "가로가 세로의 2배이고 높이는 세로와 같은 직육면체의 모든 모서리 길이의 합이 64 cm예요. 가로는?", "a": 8, "h": "세로를 □라 하면 (2□ + □ + □) × 4 = 64", "s": "16 × □ = 64 → □ = 4, 가로 8 (cm)", "u": "cm"}, {"q": "한 모서리가 3 cm인 정육면체의 전개도는 둘레에 모서리가 14개 있어요. 전개도의 둘레는?", "a": 42, "h": "3 × 14", "s": "42 (cm)", "u": "cm"}, {"q": "한 모서리 1 cm인 쌓기나무 27개로 큰 정육면체를 만들었어요. 겉에 드러난 작은 정사각형 면은 바닥까지 모두 몇 개일까요?", "a": 54, "h": "큰 정육면체의 한 면에는 작은 면이 몇 개?", "s": "3 × 3 = 9개씩 6면 → 54 (개)", "u": "개", "top": 1}, {"q": "가로 20 cm, 세로 15 cm, 높이 10 cm인 상자를 리본으로 가로와 세로 방향으로 한 바퀴씩 둘러 묶었어요. 매듭에 25 cm를 썼다면 리본은 모두 몇 cm일까요?", "a": 135, "h": "가로 방향 한 바퀴 = 가로 × 2 + 높이 × 2", "s": "(20×2 + 10×2) + (15×2 + 10×2) + 25 = 135 (cm)", "u": "cm", "top": 1}]}}, "5-2-6": {"t": "평균과 가능성", "concepts": [{"t": "평균", "body": "<p>평균 = <span class=\"hl\">자료의 값을 모두 더한 수 ÷ 자료의 수</span>. 자료를 대표하는 값이에요.</p>", "eq": "80, 90, 85 → 255 ÷ 3 = 85", "check": {"q": "4, 6, 8, 10 의 평균은?", "opts": ["7", "6", "8"], "a": 0}}, {"t": "평균 이용하기", "body": "<p>평균 × 자료의 수 = <span class=\"hl\">전체의 합</span>. 모르는 값이나 목표 점수를 구할 수 있어요.</p>", "eq": "평균 15인 다섯 수의 합 = 75", "check": {"q": "4명의 평균 키 140, 5번째 150 → 평균?", "opts": ["142", "145", "141"], "a": 0}}, {"t": "일이 일어날 가능성", "body": "<p><span class=\"hl\">불가능하다 0</span>, <span class=\"hl\">반반이다 1/2</span>, <span class=\"hl\">확실하다 1</span>처럼 수로 나타낼 수 있어요.</p>", "eq": "동전 앞면 → 1/2    주사위 눈 7 → 0", "check": {"q": "빨간 공만 든 주머니에서 빨간 공을 꺼낼 가능성은?", "opts": ["1", "1/2", "0"], "a": 0}}], "P": {"1": [{"q": "4, 6, 8, 10의 평균은?", "a": 7, "h": "모두 더해 4로 나눠요.", "s": "28 ÷ 4 = 7"}, {"q": "수학 점수 80, 90, 85점의 평균은?", "a": 85, "h": "255 ÷ 3", "s": "85 (점)", "u": "점"}, {"q": "주사위를 던져 눈 7이 나올 가능성을 수로 나타내세요.", "a": 0, "h": "주사위 눈은 1 ~ 6", "s": "불가능 → 0"}, {"q": "동전을 던져 그림 면이 나올 가능성을 수로 나타내세요.", "a": "1/2", "h": "두 가지 중 하나", "s": "1/2", "f": 1}, {"q": "줄넘기를 5일 동안 모두 250번 했어요. 하루 평균은?", "a": 50, "h": "250 ÷ 5", "s": "50 (번)", "u": "번"}, {"q": "빨간 공만 든 주머니에서 빨간 공을 꺼낼 가능성을 수로 나타내세요.", "a": 1, "h": "반드시 빨간 공이 나와요.", "s": "확실 → 1"}], "2": [{"q": "평균이 15인 다섯 수의 합은?", "a": 75, "h": "평균 × 자료의 수", "s": "15 × 5 = 75"}, {"q": "4명의 평균 키가 140 cm인 모둠에 150 cm인 친구가 들어오면 평균 키는?", "a": 142, "h": "전체 키의 합부터!", "s": "(560 + 150) ÷ 5 = 142 (cm)", "u": "cm"}, {"q": "국어 75점, 수학 85점일 때 세 과목 평균이
